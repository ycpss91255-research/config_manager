# CI 直接寫出來，不呼叫共用的 reusable worker（設計附錄 A.1：採用那套 worker 展開
# 就等於連模板的發版機制一起採用，而這個 repo 不發布映像）。
#
# 本機 == CI，而且現在是字面上的相同：lint、unit-integration、api、bats、web-e2e 與
# coverage 這幾個 job 都跑 ./script/test.sh，那支會建置 docker/Dockerfile.test-tools 並在
# 裡面跑每一項檢查——與開發者機器上 `just test` 用的是同一份映像、走同一條路徑。這裡不
# 安裝任何檢查工具，所以這裡也漂移不出開發者手上的那一套。
#
# 它們合起來就是不帶參數的 `./script/test.sh` 那一次執行，只是拆開平行跑（#358）：那一次
# 要 13 分鐘，其中 test_web.py 一支佔了 10 分鐘、test_api.py 佔了將近 3 分鐘。拆法寫在
# test.sh 的 --part；「拆開之後對得回原本那一次」由 coverage 那一段的 gate 檢查。
#
# 來由：CI 曾經把每一支 linter 各自複述成一個 YAML step，而 `just test lint` 會跳過
# 主機沒有的工具，於是 pipeline 連續六次全紅，本機每次執行卻都報乾淨。base 把同一個
# 教訓寫在它的 script/test/drivers/hadolint.sh 裡。一個環境，兩個呼叫者。
#
# **每個資源有明確的擁有者**（#356）：會建映像、compose 專案、容器或資料卷的 job，第一步先以
# script/ci_key.sh 算出自己的鍵（run_id、run_attempt、job id，matrix 的 job 再加分片
# CM_CI_SHARD），寫進 CM_CI_KEY。映像 tag、compose 專案名與容器名都帶這個鍵，資源都帶
# cm.ci.owner=<鍵> 標籤，清理只照這個鍵挑。重跑時 run_attempt 不同，名稱全部換新。
# compose-smoke 與 backup-drill 另外在同一個 daemon 上放四組別的擁有者的資源當對照組
# （script/ci_bystanders.sh），跑完核對它們沒有被動到。
#
# **埠沒有隔離**：compose 的服務聽固定的 127.0.0.1:8080／8081，compose_smoke.sh 的對照服務聽
# 18099。GitHub-hosted runner 每個 job 一台新的 VM，所以這裡不衝突；同一個 docker daemon 上
# 併發時（例如 self-hosted runner）仍會衝突。埠的隔離拆到 #390 追蹤。

name: CI

# 每一次執行的名稱分得出對應的 commit（#350）：pull_request 帶 PR 編號、標題與 head 的完整 SHA
# （github.sha 是 GitHub 為 PR 合出來的那一個，不是推上來的 commit）；其餘觸發帶事件、ref 與 github.sha。
# 寫成 >- 區塊：值裡的 # 若在一般寫法裡會被 YAML 當成註解。判定標準由 script/lint_run_name.sh 檢查
# （下面的 run-name job，與本機的 pre-push hook 同一支）。
run-name: >-
  ${{ github.event_name == 'pull_request'
  && format('PR #{0} {1} @ {2}', github.event.pull_request.number, github.event.pull_request.title, github.event.pull_request.head.sha)
  || format('{0} {1} @ {2}', github.event_name, github.ref_name, github.sha) }}

on:
  # push 到 main 保留不動（#407）：merge job 以 GITHUB_TOKEN 合併不會觸發它，只有不是 GITHUB_TOKEN 的
  # 推送（例如維護者在網頁上合併）才會。去留由 #373 定。
  push:
    branches: [main]
  # types 寫明（#407，同 sim_asset）：ready_for_review 讓草稿轉成可合併時跑一輪（merge job 才會合併）；
  # edited 讓使用者或 agent 帳號改標題或描述（例如補 `## TDD red`）時自動重跑。用 GITHUB_TOKEN 做的編輯
  # 不會產生新的一輪，所以不靠它保證「每次改動都有新的一輪」：合併前一律由 merge job 重判。
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # merge queue 的觸發保留，但這個 repo 不用 merge queue（#407：合併由 CI 的 merge job 做），實際不會
  # 發生。只在 pull request 上跑的那幾個 job 在這裡不跑（它們的 if: 只認 pull_request）；ci_rollup.sh
  # 對那一組允許 skipped，其餘每次都該跑的（含 acceptance、repo-rules）仍要 success。
  merge_group:
  # 手動觸發只在 main 上算數（#407）：發版前用它在 main 的 commit 上留下 ci-rollup。在功能分支上手動
  # 觸發仍看得到各 job 的結果，但 ci_rollup.sh 會讓 ci-rollup 失敗——必要檢查只認名稱，不分觸發。
  workflow_dispatch:

# 同一個 PR 只留最新的一輪（#407，同 sim_asset）：改兩次描述時不會兩輪都去合併。這一層的取消可能停在
# 舊那一輪 merge job 的半途（例如已經合併、還沒關 issue），那時照 AGENTS.md 重跑原本那一輪的 merge job
# 補作業。不是 pull_request 的觸發各自一組，不互相取消。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # checkpoints job 要讀被引用的 issue 內文。唯讀，且只在 pull request 上跑。
  issues: read
  pull-requests: read

jobs:
  commit-message:
    # 只看這個 pull request 新增的 commit；歷史早於這條規則。
    # 跑在映像之外：它只需要 git，不需要別的，而為了跑一道 git 指令去建一份映像，
    # 會是所有做法裡最慢的那一個。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./script/lint_commit.sh "origin/${{ github.base_ref }}"

  checkpoints:
    # 驗收條件的帳本：被引用的 issue 必須全部勾完，且每個勾起來的項目要記下一個
    # 屬於本 PR 的 commit SHA。依 §0.4「無法自動檢查的規範等同不存在」——這個流程
    # 若只寫在 CLAUDE.md，它就只是一段約定。
    #
    # 跟 commit-message 一樣跑在映像之外：它只需要 gh 與 git，而 script/test.sh
    # 在容器裡跑，那裡沒有 token。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # rev-list base..HEAD 需要完整歷史。
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/lint_checkpoints.sh "${{ github.event.pull_request.number }}" "origin/${{ github.base_ref }}"

  test-interfaces:
    # 規則 B：新增的測試介面段落要有 #issue 回指，且該 issue 早於加入它的 commit
    # （介面事先議定，#144）。規則 A（順序）不需要 token，跑在容器裡的 test.sh；
    # 這一條需要 gh 讀 issue 的 createdAt，所以與 checkpoints 同一種形狀——跑在
    # 映像之外的獨立 job，因為 script/test.sh 在容器裡跑、那裡沒有 token。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # rev-list base..HEAD 需要完整歷史。
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/lint_test_interfaces.sh agreed "origin/${{ github.base_ref }}"

  single-task:
    # 標題任務編號限制（#351）：PR 標題、PR 裡的 commit 主旨、關閉關鍵字綁定的 issue 數、F 項與 issue 的
    # 對應、關聯 issue 的標題。**獨立的 job、獨立的腳本**，不併進 lint、checkpoints；本機的 commit-msg 與
    # pre-push hook 呼叫同一支（只做不必讀 issue 的部分）。它數的是編號，不證明只有一個任務。
    # 跑在映像之外，與 checkpoints 同一個理由：它需要 gh 讀 PR 與 issue，容器裡沒有 token。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/lint_single_task.sh pr "${{ github.event.pull_request.number }}" "origin/${{ github.base_ref }}"

  attribution:
    # Claude 署名與 session 連結（#405）：PR 範圍內每個 commit 的訊息、PR 標題與描述。樣式在
    # script/attribution-patterns.txt，本機的 commit-msg 檢查與 Claude Code 的 hook 讀同一份。失敗時只印
    # 位置與樣式，不印命中的內容（這裡的紀錄是公開的）。跑在映像之外，與 checkpoints 同一個理由：它要 gh
    # 讀 PR，容器裡沒有 token。
    #
    # 在網頁上改 PR 標題或描述會重跑這個 job：pull_request 的 types 有 edited（#407）。用 GITHUB_TOKEN
    # 做的編輯不會，那由 merge job 合併前的重判補上。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # rev-list base..HEAD 需要完整歷史。
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/lint_attribution.sh pr "${{ github.event.pull_request.number }}" "origin/${{ github.base_ref }}"

  merge-gate:
    # 合併前的兩道檢查（#407）：這個 PR 自己的 TDD red（描述的 `## TDD red` 段落連到這個 PR 的一輪
    # pull_request 執行，失敗在可認定 red 的 job 的 specs 步驟），以及綁定 issue 的 milestone 前面沒有
    # 還開著的版本。repo 的 ruleset 讀不到 PR 描述與 issue，所以由這裡擋；必要檢查仍只有 ci-rollup。
    # 讀執行紀錄的 attempt、jobs 與 job 紀錄要 actions: read；job 層的 permissions 會整組取代 workflow
    # 層的，所以其餘三項唯讀也寫在這裡。跑在映像之外，與 checkpoints 同一個理由。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # 綁定判定讀 base..HEAD 的 commit 訊息與 base 的合併紀錄。
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/lint_merge_gate.sh "${{ github.event.pull_request.number }}" "origin/${{ github.base_ref }}"

  repo-rules:
    # repo 的保護設定由 CI 核對（#407，維護者定案 12）：讀 GitHub 上實際的 ruleset 與 repo 設定，和
    # AGENTS.md 的「repo 保護設定」表逐項比，不一致或必驗項目讀不到就失敗。每次都跑：設定被改掉，
    # 下一輪 CI 就紅。用 GITHUB_TOKEN、workflow 層的唯讀權限（這幾個端點文件都標為只要 Metadata 讀取權）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/lint_repo_rules.sh AGENTS.md

  run-name:
    # workflow 的 run-name 分得出每一次執行對應的 commit（#350）。**獨立的 job、獨立的腳本**，不併進
    # lint（維護者 11/12、11/14）：本機的 pre-push hook（script/githook-checks/pre-push/10-run-name.sh）
    # 呼叫同一支。跑在映像之外，與 commit-message 同一個理由：它只需要 bash 與 python3。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./script/lint_run_name.sh

  # ── 不帶參數的 ./script/test.sh，拆成平行的幾段（#358）────────────────────
  #
  # 每一段先建 test-tools 映像。runner 每次都是新機器，所以層從 GitHub Actions 的快取取
  # （CM_TEST_IMAGE_CACHE，見 test.sh）：setup-buildx-action 起一個能讀寫那個快取的建置器，
  # ghaction-github-runtime 把快取服務的位址與 token 交給它。
  #
  # 只有 bats 寫回快取，其餘只讀。寫回要多花一段時間（空快取時實測約 40 秒），放在誰身上
  # 誰就晚那麼久回報；bats 不在「兩分鐘內回報」的那幾段裡，lint 在。快取在這一次執行裡
  # 幫不了任何 job（它們同時開始），所以由哪一段寫回，對下一次的效果相同。
  #
  # 這兩個 action 只加在跑 test.sh 的 job。build、compose-smoke、backup-drill 用的是一般的
  # `docker build`／`docker compose`，換成 buildx 的建置器，建好的映像就不會進 docker 的映像
  # 清單——那三個 job 的行為會跟著變，而它們不需要這個快取。
  #
  # fetch-depth: 0 每一段都給：原本那一次是在完整歷史上跑的（lint_commit 要讀歷史），
  # 拆開之後每一段的輸入不該比原本少。
  #
  # **跑規格的四段（unit-integration、api、bats、web-e2e）拆成 prepare 與 specs 兩步**（#407）：
  # prepare 以 `test.sh --prepare` 建映像，specs 以 CM_TEST_IMAGE_PREBUILT=1 用建好的映像跑規格。
  # merge-gate 認 TDD red 時只認「specs 這一步失敗、紀錄裡有規格層級的失敗」，所以映像沒建起來
  # 與規格紅了分得開。步驟名稱 prepare、specs 是 merge-gate 讀的介面，改名要一起改
  # script/lint_merge_gate.sh。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: ./script/ci_key.sh --github-env
      - run: ./script/test.sh --lint
        env:
          CM_TEST_IMAGE_CACHE: gha
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}

  unit-integration:
    # test_api.py 與 test_web.py 以外的全部 pytest 規格：unit 與 integration。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: ./script/ci_key.sh --github-env
      - name: prepare
        run: ./script/test.sh --prepare
        env:
          CM_TEST_IMAGE_CACHE: gha
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}
      - name: specs
        run: ./script/test.sh --part fast
        env:
          CM_TEST_IMAGE_PREBUILT: "1"
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: ci-part-fast
          path: ci-parts/
          if-no-files-found: error
          retention-days: 3

  api:
    # test_api.py 依收集順序輪流分成幾份，一份一個 job。它一支就要兩、三分鐘——不分的話，
    # 這一段回報不了「兩分鐘內」。
    #
    # 份數只寫在 matrix 這一處：傳給 test.sh 的 <i>/<n> 由 strategy.job-index／job-total
    # 算出來，不另外抄一個數字。寫錯也不會靜默——gate 會指出哪些規格沒有被任何一份跑到。
    # fail-fast: false：一份失敗不取消其餘的，失敗的規格一次看齊。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    # 分片識別進擁有者的鍵（#356）：少了它，三份分片拿到同一個鍵。
    env:
      CM_CI_SHARD: ${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: ./script/ci_key.sh --github-env
      - name: prepare
        run: ./script/test.sh --prepare
        env:
          CM_TEST_IMAGE_CACHE: gha
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}
      - name: specs
        run: ./script/test.sh --part api "$(( JOB_INDEX + 1 ))/${JOB_TOTAL}"
        env:
          CM_TEST_IMAGE_PREBUILT: "1"
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        with:
          name: ci-part-api-${{ matrix.shard }}
          path: ci-parts/
          if-no-files-found: error
          retention-days: 3

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: ./script/ci_key.sh --github-env
      - name: prepare
        run: ./script/test.sh --prepare
        env:
          CM_TEST_IMAGE_CACHE: gha-write
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}
      - name: specs
        run: ./script/test.sh --part bats
        env:
          CM_TEST_IMAGE_PREBUILT: "1"
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}

  web-e2e:
    # test_web.py（瀏覽器端到端）依收集順序輪流分成幾份，一份一個 job，分法與 api 相同。
    # 不分的話它一支就要十分鐘，整個 CI 等的就是它。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    # 分片識別進擁有者的鍵（#356）：少了它，六份分片拿到同一個鍵。
    env:
      CM_CI_SHARD: ${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: ./script/ci_key.sh --github-env
      - name: prepare
        run: ./script/test.sh --prepare
        env:
          CM_TEST_IMAGE_CACHE: gha
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}
      - name: specs
        run: ./script/test.sh --part web "$(( JOB_INDEX + 1 ))/${JOB_TOTAL}"
        env:
          CM_TEST_IMAGE_PREBUILT: "1"
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        with:
          name: ci-part-web-${{ matrix.shard }}
          path: ci-parts/
          if-no-files-found: error
          retention-days: 3

  coverage:
    # 把各段合起來：每一條 pytest 規格恰好被一段跑過，再合併覆蓋率，交給
    # script/coverage_gate.sh。core／io／api／web 各自的 85% 下限寫在 pyproject.toml，
    # 這裡同樣不複述。任何一段沒過，這一段就被跳過——ci-rollup 把那判成沒通過。
    needs: [unit-integration, api, web-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-part-*
          path: ci-parts/
          merge-multiple: true
      - run: ./script/ci_key.sh --github-env
      - run: ./script/test.sh --part gate
        env:
          CM_TEST_IMAGE_CACHE: gha
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}
      # 四層覆蓋率與門檻結果（#354）：coverage_gate.sh 判完之後寫在 coverage/summary/，這裡只把
      # 表格放進 Job Summary、把那個目錄上傳成 artifact。過不過都放——沒過的時候正是最需要看
      # 數字的時候。gate 沒跑到（例如有規格沒被任何一段跑過）時沒有這份檔案，這兩步跟著失敗，
      # 不假裝有數字。日常 PR 不核對 doc/badge/coverage.svg：它隨 milestone 收尾更新。
      - if: always()
        run: cat coverage/summary/coverage.md >> "${GITHUB_STEP_SUMMARY}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/summary/
          if-no-files-found: error

  acceptance:
    # 驗收報表跑在每一個 pull request 上（#407，維護者 11/20 定案 2：「搬到 PR 上跑」），合併前全部驗完；
    # merge job 合併之後 main 不再跑一輪（GITHUB_TOKEN 的合併不觸發 push），所以它不能只在 main 上跑。
    # 當時量的：main run 44250363331 的 acceptance 85 秒，與其他 job 並行，整輪 2 分 46 秒，最慢的是
    # compose-smoke 128 秒——搬過來不拉長一輪。
    #
    # 它比 test.sh 那幾段多出來的訊號是**對照表與規格之間的對應**（一條檢查點沒有人驗、一條參照指到
    # 不存在的規格）。對照表指錯時 acceptance.sh 回 2，而 release.sh 對 2 的處置是不建立 release——
    # 在 PR 上就擋下，不必等到打 tag 那天。
    #
    # 跑的是對照表頂層 target 寫的目前目標版本，不在這裡寫死版號（#355）。目標版本已整體通過、對照表裡
    # 之後還有版本時，acceptance.sh 以 2 結束並指名下一版：讓目標版本整體通過的那一次簽核，要和 target
    # 推進放在同一個 PR（AGENTS.md 的 v0.9.0 收尾順序）。
    #
    # --gate automated：自動檢查全過、沒有未涵蓋就過，人工檢查點要等真人，不擋 PR；報表照樣印出人工待驗
    # 清單。發版（release.sh）用預設的 --gate overall，人工也要簽完。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./script/ci_key.sh --github-env
      - run: ./script/acceptance.sh --target --gate automated
        env:
          CM_TEST_IMAGE_TAG: ${{ env.CM_CI_KEY }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # runtime-test 是 FROM runtime，並在它自己的建置過程中跑 bats 的 smoke 規格，
      # 所以建置是綠的就代表可部署的產物真的起得來——不只是編得過。與跑 test.sh 的
      # 那幾段分開，因為它建的是應用映像，不是工具映像。
      - run: ./script/ci_key.sh --github-env
      # tag 與標籤帶這個 job 的擁有者鍵（#356）。
      - run: docker build --target runtime-test -t "config_manager:runtime-test-${CM_CI_KEY:?}" --label "cm.ci.owner=${CM_CI_KEY:?}" .
      # devel 也要建，而且不是為了對稱：runtime-test 的鏈是 devel-base -> runtime，
      # 永遠不會進到 devel。於是每個開發者每天都在建的那個階段，正好是 CI 從來不建的
      # 那一個，而它從存在的第一天起就是壞的。
      - run: docker build --target devel -t "config_manager:devel-${CM_CI_KEY:?}" --label "cm.ci.owner=${CM_CI_KEY:?}" .

  compose-smoke:
    # compose 的服務實測（T25 的第二個觀察位置，#51）：host 與 bridge 各**實際起一次**，量
    # 「只有本機連得到」「容器整個重建後已進版的都在」「停得掉」。設定解析那一半在 bats 那一段裡
    # （test/bats/integration/compose.bats，工具映像內）；兩者回答不同的問題，結果分開。
    #
    # 跑在映像之外，與 build 同一個理由：它要 docker daemon，還要**真的** host 網路——工具映像
    # 裡沒有前者，開發者的 macOS 上沒有後者。所以這一關只有這裡有，script/compose_smoke.sh 在
    # 非 Linux 上會直接說它不跑。compose 用 runner 自帶的那一版；釘住的那一支只管設定解析。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./script/ci_key.sh --github-env
      # 清理只處理本次擁有的資源（#356）：先放別的擁有者的對照組，跑完核對它們沒有被動到。
      - run: ./script/ci_bystanders.sh plant "${RUNNER_TEMP}/bystanders"
      - run: ./script/compose_smoke.sh
      - if: always()
        run: ./script/ci_bystanders.sh check "${RUNNER_TEMP}/bystanders"

  backup-drill:
    # 備份與還原的實際演練（T26 的第三個觀察位置，#52）：真的容器、真的 volume、真的檔案權限底下，
    # 服務開著邊進版邊備份、三種該拒絕的還原、設定庫整個沒了之後還原回來、目標狀態重新比對、
    # 補回缺檔並核對內容與權限、偏離的不被覆寫。設定庫層與主機端指令那兩半分別在
    # unit-integration 與 bats 裡；三者回答不同的問題，結果分開。
    #
    # 跑在映像之外，與 compose-smoke 同一個理由：它要 docker daemon 與真的 host 網路。它用隔離的
    # compose 專案名、自己的 volume 與暫存的目標目錄，結束時清掉。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./script/ci_key.sh --github-env
      # 清理只處理本次擁有的資源（#356）：同 compose-smoke。
      - run: ./script/ci_bystanders.sh plant "${RUNNER_TEMP}/bystanders"
      - run: ./script/backup_drill.sh
      - if: always()
        run: ./script/ci_bystanders.sh check "${RUNNER_TEMP}/bystanders"

  ci-rollup:
    # 唯一的必要狀態檢查，比照 base。分支保護只指名這一個 job，所以在上面新增一個
    # job 永遠不必去改保護規則。
    #
    # `always()` 加上明確的結果判定：少了它，被跳過或被取消的相依會被讀成成功，
    # 於是閘門會在一次什麼都沒檢查的執行上打開。判定在 script/ci_rollup.sh：每個 job
    # 照它這一次該不該跑判，該跑卻被跳過也是沒通過；workflow 有、needs 沒列的 job
    # 也擋，所以新增一個 job 卻忘了列進來，會在這裡紅，不會安靜地不被檢查。
    #
    # 三組規則對應上面各 job 的 `if:`——改了其中一邊，另一邊要一起改。
    if: always()
    needs:
      - commit-message
      - checkpoints
      - test-interfaces
      - single-task
      - attribution
      - merge-gate
      - repo-rules
      - run-name
      - lint
      - unit-integration
      - api
      - bats
      - web-e2e
      - coverage
      - acceptance
      - build
      - compose-smoke
      - backup-drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that every job passed
        # 走 env，不要直接內插進腳本：把運算式直接拼進 `run` 會開出一個
        # shell injection 的缺口，而且 Actions 的運算式只吃單引號。
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          ./script/ci_rollup.sh .github/workflows/ci.yaml
          --always "repo-rules run-name lint unit-integration api bats web-e2e coverage acceptance build compose-smoke backup-drill"
          --pull-request "commit-message checkpoints test-interfaces single-task attribution merge-gate"
          --main-push ""

  merge:
    # 檢查全過，由 CI 以 merge commit 合併（#407，照 ycpss91255-docker/sim_asset；維護者 11/20 定案 1、3）。
    # 排在 ci-rollup 之後，不列進它的 needs（ci_rollup.sh 放過排在它之後的 job）。merge-gate、acceptance、
    # attribution 都經 ci-rollup 等到，不另外列。
    #
    # if 明寫 !cancelled() 與 ci-rollup 是 success，不靠「沒有任何 job 被跳過」；再加 sim_asset 的四個條件：
    # pull_request、base 是 main、同 repo 的分支（fork 拿不到 write 權限，由維護者在網頁上合併）、不是草稿。
    # 草稿事件的那一輪重跑也會跳過：重跑沿用原本的事件內容。
    #
    # 合併前 script/ci_merge.sh 用 API 讀現況，在同一份資料上重判讀 PR 或 issue 資料的檢查（綁定判定、
    # checkpoints、single-task、test-interfaces、merge-gate、attribution），不沿用前面 job 的綠燈：
    # --match-head-commit 只鎖 head，改描述、換綁、轉回草稿都可以發生在同一個 sha 上。
    #
    # 權限只在這個 job 開 write；actions: read 是重判 TDD red 要讀執行紀錄。用 GITHUB_TOKEN，不建 App 或 PAT。
    # concurrency 讓兩個進入補作業的 merge job 不會同時查留言、寫留言；不取消進行中的那一個。
    needs: [ci-rollup]
    if: >-
      !cancelled() && needs.ci-rollup.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # 重判在這一輪事件的 head 上跑（帳本要讀 base..HEAD 與 base 的歷史）。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - env:
          GH_TOKEN: ${{ github.token }}
          CM_CI_ROLLUP_RESULT: ${{ needs.ci-rollup.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./script/ci_merge.sh "${PR_NUMBER}" "${HEAD_SHA}" origin/main
