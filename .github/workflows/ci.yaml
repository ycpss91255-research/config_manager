# CI, written directly rather than calling the shared reusable workers
# (design appendix A.1: adopting the worker fan-out means adopting the
# template's release machinery with it, and this repo publishes no image).
#
# LOCAL == CI, and now literally so: the checks job runs ./script/test.sh,
# which builds dockerfile/Dockerfile.test-tools and runs every check inside
# it -- the same image, by the same path, that `just test` uses on a
# developer's machine. Nothing here installs a tool, so nothing here can
# drift from what a developer has.
#
# The history: CI restated each linter as its own YAML step, `just test
# lint` skipped a tool the host lacked, and the pipeline went red six times
# in a row while every local run reported clean. base wrote the same lesson
# down in script/test/drivers/hadolint.sh. One environment, two callers.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-message:
    # Only the commits this pull request adds; history predates the rule.
    # Runs outside the image: it needs git and nothing else, and building an
    # image to run one git command would be the slowest possible way to do it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./script/lint_commit.sh "origin/${{ github.base_ref }}"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # lint_commit reads history; a shallow clone has none.
          fetch-depth: 0
      # Every linter, every test level, and the coverage floor -- all inside
      # the test image. The 85% floor on src/config_manager/core lives in
      # pyproject.toml, so it is not restated here either.
      - run: ./script/test.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # runtime-test is FROM runtime and runs the bats smoke specs during
      # its own build, so a green build means the deployable artifact came
      # up -- not merely that it compiled. Separate from `checks` because it
      # builds the application image, not the tooling one.
      - run: docker build --target runtime-test -t config_manager:runtime-test .
      # devel too, and not for symmetry: runtime-test's chain is
      # devel-base -> runtime, so it never enters devel. The stage every
      # developer builds daily was therefore the one stage CI never built,
      # and it was broken for as long as it existed.
      - run: docker build --target devel -t config_manager:devel .

  ci-rollup:
    # The single required status check, mirroring base. Branch protection
    # names this one job, so adding a job above never means editing the
    # protection rule.
    #
    # `always()` plus an explicit result test: without it a skipped or
    # cancelled dependency reads as success and the gate opens on a run that
    # never checked anything.
    if: always()
    needs: [commit-message, checks, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job passed
        # Through env, not interpolated into the script: an expression
        # spliced straight into `run` is a shell-injection seam, and Actions
        # expressions take single quotes only.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass: ${r}"; exit 1 ;;
            esac
          done
