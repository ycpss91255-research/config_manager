# compose.yaml —— 自建的最小版本（設計附錄 A.1）。
#
# 共用容器模板會從一份 `.setup.conf` 的服務描述渲染出這個檔案。那個模板在 v0.10.0
# 刻意不引入，所以這個 repo 直接手寫 compose。`.setup.conf` 已經存在，但裡面**沒有
# 任何服務值**，只是佔位並寫下引入時的步驟（ADR-00000024）——權威是這個檔案。
# 手寫並且維持小巧就是重點：自己長出一個帶主機偵測的 config 解析器，會慢慢變成模板
# 那一份的競爭版本，而附錄 A.1 指名那是在這裡最可能犯的錯。
#
# 現在就採用的，是那些之後改起來很貴的決定——階段名稱、產物放 /opt，以及底下的
# `host` 網路模式。

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${CM_STAGE:-devel}
    image: config_manager:${CM_TAG:-devel}
    container_name: config_manager_backend
    # 用 host，不用 bridge。bridge 會靜默地讓整台機器的 ROS 2 discovery 失效，
    # 而這個服務就跑在它所管理參數的那些 ROS 節點旁邊——一個方便的預設值安靜地
    # 弄壞一套真實部署，正是不變式 4 為之存在的情況。真的需要隔離的部署，再明確
    # 地 opt into bridge。
    network_mode: host
    volumes:
      # 來源 repo：唯一真實來源（ADR-00000002）。用具名 volume 而不是 bind
      # mount，因為它的生命週期屬於這套系統，不屬於主機上的那份簽出。
      - config_repo:/opt/config_manager/config-repo
      # 目標位置所在的檔案系統。必須可讀寫——寫出就是往這裡寫——而且它是唯一
      # 一個伸出容器自身世界之外的掛載。
      - /opt/robot/config:/opt/robot/config
    environment:
      CM_CONFIG_REPO: /opt/config_manager/config-repo
      CM_ROLE: backend
    # 是 config_manager.api.cli，不是 api.cli——見 Dockerfile 的 CMD（#90）。
    command: ["python", "-m", "config_manager.api.cli", "serve", "--host", "127.0.0.1", "--port", "8080"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${CM_STAGE:-devel}
    image: config_manager:${CM_TAG:-devel}
    container_name: config_manager_frontend
    network_mode: host
    environment:
      CM_ROLE: frontend
    # 就只是一台靜態檔案伺服器。frontend 既碰不到檔案系統也碰不到 git；所有保證
    # 都在 API 後面（設計原則 N-3），所以這個容器連可以給它的掛載都沒有。
    command: ["python", "-m", "http.server", "8081", "--directory", "/opt/config_manager/src/config_manager/web"]
    depends_on:
      - backend

volumes:
  config_repo:
