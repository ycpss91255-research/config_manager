<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6d7e"/></marker></defs><rect x="40" y="50" width="255" height="250" rx="4" fill="#f7f9fa" stroke="#95a5a6" stroke-width="1.6"/><rect x="40" y="50" width="255" height="34" rx="4" fill="#c0392b"/><text x="167" y="72" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">現在就對齊</text><text x="56" y="108" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· ADR 格式（8 位數編號）</text><text x="56" y="127" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· Commit 前綴規範</text><text x="56" y="146" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 測試分類三軸</text><text x="56" y="165" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 測試目錄與鏡射規則</text><text x="56" y="184" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 腳本介面與參數規則</text><text x="56" y="203" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 容器 stage 命名</text><text x="56" y="222" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 檔名規則（.local 後綴）</text><text x="56" y="241" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 網路預設 host</text><text x="56" y="260" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 產物烘在 /opt</text><text x="167" y="272" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">事後改很貴</text><text x="167" y="288" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">現在做幾乎零成本</text><rect x="313" y="50" width="255" height="250" rx="4" fill="#f7f9fa" stroke="#95a5a6" stroke-width="1.6"/><rect x="313" y="50" width="255" height="34" rx="4" fill="#e67e22"/><text x="440" y="72" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">自建最小版本</text><text x="329" y="108" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· compose 設定（手寫，</text><text x="329" y="127" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">  不自建解析層）</text><text x="329" y="146" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 任務入口腳本（照命名，</text><text x="329" y="165" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">  內容自己寫）</text><text x="329" y="184" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· CI workflow（直接寫，</text><text x="329" y="203" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">  不做共用 worker）</text><text x="329" y="222" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 覆蓋率工具（pytest-cov）</text><text x="440" y="272" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10" font-weight="bold" fill="#e67e22" text-anchor="middle">導入時整份換掉</text><text x="440" y="288" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10" font-weight="bold" fill="#e67e22" text-anchor="middle">保持最小，不加功能</text><rect x="586" y="50" width="255" height="250" rx="4" fill="#f7f9fa" stroke="#95a5a6" stroke-width="1.6"/><rect x="586" y="50" width="255" height="34" rx="4" fill="#7f8c8d"/><text x="713" y="72" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">現在不要做</text><text x="602" y="108" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 設定解析 + 主機偵測 + TUI</text><text x="602" y="127" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 共用 CI worker</text><text x="602" y="146" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 測試工具映像檔</text><text x="602" y="165" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· subtree 升級與傳播機制</text><text x="602" y="184" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 來源／發布目錄切分</text><text x="602" y="203" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">· 容器 lifecycle（init／</text><text x="602" y="222" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#3a4a58" text-anchor="start">  restart／watchdog／log）</text><text x="713" y="272" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10" font-weight="bold" fill="#7f8c8d" text-anchor="middle">導入後由模板提供</text><text x="713" y="288" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10" font-weight="bold" fill="#7f8c8d" text-anchor="middle">自建 = 之後要拆掉重寫</text><rect x="40" y="370" width="801" height="62" rx="4" fill="#f7f9fa" stroke="#95a5a6" stroke-width="1.6"/><text x="440.5" y="397.3" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="middle">導入時機：本專案 v1.0.0 之後，或模板的 config 供裝模型需與本系統整合時</text><text x="440.5" y="412.9" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="11" font-weight="normal" fill="#2c3e50" text-anchor="middle">屆時的工作 = 刪除中欄的自建版本 + 以 subtree 加入模板 + 任務入口改為轉發。左欄不需改動，右欄不存在</text><path d="M 440.5 300 L 440.5 370" fill="none" stroke="#5d6d7e" stroke-width="1.6" marker-end="url(#ah)"/></svg>