JK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#2c3e50" text-anchor="middle">見 §7.8</text><rect x="730" y="274" width="120" height="70" rx="4" fill="#f7f9fa" stroke="#95a5a6" stroke-width="1.6"/><text x="790.0" y="305.8" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#2c3e50" text-anchor="middle">切換明顯可見，</text><text x="790.0" y="319.3" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="normal" fill="#2c3e50" text-anchor="middle">不藏在選單裡</text></svg>