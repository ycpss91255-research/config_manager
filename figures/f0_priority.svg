<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400"><defs><marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6d7e"/></marker></defs><rect x="120" y="30" width="700" height="56" rx="4" fill="#fdeded" stroke="#c0392b" stroke-width="1.8"/><text x="140" y="52" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="12.5" font-weight="bold" fill="#c0392b" text-anchor="start">P1　正確性與可追溯性</text><text x="140" y="71" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4a58" text-anchor="start">資料不遺失、每次變更可追溯到人與時間</text><text x="806" y="64" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="bold" fill="#c0392b" text-anchor="end">不變式 2 / 9</text><path d="M 100 86 L 100 98" stroke="#aab4bd" stroke-width="1.6"/><rect x="120" y="98" width="700" height="56" rx="4" fill="#fef5e7" stroke="#e67e22" stroke-width="1.8"/><text x="140" y="120" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="12.5" font-weight="bold" fill="#e67e22" text-anchor="start">P2　失敗明顯</text><text x="140" y="139" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4a58" text-anchor="start">寧可擋下合法操作，不可放行錯誤且無聲</text><text x="806" y="132" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="bold" fill="#e67e22" text-anchor="end">不變式 2</text><path d="M 100 154 L 100 166" stroke="#aab4bd" stroke-width="1.6"/><rect x="120" y="166" width="700" height="56" rx="4" fill="#fef9e7" stroke="#b9770e" stroke-width="1.8"/><text x="140" y="188" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="12.5" font-weight="bold" fill="#b9770e" text-anchor="start">P3　安全優先於方便</text><text x="140" y="207" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4a58" text-anchor="start">預設落向安全，較危險的選項需 opt-in</text><text x="806" y="200" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="bold" fill="#b9770e" text-anchor="end">不變式 4 / 5</text><path d="M 100 222 L 100 234" stroke="#aab4bd" stroke-width="1.6"/><rect x="120" y="234" width="700" height="56" rx="4" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.8"/><text x="140" y="256" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="12.5" font-weight="bold" fill="#2980b9" text-anchor="start">P4　嚴謹度</text><text x="140" y="275" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4a58" text-anchor="start">格式與規則選擇以消除歧義為準</text><text x="806" y="268" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="bold" fill="#2980b9" text-anchor="end">不變式 2（經 N-1）</text><path d="M 100 290 L 100 302" stroke="#aab4bd" stroke-width="1.6"/><rect x="120" y="302" width="700" height="56" rx="4" fill="#e8f6ef" stroke="#27ae60" stroke-width="1.8"/><text x="140" y="324" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="12.5" font-weight="bold" fill="#27ae60" text-anchor="start">P5　易用性</text><text x="140" y="343" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4a58" text-anchor="start">在不犧牲上述前提下，讓操作盡量順手</text><text x="806" y="336" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="9.5" font-weight="bold" fill="#27ae60" text-anchor="end">—</text><path d="M 96 44 L 96 366" stroke="#5d6d7e" stroke-width="2" marker-end="url(#ah)"/><text x="80" y="205" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10.5" font-weight="bold" fill="#5d6d7e" text-anchor="end">衝突時</text><text x="80" y="220" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="10.5" font-weight="bold" 