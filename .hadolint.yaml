---
# Aligned with ycpss91255-docker/base's ruleset, minus the rules that only
# apply to the template's own consumer-chosen BASE_IMAGE story.
ignored:
  # Pin versions in apt-get install. Not pinned here for the same reason the
  # template does not pin: an image that cannot take a security update
  # without a repo release is worse for its audience than one that drifts.
  #
  # The compensating control, without which this ignore would be the kind
  # that names nothing: the drift is RECORDED. Every image writes
  # /usr/local/share/config_manager/packages.txt (every package and its exact
  # version, rewritten after each apt layer) and base-image.env (the base
  # reference, its digest where one was given, and the base OS), plus the OCI
  # base.name / base.digest labels. Two images that behave differently can be
  # diffed down to the version that changed.
  #
  # An earlier revision of this file claimed the control was that BASE_IMAGE
  # carries a tag. That was not a control: python:3.11-slim-bookworm is a
  # MOVING tag, so the package set does move on an arbitrary rebuild -- which
  # is exactly what the claim denied.
  - DL3008
  # Pin versions in pip install. The pins live in config/pip/*.txt, which is
  # where a reader looks for them; restating them in the Dockerfile would
  # create a second place to update.
  - DL3013
  # Always tag the version of an image explicitly. Fires on
  # `FROM ${BASE_IMAGE} AS sys`, which hadolint cannot resolve statically --
  # it sees a variable and assumes the worst.
  #
  # The compensating control, without which this ignore would be the kind
  # that names nothing: the ARG default two lines above the FROM *is*
  # explicitly tagged (python:3.11-slim-bookworm). Overriding BASE_IMAGE is
  # a deliberate act by whoever passes --build-arg, and an untagged value
  # passed there is their choice, not a drift this repo introduced.
  #
  # An earlier revision said a fixture in test/lint/hadolint/ proved the rule
  # still fires on a genuinely untagged literal FROM. No such fixture exists;
  # that directory holds a .gitkeep. Tracked in #74 -- until it exists, this
  # ignore rests on reading the Dockerfile, not on a check.
  - DL3006
