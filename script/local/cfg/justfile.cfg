# `cfg` 命名空間：本專案自己的命令組，也是 script/local/ 要與模板擁有的 wrapper
# 分開存在的理由——這裡是一個 repo 用來註冊「模板升級時永遠不會覆蓋掉」的指令的地方。
#
# 這裡的每個 recipe 都是 API 的 client，不是第二套實作（ADR-00000009）：CLI 與瀏覽器
# 打的是同一組端點，所以「介面做得到但 CLI 做不到」不是一個到得了的狀態。

# 這裡只列 CLI 真的實作了的 verb。原本列著 import／scan／apply／revert 四個，
# 但 cli.py 一個都沒有——`just cfg import x` 拿到的是 argparse 的 "invalid choice"，
# 而不是它宣稱的功能。一個介面宣稱它沒有的能力，和註解宣稱程式碼沒做的檢查是同一
# 種形狀（#106）。每個 verb 隨它自己的功能落地時加回來。

# 啟動 HTTP 服務
serve *ARGS:
    @{{justfile_directory()}}/script/local/cfg/cfg.sh serve {{ARGS}}

# 列出納管項目與各自的狀態
list *ARGS:
    @{{justfile_directory()}}/script/local/cfg/cfg.sh list {{ARGS}}
