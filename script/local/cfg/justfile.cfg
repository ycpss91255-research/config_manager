# `cfg` 命名空間：本專案自己的命令組，也是 script/local/ 要與模板擁有的 wrapper
# 分開存在的理由——這裡是一個 repo 用來註冊「模板升級時永遠不會覆蓋掉」的指令的地方。
#
# 這裡的每個 recipe 都是 API 的 client，不是第二套實作（ADR-00000009）：CLI 與瀏覽器
# 打的是同一組端點，所以「介面做得到但 CLI 做不到」不是一個到得了的狀態。

# 把一份 config 納入管理
import PATH:
    @{{justfile_directory()}}/script/local/cfg/cfg.sh import {{PATH}}

# 掃描每一份納管的 config 並回報偏離
scan *ARGS:
    @{{justfile_directory()}}/script/local/cfg/cfg.sh scan {{ARGS}}

# 把一份 config 寫出到它的目標位置
apply UID:
    @{{justfile_directory()}}/script/local/cfg/cfg.sh apply {{UID}}

# 把一份 config 退版回先前的版本
revert UID SHA:
    @{{justfile_directory()}}/script/local/cfg/cfg.sh revert {{UID}} {{SHA}}
