# The `cfg` namespace: this project's own command group, and the reason
# script/local/ exists separately from the template-owned wrappers -- it is
# the place a repo registers commands the template never upgrades over.
#
# Every recipe here is an API client, not a second implementation
# (ADR-00000009): the CLI and the browser hit the same endpoints, so
# "the UI can do it but the CLI cannot" is not a reachable state.

# Bring a config file under management
import PATH:
    @{{justfile_directory()}}/script/local/cfg/cfg.sh import {{PATH}}

# Scan every managed config and report drift
scan *ARGS:
    @{{justfile_directory()}}/script/local/cfg/cfg.sh scan {{ARGS}}

# Write a config out to its target location
apply UID:
    @{{justfile_directory()}}/script/local/cfg/cfg.sh apply {{UID}}

# Roll a config back to an earlier version
revert UID SHA:
    @{{justfile_directory()}}/script/local/cfg/cfg.sh revert {{UID}} {{SHA}}
