dth="1.6" marker-end="url(#ah)"/><path d="M 340 145.0 L 260 145.0" fill="none" stroke="#5d6d7e" stroke-width="1.6" marker-end="url(#ah)"/><path d="M 340 207.0 L 260 207.0" fill="none" stroke="#5d6d7e" stroke-width="1.6" marker-end="url(#ah)"/><rect x="60" y="296" width="774" height="62" rx="4" fill="#f7f9fa" stroke="#95a5a6" stroke-width="1.6"/><text x="447.0" y="323.3" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="middle">依賴方向 api → core → io 單向</text><text x="447.0" y="338.9" font-family="Noto Sans CJK TC, WenQuanYi Zen Hei, sans-serif" font-size="11" font-weight="normal" fill="#2c3e50" text-anchor="middle">core 不 import api；檔案系統與 git 操作集中於 io，測試時可替換為 fake，使 core 可在無檔案系統下測試</text></svg>