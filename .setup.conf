# .setup.conf —— 佔位檔。今天沒有任何東西讀這個檔案。
#
# 在共用容器模板底下，這裡是**唯一**的服務定義：模板的 setup 步驟讀它、偵測主機，
# 再從它**渲染出** .env 與 compose.yaml。附錄 A 把那個渲染器列在「現在不要做」那一欄，
# 所以模板沒有引入，渲染器在這裡也不存在。
#
# 也就是說：compose.yaml 是手寫的，而且是今天的權威。
#
# 這就是這個檔案不放任何服務值的原因。不變式 6 說的是一個真實來源、向外傳播——絕不
# 平行維護 N 份副本。一份列著埠號、掛載與指令的 .setup.conf，旁邊擺著一份列著同樣
# 東西的 compose.yaml，正好就是那 N 份副本，而沒有人讀的那一份就是會安靜過期的那份。
# 擴充點先佔位；資料留在同一個地方。
#
# 引入模板時，照這個順序：
#   1. 依 compose.yaml 把底下的段落填起來。
#   2. 跑模板的 setup 步驟，把渲染出來的 compose.yaml 與手寫的那份 diff。
#   3. 兩者一致之後刪掉手寫的 compose.yaml，並把產生的那份加進 .gitignore。
# 不要只做 1 而不做 3。兩份同時存活的定義，正是這個檔案為了避免而存在的狀態。
#
# 底下的欄位名**不是猜的**——引入時要照模板自己的 schema
# （.base/dist/script/docker/lib/schema.sh）填，不要照這段註解填；這段註解只是形狀的
# 草稿，到那時必然已經漂移。

# [service.backend]
# stage   = ...   # Dockerfile 的 target
# network = host  # bridge 是 opt-in（不變式 4）；ROS 2 discovery 需要 host
# mounts  = ...   # config-repo volume ＋ 被管理的目標檔案系統
# command = ...

# [service.frontend]
# stage   = ...
# network = host
# mounts  =        # 無：frontend 既碰不到檔案系統也碰不到 git
# command = ...
