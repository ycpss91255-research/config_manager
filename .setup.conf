# .setup.conf -- PLACEHOLDER. Nothing reads this file today.
#
# Under the shared container template this is the ONE service definition:
# the template's setup step reads it, detects the host, and RENDERS .env and
# compose.yaml from it. Appendix A places that renderer in the "do not build
# yet" column, so the template is not adopted and the renderer does not
# exist here.
#
# WHICH MEANS: compose.yaml is hand-written and is the authority today.
#
# That is why this file carries no service values. Invariant 6 says one
# truth, propagated outward -- never N copies maintained in parallel. A
# .setup.conf listing ports, mounts and commands beside a compose.yaml
# listing the same ones would be exactly those N copies, and the copy
# nobody reads is the one that silently goes stale. The seam is placeheld;
# the data stays in one place.
#
# WHEN THE TEMPLATE IS ADOPTED, in this order:
#   1. Fill in the sections below from compose.yaml.
#   2. Run the template's setup step and diff the rendered compose.yaml
#      against the hand-written one.
#   3. Delete the hand-written compose.yaml once they agree, and add the
#      generated one to .gitignore.
# Do not do 1 without 3. Two live definitions is the state this file exists
# to avoid.
#
# The field names below are NOT guesses -- fill them from the template's own
# schema at adoption time (.base/dist/script/docker/lib/schema.sh), not from
# this comment, which is a sketch of shape and will have drifted by then.

# [service.backend]
# stage   = ...   # Dockerfile target
# network = host  # bridge is opt-in (invariant 4); ROS 2 discovery needs host
# mounts  = ...   # config-repo volume + the managed target filesystem
# command = ...

# [service.frontend]
# stage   = ...
# network = host
# mounts  =        # none: the frontend reaches neither the filesystem nor git
# command = ...
