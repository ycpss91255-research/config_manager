function openDiffView(detail) {
  const back = element("button", { type: "button", "data-testid": "diff-back", text: "返回欄位表" });
  back.addEventListener("click", () => openPanel(detail.uid));
  const view = element("section", { class: "panel", "data-testid": `diff-${detail.uid}` }, [
    element("div", { class: "panel-head" }, [
      element("span", { class: "name", text: `差異檢視　${detail.name}` }),
      element("span", { class: "target", text: detail.target }),
      back,
    ]),
    driftBanner(detail, false),
  ]);
  if (detail.target_error) {
    view.appendChild(element("div", { class: "notice error", "data-testid": "diff-target-error" }, [
      element("strong", { text: "目標現況無法比對。" }),
      element("pre", { text: detail.target_error }),
    ]));
  } else {
    // 左＝來源（repo，唯一真實來源）、右＝目標（磁碟現況）：來源在 paramDiff 的 left。
    const rows = paramDiff(
      { types: detail.types, values: detail.values },
      { types: infer(detail.target_values), values: detail.target_values },
    );
    const differing = rows.filter((row) => row.change !== "same").length;
    view.append(
      element("p", {
        class: "diff-summary", "data-testid": "diff-summary",
        text: `${differing} 個參數不同（左邊是 repo 的來源，右邊是目標的磁碟現況）`,
      }),
      element("div", { class: "diff-head" }, [
        element("span", { class: "diff-name", text: "參數" }),
        element("span", { class: "diff-side", "data-testid": "diff-source", text: "repo（唯一真實來源）" }),
        element("span", { class: "diff-side", "data-testid": "diff-target", text: "target（磁碟現況）" }),
      ]),
      element("ul", { class: "param-table" }, rows.map((row) => diffRow(row, "diff-source-value", "diff-target-value", "｜"))),
    );
  }
  view.appendChild(resolveActions(detail, view));
  mountView(detail.uid, view, "diff");
}

// ── W5 三種處置（#31、§5.4、A3）──────────────────────────────────────────────
// 偏離不自動處置（設計原則 N-2）：三個相反方向的出口由人選，後果在按下之前就寫在按鈕旁。
// 覆蓋與先納入不可逆（丟掉現場改動／載入的草稿要人接手）→ W6 確認；納入走完整驗證，含非法值被拒。
const RESOLVE_OPTIONS = [
  {
    action: "overwrite", label: "以來源覆蓋目標", testid: "resolve-overwrite",
    why: "現場改動是不該保留的臨時測試：把 repo 的來源寫回目標、捨棄現場修改；記一筆紀錄。",
    confirm: ["以來源覆蓋目標？", "目標檔案會被 repo 的來源覆蓋，現場的修改全部丟掉，無法復原；會記一筆變更紀錄。"],
  },
  {
    action: "adopt", label: "將目標現況納入來源", testid: "resolve-adopt",
    why: "現場改動是有效的調整：走完整驗證後成為來源、記一筆採納紀錄；含非法值會被拒。",
    confirm: null,
  },
  {
    action: "adopt_draft", label: "先納入、待修正", testid: "resolve-adopt-draft",
    why: "現場改動含非法值但不該丟：載入草稿供修正，進版前須改正；來源與目標都先不動。",
    confirm: ["先納入、待修正？", "目標現況會載入為這份 config 的草稿（覆蓋既有草稿），非法值以警告標示，進版前須改正。"],
  },
];

function resolveActions(detail, view) {
  const error = element("div", { class: "notice error resolve-error", "data-testid": "resolve-error" });
  error.hidden = true;
  const options = RESOLVE_OPTIONS.map((option) => {
    const button = element("button", { type: "button", "data-testid": option.testid, text: option.label });
    button.addEventListener("click", () => resolveDrift(detail, option, view, error));
    return element("div", { class: "resolve-option" }, [button, element("span", { class: "why", text: option.why })]);
  });
  return element("div", {}, [error, element("div", { class: "resolve-actions editing-only" }, options)]);
}

async function resolveDrift(detail, option, view, errorEl) {
  if (option.confirm) {
    const ok = await confirmAction(option.confirm[0], option.confirm[1]);
    if (!ok) return;
  }
  errorEl.hidden = true;
  for (const button of view.querySelectorAll(".resolve-actions button")) button.disabled = true;
  try {
    const response = await fetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/resolve`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: option.action }),
    });
    const payload = await response.json();
    if (!response.ok) {
      // 422（納入：現況含非法值，列行號／原因／建議並指去先納入待修正）／409／500：原樣顯示，差異區保留。
      renderSaveError(errorEl, payload.detail);
      return;
    }
    clearPromoteBanners();
    if (option.action === "adopt_draft") {
      setDrafts(payload.drafts.map((draft) => draft.uid));
      openPanel(detail.uid, adoptDraftNotice(payload.warnings));
      return;
    }
    load();  // 覆蓋／納入後狀態回到一致，樹重掃
    promoteDoneEl.textContent = option.action === "overwrite"
      ? `已以來源覆蓋「${detail.name}」的目標，並記一筆變更紀錄。`
      : `已將「${detail.name}」的目標現況納入來源（採納現場調整），並寫出。`;
    promoteDoneEl.hidden = false;
    openPanel(detail.uid);
  } catch (error) {
    renderSaveError(errorEl, `送不出去：${error && error.message ? error.message : error}`);
  } finally {
    for (const button of view.querySelectorAll(".resolve-actions button")) button.disabled = false;
  }
}

function adoptDraftNotice(warnings) {
  const notice = element("div", {
    class: warnings.length ? "notice error" : "notice", "data-testid": "adopt-draft-notice",
  }, [
    element("strong", {
      text: warnings.length
        ? `目標現況已載入為草稿，含 ${warnings.length} 個問題——進版前須改正（整批進版會被擋）。`
        : "目標現況已載入為草稿，沒有發現問題；儲存或進版即可。",
    }),
  ]);
  if (warnings.length) {
    notice.appendChild(element("ul", {}, warnings.map((problem) => element("li", {
      text: problemText(problem),
    }))));
  }
  return notice;
}

// 目標現況沒有型別表（型別由來源推斷、不由前端猜）：只借來源的型別表走訪路徑，來源沒有的欄位
// 以值的樣子給個粗略型別讓它顯示得出來——這裡只是「顯示」，不是判定。
function infer(values) {
  const out = {};
  const walk = (value, path) => {
    if (path) out[path] = value === null ? "null" : Array.isArray(value) ? "list" : typeof value === "object" ? "dict" : typeof value === "boolean" ? "bool" : typeof value === "number" ? (Number.isInteger(value) ? "int" : "float") : "string";
    if (value && typeof value === "object" && !Array.isArray(value)) {
      for (const [key, child] of Object.entries(value)) walk(child, path ? `${path}.${String(key).replace(/\./g, "\\.")}` : String(key).replace(/\./g, "\\."));
    } else if (Array.isArray(value)) {
      value.forEach((child) => walk(child, `${path}[]`));
    }
  };
  walk(values || {}, "");
  return out;
}

// ── 進版與捨棄變更（#22）─────────────────────────────────────────────────────
// 進版是全域動作：全部草稿一次驗證、記錄、寫出，整批原子（§7.4.3、T18）。任一份沒過整批不進版，
// 後端指名哪一份（uid）的哪些參數（行號／原因／建議）——原樣列在橫幅上並打開那份。捨棄變更清草稿、
// 回到來源內容，不動來源也不動目標；不可逆，先經 W6 的確認對話框。
const confirmDialog = document.querySelector("[data-testid='confirm-dialog']");

function confirmAction(title, body) {
  confirmDialog.querySelector("[data-testid='confirm-title']").textContent = title;
  confirmDialog.querySelector("[data-testid='confirm-body']").textContent = body;
  return new Promise((resolve) => {
    const finish = (answer) => {
      okButton.removeEventListener("click", onOk);
      cancelButton.removeEventListener("click", onCancel);
      confirmDialog.removeEventListener("close", onCancel);
      if (confirmDialog.open) confirmDialog.close();
      resolve(answer);
    };
    const onOk = () => finish(true);
    const onCancel = () => finish(false);
    const okButton = confirmDialog.querySelector("[data-testid='confirm-ok']");
    const cancelButton = confirmDialog.querySelector("[data-testid='confirm-cancel']");
    okButton.addEventListener("click", onOk);
    cancelButton.addEventListener("click", onCancel);
    confirmDialog.addEventListener("close", onCancel);  // Esc
    confirmDialog.showModal();
  });
}

function clearPromoteBanners() {
  promoteErrorEl.hidden = true;
  promoteDoneEl.hidden = true;
}

async function promoteAll() {
  clearPromoteBanners();
  promoteButton.disabled = true;
  try {
    const response = await fetch(`${API_BASE}/api/promote`, { method: "POST" });
    const payload = await response.json();
    if (!response.ok) {
      renderSaveError(promoteErrorEl, payload.detail);  // 同一種結構化形：message＋逐條行號／原因／建議
      const detail = payload.detail;
      if (detail && detail.uid) openPanel(detail.uid);  // 把人帶到沒過的那一份
      setDrafts(draftUids);  // 草稿保留，按鈕恢復
      return;
    }
    setDrafts([]);  // 進版後草稿清空（T18）
    promoteDoneEl.textContent = `已進版 ${payload.promoted.length} 份，各記一筆變更紀錄並寫出至目標。`;
    promoteDoneEl.hidden = false;
    load();  // 目標變了，重掃狀態
    for (const uid of openUids()) openPanel(uid);  // 打開的那幾份現在來源＝剛進版的內容
  } catch (error) {
    renderSaveError(promoteErrorEl, `送不出去：${error && error.message ? error.message : error}`);
    setDrafts(draftUids);
  }
}

async function discardDrafts(uid, name) {
  const scope = uid ? `「${name}」的草稿` : `全部 ${draftUids.size} 份草稿`;
  const ok = await confirmAction(
    `捨棄${uid ? "這份" : "全部"}變更？`,
    `${scope}會被清除、回到來源內容。來源與目標檔案都不會改變；這個動作無法復原。`,
  );
  if (!ok) return;
  clearPromoteBanners();
  try {
    const path = uid ? `/api/drafts/${encodeURIComponent(uid)}` : "/api/drafts";
    const response = await fetch(`${API_BASE}${path}`, { method: "DELETE" });
    const payload = await response.json();
    if (!response.ok) {
      renderSaveError(promoteErrorEl, payload.detail);
      return;
    }
    setDrafts(payload.drafts.map((draft) => draft.uid));
    for (const open of openUids()) {
      if (!uid || uid === open) openPanel(open);  // 畫面回到來源內容
    }
  } catch (error) {
    renderSaveError(promoteErrorEl, `送不出去：${error && error.message ? error.message : error}`);
  }
}

// 解除納管（#287，後端 #28）：不可逆，先說實際會發生的事再做（設計原則 2）。成功後這份從樹與
// 工作區消失；目標檔案不動。後端拒絕（有草稿、寫入失敗）時原因原樣顯示，項目留在原處。
async function unmanageConfig(detail) {
  const ok = await confirmAction(
    `解除「${detail.name}」的納管？`,
    `系統不再追蹤這份檔案，它會從清單消失。目標檔案 ${detail.target} 保留、內容不動；`
      + "過去的變更歷史仍留在設定庫裡。之後要再管理它，得重新納管。",
  );
  if (!ok) return;
  clearPromoteBanners();
  try {
    const response = await fetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}`, {
      method: "DELETE",
    });
    const payload = await response.json();
    if (!response.ok) {
      renderSaveError(promoteErrorEl, payload.detail);
      return;
    }
    closeSlot(detail.uid);
    promoteDoneEl.textContent = `已解除「${detail.name}」的納管，並記一筆變更紀錄。目標檔案保留在 ${detail.target}。`;
    promoteDoneEl.hidden = false;
    load();
  } catch (error) {
    renderSaveError(promoteErrorEl, `送不出去：${error && error.message ? error.message : error}`);
  }
}

promoteButton.addEventListener("click", promoteAll);
discardAllButton.addEventListener("click", () => discardDrafts(null, null));

// ── 編輯階段（#33、§7.2.2、ADR-00000014）──────────────────────────────────────
// 一次只有一個編輯階段。進清單時向 backend 取得；成功就拿到識別碼（只存在這個分頁的 sessionStorage，
// 重新整理不丟）並定期續期；關閉頁面時主動釋放；異常中斷靠續期逾時自動釋放。已被占用→唯讀：
// 橫幅指名持有者與開始時間，會寫入的控制項不出現（不是停用）。不提供強制接管。
const readonlyBanner = document.querySelector("[data-testid='readonly-banner']");
const SESSION_TOKEN_KEY = "cm.session.token";
// 這個分頁曾被拒（別人持有）：之後重新整理不自動沿用 app 上的身分——那是持有者的，不是你的。
const REFUSED_KEY = "cm.session.refused";
const RENEW_EVERY_MS = 30_000;
let sessionToken = null;
let renewTimer = null;

function storedToken() {
  try { return sessionStorage.getItem(SESSION_TOKEN_KEY); } catch (_error) { return null; }
}

function rememberToken(token) {
  sessionToken = token;
  try {
    if (token) sessionStorage.setItem(SESSION_TOKEN_KEY, token);
    else sessionStorage.removeItem(SESSION_TOKEN_KEY);
  } catch (_error) {
    // 私密視窗等存不進去：識別碼還在記憶體裡，只是重新整理後要重新取得。
  }
}

function markRefused(flag) {
  try {
    if (flag) sessionStorage.setItem(REFUSED_KEY, "1");
    else sessionStorage.removeItem(REFUSED_KEY);
  } catch (_error) {
    // 存不進去就算了：只是少一層「重新整理後不沿用別人身分」的保護，後端的 409 仍擋著換身分。
  }
}

function wasRefused() {
  try { return sessionStorage.getItem(REFUSED_KEY) === "1"; } catch (_error) { return false; }
}

function setReadonly(holder, startedAt, reason) {
  document.body.dataset.readonly = "true";
  currentRole.textContent = "唯讀";
  const who = holder
    ? `目前由 ${holder.name}（${holder.email}）自 ${formatTime(startedAt)} 起編輯中。`
    : "";
  readonlyBanner.replaceChildren(
    element("strong", { text: "唯讀模式。" }),
    element("p", {
      text: reason || `${who}一次只允許一個編輯階段；等對方離開或逾時釋放後重新整理即可取得。不提供強制接管。`,
    }),
  );
  readonlyBanner.hidden = false;
  if (renewTimer) { clearInterval(renewTimer); renewTimer = null; }
}

function setEditing() {
  document.body.dataset.readonly = "false";
  readonlyBanner.hidden = true;
  // 標頭的身分要跟著回來：轉唯讀時它被改成「唯讀」，取回編輯階段後不改回去的話，畫面說唯讀、
  // 實際上卻可以編輯（人工驗證 U38）。
  if (currentIdentity) currentRole.textContent = identityLabel(currentIdentity);
}

function identityLabel(identity) {
  return `${identity.name}・${ROLE_TEXT[identity.role] || identity.role}`;
}

async function acquireSession() {
  // 重新整理：舊頁面卸載時已送出釋放，存著的識別碼可能還有效（釋放晚到）也可能已失效（釋放先到）。
  // 先試著接續（後端會換一個新的識別碼，晚到的舊釋放就動不了它）；失效了就往下重新取得。
  const token = storedToken();
  if (token && await renewSession(token, true)) return;
  try {
    const response = await fetch(`${API_BASE}/api/session/lock`, { method: "POST" });
    const payload = await response.json();
    if (response.status === 409 && payload.detail && payload.detail.kind === "held") {
      markRefused(true);
      setReadonly(payload.detail.holder, payload.detail.started_at, null);
      return;
    }
    if (!response.ok) {
      setReadonly(null, null, `取不到編輯階段：${detailText(payload.detail)}`);
      return;
    }
    rememberToken(payload.token);
    markRefused(false);
    setEditing();
    if (payload.cleared_drafts) {
      // 上一個階段逾時釋放時的草稿被清掉——說出來，不靜默丟棄（T13）。
      promoteDoneEl.textContent = `上一個編輯階段逾時釋放，清除了 ${payload.cleared_drafts} 份未進版的草稿。`;
      promoteDoneEl.hidden = false;
    }
    if (!renewTimer) renewTimer = setInterval(() => renewSession(sessionToken), RENEW_EVERY_MS);
  } catch (error) {
    setReadonly(null, null, `取不到編輯階段（送不出去：${error && error.message ? error.message : error}）。`);
  }
}

// `resuming`＝頁面剛載入、拿存著的識別碼回來接續。此時識別碼失效不算「階段被回收」——多半只是
// 自己重新整理時釋放掉的——所以不轉唯讀，交給 acquireSession 重新取得。
async function renewSession(token, resuming = false) {
  if (!token) return false;
  try {
    const response = await fetch(`${API_BASE}/api/session/lock/renew`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token, resume: resuming }),
    });
    if (response.ok) {
      const payload = await response.json();
      rememberToken(payload.token || token);
      setEditing();
      if (!renewTimer) renewTimer = setInterval(() => renewSession(sessionToken), RENEW_EVERY_MS);
      return true;
    }
    if (response.status === 410) {
      rememberToken(null);
      // 使用中的階段失效（逾時被回收或已釋放）：明確轉唯讀並說明，不替使用者悄悄重新取得。
      if (!resuming) {
        setReadonly(null, null, "編輯階段已失效（逾時被回收或已釋放），這個分頁現在是唯讀。重新整理頁面以重新取得。");
      }
    }
    return false;
  } catch (_error) {
    return false;  // 暫時連不上：下一次續期再試，不因此轉唯讀
  }
}

// 關頁（或重新整理）時主動釋放。用 sendBeacon＋text/plain：瀏覽器保證在頁面卸載後仍送出，且不必
// 跨來源預檢（關頁當下預檢多半來不及）。萬一這發也沒送到，後端的續期逾時會把階段收回（§7.2.2）。
window.addEventListener("pagehide", () => {
  if (!sessionToken) return;
  const body = new Blob([JSON.stringify({ token: sessionToken })], { type: "text/plain" });
  const sent = navigator.sendBeacon && navigator.sendBeacon(`${API_BASE}/api/session/lock/release`, body);
  if (!sent) {
    fetch(`${API_BASE}/api/session/lock`, {
      method: "DELETE",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token: sessionToken }),
      keepalive: true,
    }).catch(() => {});
  }
});

// ── W1 身分輸入 ──────────────────────────────────────────────────────────────
// 不是登入：沒有密碼、不驗證、角色是自我宣告（ADR-00000020）。唯一的用途是成為
// 變更紀錄的作者。文案一律用「身分輸入」，因為說「登入」會讓人以為有存取控制
// （CONTEXT.md「避免使用的說法」）。
const ROLE_TEXT = { user: "一般使用者", developer: "開發者" };

const identityForm = document.querySelector("[data-testid='identity-form']");
const identityError = document.querySelector("[data-testid='identity-error']");
const roleToggle = document.querySelector("[data-testid='role-toggle']");
const currentRole = document.querySelector("[data-testid='current-role']");
const header = document.querySelector("header");
const listView = document.querySelector("main");

function selectedRole() {
  const pressed = roleToggle.querySelector("[aria-pressed='true']");
  return pressed ? pressed.dataset.role : "user";
}

roleToggle.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-role]");
  if (!button) return;
  for (const option of roleToggle.querySelectorAll("button[data-role]")) {
    option.setAttribute("aria-pressed", String(option === button));
  }
});

// 六個整頁 view 靠 hidden 布林互斥切換。集中在這裡把全部設 hidden，各 show* 先呼叫它再打開
// 自己那個——否則每個 show* 都得逐一記得隱藏其餘五個，漏掉一個（whitelistView 先前就被 showList／
// showBrowse／showConfirm 全數漏掉，#252）就會兩個 view 疊著顯示，且殘留 view 裡的控制（如白名單的
// 「確認移除」）還活著、可從不該出現它的畫面觸發不可逆刪除。browseView／confirmView／whitelistView
// 在此函式之後才宣告，但本函式只在事件與啟動時被呼叫（那時整段 script 已初始化完畢），故安全。
function hideAllPageViews() {
  identityForm.hidden = true;
  header.hidden = true;
  listView.hidden = true;
  browseView.hidden = true;
  confirmView.hidden = true;
  whitelistView.hidden = true;
}

function showIdentityForm() {
  hideAllPageViews();
  identityForm.hidden = false;
}

// 目前身分。browse 的拒絕 UX 依角色分流（開發者才有加入白名單入口），返回也靠它。
let currentIdentity = null;

function showList(identity) {
  currentIdentity = identity;
  hideAllPageViews();
  header.hidden = false;
  listView.hidden = false;
  currentRole.textContent = identityLabel(identity);
  // 白名單維護面板開發者專屬：按鈕對一般使用者不出現於 DOM（UI-ELEMENTS.md 角色表、
  // ADR-00000020），不是停用。一般使用者的檢視走 browse 的根清單與允許範圍。
  whitelistButton.hidden = identity.role !== "developer";
  load();
  acquireSession();
}

// 別人正持有編輯階段（#33）：沒有自己的身分也能看清單，但一切會寫入的控制項不出現。
function showReadonlyList(detail) {
  currentIdentity = null;
  hideAllPageViews();
  header.hidden = false;
  listView.hidden = false;
  currentRole.textContent = "唯讀";
  whitelistButton.hidden = true;
  setReadonly(detail.holder, detail.started_at, null);
  load();
}

identityForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  identityError.hidden = true;

  const body = {
    name: identityForm.elements.name.value,
    email: identityForm.elements.email.value,
    role: selectedRole(),
  };

  try {
    const response = await fetch(`${API_BASE}/api/session`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const payload = await response.json();
    if (response.status === 409 && payload.detail && payload.detail.kind === "held") {
      // 別人正在編輯：不換身分（否則對方的紀錄會掛到你頭上），改以唯讀進清單（§7.2.2）。
      showReadonlyList(payload.detail);
      return;
    }
    if (!response.ok) {
      // 端點的訊息已經寫成可行動的樣子（欄位＋原因＋下一步），原樣顯示，
      // 不在這裡改寫成一句籠統的「輸入無效」（不變式 2）。
      identityError.textContent = detailText(payload.detail) || `${response.status} ${response.statusText}`;
      identityError.hidden = false;
      return;
    }
    showList(payload);
  } catch (error) {
    identityError.textContent = `送不出去：${error && error.message ? error.message : error}`;
    identityError.hidden = false;
  }
});

// ── W7 檔案瀏覽（#13）─────────────────────────────────────────────────────────
// 受白名單限制的瀏覽，供納管時選定路徑。獨立整頁 view，從工具列「納管」開啟。
// 白名單根為起點（GET /api/allowed-roots）；下鑽用後端回應的每個 entry.path，不在前端
// 拼路徑；麵包屑與目前位置用回應的 path（realpath）。拒絕依 kind＋角色分流（只有
// outside_roots 給開發者「加入白名單」入口，一般使用者看唯讀允許範圍）。
const browseView = document.querySelector("[data-testid='browse']");
const browseRootsEl = document.querySelector("[data-testid='browse-roots']");
const browseListEl = document.querySelector("[data-testid='browse-list']");
const breadcrumbEl = document.querySelector("[data-testid='breadcrumb']");
const browsePathInput = document.querySelector("[data-testid='browse-path-input']");
const browseSelectionEl = document.querySelector("[data-testid='browse-selection']");
const browseRejectedEl = document.querySelector("[data-testid='browse-rejected']");
const browseHintEl = document.querySelector("[data-testid='browse-hint']");

let whitelistRoots = [];
// 每次導覽遞增；回應回來時若世代已變（使用者又點了別的目錄／麵包屑、或用「前往」貼了新路徑），
// 丟棄這個過時回應——否則晚到的舊目錄回應會覆蓋新目錄，或讓被拒面板與成功清單並存（#252）。
let browseGeneration = 0;

function showBrowse() {
  // hideAllPageViews 一併藏起確認 view——否則兩個整頁 view 疊著，殘留的「確認寫入」還能送舊
  // 路徑（#14 審查）。並清掉可能殘留的選檔狀態（loadBrowseRoots 會重載根、清列表與麵包屑）。
  hideAllPageViews();
  selectedSourcePath = null;
  onboardStartEl.hidden = true;
  browseView.hidden = false;
  loadBrowseRoots();
}

async function loadBrowseRoots() {
  breadcrumbEl.replaceChildren();
  browseListEl.replaceChildren();
  browseSelectionEl.hidden = true;
  browseRejectedEl.hidden = true;
  try {
    const response = await fetch(`${API_BASE}/api/allowed-roots`);
    if (!response.ok) throw new Error(await loadErrorText(response));
    whitelistRoots = (await response.json()).prefixes;
    browseRootsEl.replaceChildren(...whitelistRoots.map((prefix) =>
      element("li", { "data-testid": `browse-root-${prefix}`, "data-path": prefix }, [
        element("span", { class: "browse-name", text: prefix }),
      ])
    ));
    browseHintEl.textContent = whitelistRoots.length
      ? "挑一個允許瀏覽的根開始，或在上方貼一個絕對路徑。"
      : "白名單目前是空的。";
  } catch (error) {
    browseHintEl.textContent = `讀不到白名單：${error && error.message ? error.message : error}`;
  }
}

async function browseTo(path) {
  const generation = ++browseGeneration;
  browseRejectedEl.hidden = true;
  // 換目錄就清掉「已選」——選取屬於某個目錄，離開它之後那個殘留會與目前位置不一致（#13）。
  browseSelectionEl.hidden = true;
  onboardStartEl.hidden = true;
  selectedSourcePath = null;
  try {
    const response = await fetch(`${API_BASE}/api/browse?path=${encodeURIComponent(path)}`);
    const payload = await response.json();
    if (generation !== browseGeneration) return;  // 有更新的導覽開始了，這個回應過時、丟棄
    if (!response.ok) {
      renderBrowseRejection(payload.detail, path);
      return;
    }
    // 成功抵達新目錄：再清一次選取狀態並確保被拒面板收起——若在載入途中於舊清單選了檔、或先前
    // 有一則被拒回應，這裡讓成功清單與那些殘留互斥，不會出現「已選：舊目錄的檔」或拒絕面板與清單
    // 並存（#252）。起點根清單也讓位給內容。
    selectedSourcePath = null;
    browseSelectionEl.hidden = true;
    onboardStartEl.hidden = true;
    browseRejectedEl.hidden = true;
    browseRootsEl.replaceChildren();
    browseHintEl.textContent = "";
    renderBreadcrumb(payload.path);
    renderBrowseEntries(payload.entries);
  } catch (error) {
    if (generation !== browseGeneration) return;
    browseHintEl.textContent = `瀏覽失敗：${error && error.message ? error.message : error}`;
  }
}

function renderBrowseEntries(entries) {
  browseListEl.replaceChildren(...entries.map((entry) =>
    element("li", {
      "data-testid": `browse-entry-${entry.name}`,
      "data-kind": entry.kind,
      "data-name": entry.name,
      "data-path": entry.path,
    }, [
      element("span", { class: "browse-name", text: entry.name }),
      element("span", { class: "kind", text: entry.kind === "dir" ? "目錄" : "檔案" }),
    ])
  ));
}

function renderBreadcrumb(path) {
  // 夾在白名單根為界：找出含這條路徑的根，只從根往下顯示（上溯不越過根）。
  const root = whitelistRoots.find((r) => path === r || path.startsWith(`${r}/`));
  const nodes = [];
  const pushSegment = (label, target) => {
    if (nodes.length) nodes.push(element("span", { class: "sep", text: "›" }));
    const seg = element("button", { type: "button", "data-path": target, text: label });
    seg.addEventListener("click", () => browseTo(target));
    nodes.push(seg);
  };
  if (root) {
    pushSegment(root, root);
    let acc = root;
    for (const part of path.slice(root.length).split("/").filter(Boolean)) {
      acc += `/${part}`;
      pushSegment(part, acc);
    }
  } else {
    // 路徑不在任何已知根底下——不該發生（root_prefixes 與 payload.path 都已 realpath 正規化，
    // 成功瀏覽的路徑必在某根之下）。防禦性地只顯示路徑、**不做可點的祖先**，免得在根不相符時
    // 讓人點到白名單根之上（#13 資安審查）。
    nodes.push(element("span", { class: "sep", text: path }));
  }
  breadcrumbEl.replaceChildren(...nodes);
}

function selectBrowseFile(path) {
  selectedSourcePath = path;
  browseSelectionEl.textContent = `已選：${path}`;
  browseSelectionEl.hidden = false;
  onboardStartEl.hidden = false;  // 選了檔才出現「檢視並納管」（進 W8 確認）
}

function renderBrowseRejection(detail, attempted) {
  // detail 是 {kind, message}（#13）。原樣顯示 message（含下一步，不改寫）；依 kind＋角色
  // 決定：只有 outside_roots 給加入白名單入口，開發者可加、一般使用者看唯讀允許範圍。
  const kind = detail && detail.kind;
  const message = (detail && detail.message) || String(detail);
  browseListEl.replaceChildren();
  const children = [
    element("strong", { text: "無法瀏覽這個路徑。" }),
    element("p", { class: "msg", text: message }),
  ];
  if (kind === "outside_roots") {
    if (currentIdentity && currentIdentity.role === "developer") {
      const prefixInput = element("input", {
        type: "text",
        "data-testid": "whitelist-prefix-input",
      });
      // 預填後端建議的目錄前綴（被拒目標的 realpath，檔案則取父目錄），退回 resolved／原字串；
      // 白名單根必須是目錄，用原字串會在目標是檔案或有 symlink 時加入失敗（#13）。可編輯。
      prefixInput.value = detail.suggested || detail.resolved || attempted;
      const addButton = element("button", { type: "button", text: "加入白名單" });
      addButton.addEventListener("click", () => addToWhitelist(prefixInput.value));
      children.push(element("div", { class: "add-row" }, [prefixInput, addButton]));
    } else {
      children.push(element("p", {
        text: "請開發者代為加入白名單。目前允許瀏覽的範圍：",
      }));
      children.push(element("ul", {
        class: "allowed-range", "data-testid": "allowed-range",
      }, whitelistRoots.map((prefix) => element("li", { text: prefix }))));
    }
  }
  browseRejectedEl.replaceChildren(...children);
  browseRejectedEl.setAttribute("data-kind", kind || "browse_error");
  browseRejectedEl.hidden = false;
}

// 加入白名單前的預覽與確認（§7.9：顯示「此路徑下有幾個可納管檔」供確認再送出）。兩個入口共用
// ——白名單維護頁，與瀏覽被拒時的「加入白名單」。後者原本一按就生效（人工驗證 U13）。
// 明確寫出即將開放的路徑：加入的是整個目錄（含子目錄），不只是剛才想看的那個檔案。
async function confirmAddRoot(prefix, showError) {
  // 顯示確認框前先比對目前的白名單：已經在裡面的直接說、不問「要開放嗎」——問了再答已存在，
  // 等於白按一次（複驗回饋）。只比對得出字面或後端解析過的路徑；符號連結等後端送出時仍會擋。
  const wanted = prefix.replace(/\/+$/, "") || prefix;
  try {
    const listed = await fetch(`${API_BASE}/api/allowed-roots`);
    if (listed.ok) {
      const roots = (await listed.json()).roots || [];
      const same = roots.find((root) => [root.prefix, root.resolved].includes(wanted));
      if (same) {
        showError(`「${same.prefix}」已經在白名單裡，這次沒有加入；既有的項目不用更動。`);
        return false;
      }
    }
  } catch (_error) {
    // 查不到目前的白名單就略過這一步：後端送出時仍會擋重複。
  }
  let payload;
  try {
    const response = await fetch(`${API_BASE}/api/candidate-count?prefix=${encodeURIComponent(prefix)}`);
    payload = await response.json();
    if (!response.ok) {
      showError(detailText(payload.detail));
      return false;
    }
  } catch (error) {
    showError(`數不出這個路徑底下有幾個檔案：${errText(error)}`);
    return false;
  }
  const shown = payload.capped ? `${payload.count} 個以上` : `${payload.count} 個`;
  return confirmAction(
    "加入白名單？",
    `將開放「${prefix}」這個目錄與它底下的所有子目錄，供瀏覽與納管；目前底下有 ${shown}可納管檔。`
      + "這會留下一筆紀錄（誰在何時加入），之後可以在白名單維護移除。",
  );
}

async function addToWhitelist(prefix) {
  const showAddError = (text) => {
    const slot = browseRejectedEl.querySelector(".msg");
    if (slot) slot.textContent = text;
  };
  if (!await confirmAddRoot(prefix, showAddError)) return;
  try {
    const response = await fetch(`${API_BASE}/api/allowed-roots`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ prefix }),
    });
    const payload = await response.json();
    if (!response.ok) {
      // 端點的訊息已可行動（含下一步），原樣顯示，不改寫（不變式 2）。
      const text = typeof payload.detail === "string"
        ? payload.detail
        : (payload.detail && payload.detail.message) || `${response.status}`;
      showAddError(text);
      return;
    }
    whitelistRoots = payload.prefixes;
    browseRejectedEl.hidden = true;
    browseTo(prefix);  // 重跑被拒的瀏覽——該路徑現在在白名單內了
  } catch (error) {
    showAddError(`送不出去：${error && error.message ? error.message : error}`);
  }
}

browseRootsEl.addEventListener("click", (event) => {
  const li = event.target.closest("li[data-path]");
  if (li) browseTo(li.dataset.path);
});

browseListEl.addEventListener("click", (event) => {
  const li = event.target.closest("li[data-testid^='browse-entry-']");
  if (!li) return;
  if (li.dataset.kind === "dir") browseTo(li.dataset.path);
  else selectBrowseFile(li.dataset.path);
});

document.querySelector("[data-testid='open-browse']").addEventListener("click", showBrowse);
browseView.querySelector(".browse-back").addEventListener("click", () => showList(currentIdentity));

// ── W9 白名單維護（#15）──────────────────────────────────────────────────────
// 開發者專屬面板：檢視誰/何時、新增含候選數預覽（GET /api/candidate-count，#206）、
// 移除含受影響確認（DELETE 未帶 confirmed 先回受影響清單＋409）。按鈕由 showList 依角色
// 顯示/隱藏。逃逸（../、symlink）由後端擋成 422，這裡原樣呈現。
const whitelistView = document.querySelector("[data-testid='whitelist']");
const whitelistButton = document.querySelector("[data-testid='open-whitelist']");
const whitelistRootsEl = document.querySelector("[data-testid='whitelist-roots']");
const whitelistAddInput = document.querySelector("[data-testid='whitelist-add-input']");
const whitelistPreviewEl = document.querySelector("[data-testid='whitelist-preview']");
const whitelistErrorEl = document.querySelector("[data-testid='whitelist-error']");
const whitelistConfirmEl = document.querySelector("[data-testid='whitelist-remove-confirm']");
// 每次預覽遞增；晚到的舊預覽若世代已變就丟棄——否則「此路徑下有 N 個可納管檔」會顯示上一次
// 輸入的數字，與目前輸入框不符；加入成功時也遞增它，作廢加入前送出、仍在途的預覽（#252）。
let previewGeneration = 0;

function errText(error) {
  return error && error.message ? error.message : String(error);
}

// 端點的 detail 有兩形：純字串（add／remove 的值錯誤）或物件（candidate-count 與 DELETE
// 確認的 {kind, message, …}）。兩者都取得出可行動訊息，不自造籠統字句（不變式 2）。
function detailText(detail) {
  if (typeof detail === "string") return detail;
  if (detail && detail.message) return detail.message;
  return JSON.stringify(detail);
}

function showWhitelist() {
  hideAllPageViews();
  whitelistView.hidden = false;
  whitelistAddInput.value = "";
  whitelistPreviewEl.hidden = true;
  whitelistErrorEl.hidden = true;
  whitelistConfirmEl.hidden = true;
  loadWhitelist();
}

async function loadWhitelist() {
  whitelistConfirmEl.hidden = true;
  try {
    const response = await fetch(`${API_BASE}/api/allowed-roots`);
    if (!response.ok) throw new Error(await loadErrorText(response));
    const roots = (await response.json()).roots;
    if (!roots.length) {
      whitelistRootsEl.replaceChildren(
        element("li", { class: "whitelist-empty", text: "白名單目前是空的。" })
      );
      return;
    }
    whitelistRootsEl.replaceChildren(...roots.map(whitelistRootRow));
  } catch (error) {
    whitelistRootsEl.replaceChildren(
      element("li", { class: "whitelist-empty", text: `讀不到白名單：${errText(error)}` })
    );
  }
}

function whitelistRootRow(root) {
  const remove = element("button", {
    type: "button", "data-testid": "whitelist-remove", text: "移除",
  });
  remove.addEventListener("click", () => beginRemoveRoot(root.prefix));
  return element("li", { "data-testid": `whitelist-root-${root.prefix}`, "data-prefix": root.prefix }, [
    element("span", { class: "whitelist-prefix", text: root.prefix }),
    element("span", { class: "whitelist-resolved", text: root.resolved }),
    element("span", { class: "whitelist-who", text: `由 ${root.added_by} 於 ${root.added_at}` }),
    remove,
  ]);
}

async function previewCandidates() {
  whitelistErrorEl.hidden = true;
  const prefix = whitelistAddInput.value.trim();
  if (!prefix) { whitelistPreviewEl.hidden = true; return; }
  const generation = ++previewGeneration;
  try {
    const response = await fetch(`${API_BASE}/api/candidate-count?prefix=${encodeURIComponent(prefix)}`);
    const payload = await response.json();
    if (generation !== previewGeneration) return;  // 有更新的預覽／加入開始了，這個回應過時、丟棄
    if (!response.ok) {
      whitelistPreviewEl.hidden = true;
      whitelistErrorEl.textContent = detailText(payload.detail);
      whitelistErrorEl.hidden = false;
      return;
    }
    const shown = payload.capped ? `${payload.count}+` : `${payload.count}`;
    whitelistPreviewEl.textContent = `此路徑下有 ${shown} 個可納管檔。`;
    whitelistPreviewEl.hidden = false;
  } catch (error) {
    if (generation !== previewGeneration) return;
    whitelistPreviewEl.hidden = true;
    whitelistErrorEl.textContent = `數不出來：${errText(error)}`;
    whitelistErrorEl.hidden = false;
  }
}

function clearPreview() {
  ++previewGeneration;  // 仍在途的預覽回來時作廢
  whitelistPreviewEl.hidden = true;
  whitelistPreviewEl.textContent = "";
}

async function addRoot() {
  whitelistErrorEl.hidden = true;
  clearPreview();  // 舊的預覽不留到這次的結果旁邊——那會被誤認成目前路徑的數字
  const prefix = whitelistAddInput.value.trim();
  if (!prefix) return;
  const showError = (text) => {
    whitelistErrorEl.textContent = text;
    whitelistErrorEl.hidden = false;
  };
  if (!await confirmAddRoot(prefix, showError)) return;
  try {
    const response = await fetch(`${API_BASE}/api/allowed-roots`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ prefix }),
    });
    const payload = await response.json();
    if (!response.ok) {
      whitelistErrorEl.textContent = detailText(payload.detail);
      whitelistErrorEl.hidden = false;
      return;
    }
    whitelistAddInput.value = "";
    whitelistPreviewEl.hidden = true;
    ++previewGeneration;  // 作廢加入前送出、仍在途的預覽，免得它稍後把已清空的預覽面板顯示回來（#252）
    loadWhitelist();
  } catch (error) {
    whitelistErrorEl.textContent = `送不出去：${errText(error)}`;
    whitelistErrorEl.hidden = false;
  }
}

async function beginRemoveRoot(prefix) {
  // 先以 confirmed=false 問後端：有受影響的納管項目就列出＋要求確認，不靜默移除（AC3）。
  // 後端在未確認時一律回 409 confirm_required（含受影響清單，可能為空）。
  whitelistErrorEl.hidden = true;
  try {
    const response = await fetch(`${API_BASE}/api/allowed-roots`, {
      method: "DELETE",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ prefix, confirmed: false }),
    });
    const payload = await response.json();
    if (response.status === 409 && payload.detail && payload.detail.kind === "confirm_required") {
      renderRemoveConfirm(prefix, payload.detail);
      return;
    }
    whitelistErrorEl.textContent = detailText(payload.detail);
    whitelistErrorEl.hidden = false;
  } catch (error) {
    whitelistErrorEl.textContent = `送不出去：${errText(error)}`;
    whitelistErrorEl.hidden = false;
  }
}

function renderRemoveConfirm(prefix, detail) {
  const affected = element("ul", { "data-testid": "whitelist-affected" },
    (detail.affected || []).map((item) =>
      element("li", { text: `${item.ref}：${item.target}` })));
  const confirm = element("button", {
    type: "button", "data-testid": "whitelist-confirm-remove", text: "確認移除",
  });
  confirm.addEventListener("click", () => confirmRemoveRoot(prefix));
  const cancel = element("button", {
    type: "button", "data-testid": "whitelist-cancel-remove", text: "取消",
  });
  cancel.addEventListener("click", () => { whitelistConfirmEl.hidden = true; });
  // 這段是寫給按按鈕的人看的，由介面自己說：要移除的是哪一個、會怎樣、已納管的受不受影響。
  const listed = (detail.affected || []).length;
  const about = listed
    ? `以下 ${listed} 份已納管的設定的目標在這個路徑底下——它們不受影響，仍會繼續管理：`
    : "目前沒有已納管的設定的目標在這個路徑底下。";
  whitelistConfirmEl.replaceChildren(
    element("p", {
      class: "whitelist-confirm-msg",
      text: `要把「${prefix}」從白名單移除嗎？移除後這個路徑底下的檔案不能再瀏覽或納管。${about}`,
    }),
    affected, confirm, cancel);
  whitelistConfirmEl.hidden = false;
}

async function confirmRemoveRoot(prefix) {
  try {
    const response = await fetch(`${API_BASE}/api/allowed-roots`, {
      method: "DELETE",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ prefix, confirmed: true }),
    });
    const payload = await response.json();
    if (!response.ok) {
      whitelistErrorEl.textContent = detailText(payload.detail);
      whitelistErrorEl.hidden = false;
      return;
    }
    whitelistConfirmEl.hidden = true;
    loadWhitelist();
  } catch (error) {
    whitelistErrorEl.textContent = `送不出去：${errText(error)}`;
    whitelistErrorEl.hidden = false;
  }
}

whitelistButton.addEventListener("click", showWhitelist);
whitelistView.querySelector("[data-testid='whitelist-back']")
  .addEventListener("click", () => showList(currentIdentity));
whitelistView.querySelector("[data-testid='whitelist-preview-button']")
  .addEventListener("click", previewCandidates);
whitelistView.querySelector("[data-testid='whitelist-add']")
  .addEventListener("click", addRoot);
// 路徑一改，先前的預覽就不是這個路徑的了：清掉，不留著讓人誤認。
whitelistAddInput.addEventListener("input", () => {
  clearPreview();
  whitelistErrorEl.hidden = true;
});
browseView.querySelector(".browse-go").addEventListener("click", () => {
  const path = browsePathInput.value.trim();
  if (path) browseTo(path);
});

// ── W8 納管確認（#14）───────────────────────────────────────────────────────
// 選檔（W7）→「檢視並納管」→ POST /api/inspect → 顯示格式／型別／歧義／權限／hostname
// 供確認 → 逐條確認歧義後 → POST /api/configs 寫入 → 回清單。型別只顯示不可編輯（編輯是
// W3／#16）。hostname 只顯示、不由前端送（後端納管當下決定並凍結，不變式 8）。
let selectedSourcePath = null;
let currentAmbiguities = [];
// 每次偵測遞增；回應回來時若世代已變（使用者又換了格式、發了新偵測），丟棄這個過時回應
// ——否則晚到的舊回應會覆寫成與當前格式不符的型別/歧義，甚至以較少的歧義繞過確認閘門（#14 審查）。
let inspectGeneration = 0;

const onboardStartEl = document.querySelector("[data-testid='onboard-start']");
const confirmView = document.querySelector("[data-testid='onboard-confirm']");
const onboardPathEl = document.querySelector("[data-testid='onboard-path']");
const onboardFormatEl = document.querySelector("[data-testid='onboard-format']");
const onboardHostnameEl = document.querySelector("[data-testid='onboard-hostname']");
const onboardPermsEl = document.querySelector("[data-testid='onboard-permissions']");
const onboardSummaryEl = document.querySelector("[data-testid='onboard-summary']");
const onboardTypesEl = document.querySelector("[data-testid='onboard-types']");
const onboardAmbiguitiesEl = document.querySelector("[data-testid='onboard-ambiguities']");
const onboardErrorEl = document.querySelector("[data-testid='onboard-error']");
const onboardSubmitEl = document.querySelector("[data-testid='onboard-submit']");

// 副檔名只當**建議**（不變式 8：副檔名不是持續權威，使用者可改、確認後才明寫進清單檔）。
const FORMAT_BY_EXT = { yaml: "yaml", yml: "yaml", json: "json", toml: "toml", ini: "ini" };
const TYPE_TEXT = {
  bool: "布林", int: "整數", float: "浮點數", string: "字串",
  dict: "物件", list: "陣列", null: "null", unknown: "未知",
};

function guessFormat(path) {
  const ext = path.split(".").pop().toLowerCase();
  return FORMAT_BY_EXT[ext] || "raw";
}

function showConfirm() {
  hideAllPageViews();
  confirmView.hidden = false;
}

function openConfirm(path) {
  onboardPathEl.textContent = path;
  onboardFormatEl.value = guessFormat(path);
  showConfirm();
  runInspect();
}

function clearInspectResults() {
  // 每次偵測前清掉上一檔的結果。少了它，偵測失敗時 W8 會殘留前一檔的型別／歧義／hostname，
  // 而殘留的歧義勾選框仍掛著 change→refreshSubmitState——勾滿就把「確認寫入」重新解鎖，於是
  // 對一個偵測失敗的檔案送出納管、還帶著另一檔的歧義確認，繞過 AC4 的確認閘門。
  onboardHostnameEl.textContent = "";
  onboardPermsEl.textContent = "";
  onboardSummaryEl.textContent = "";
  onboardTypesEl.replaceChildren();
  onboardAmbiguitiesEl.replaceChildren();
  currentAmbiguities = [];
}

async function runInspect() {
  const generation = ++inspectGeneration;
  onboardErrorEl.hidden = true;
  onboardSubmitEl.disabled = true;
  clearInspectResults();
  try {
    const response = await fetch(`${API_BASE}/api/inspect`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        source_path: onboardPathEl.textContent,
        format: onboardFormatEl.value,
      }),
    });
    const payload = await response.json();
    if (generation !== inspectGeneration) return;  // 有更新的偵測開始了，這個回應過時、丟棄
    if (!response.ok) {
      renderOnboardError(payload.detail);
      return;
    }
    renderInspect(payload);
  } catch (error) {
    if (generation !== inspectGeneration) return;
    renderOnboardError(String(error && error.message ? error.message : error));
  }
}

function renderInspect(payload) {
  onboardHostnameEl.textContent = `將以 hostname＝${payload.hostname} 納管`;
  const permissions = payload.permissions;
  onboardPermsEl.textContent =
    `原始權限 ${permissions.owner}:${permissions.group} ${permissions.mode}`;
  // raw 不解析——說明語意，不顯示「0 個欄位」這種假訊號（#195 資安審查的同一類）。
  onboardSummaryEl.textContent = payload.format === "raw"
    ? "raw：只版控、不解析，因此沒有欄位、型別或歧義。"
    : `偵測到 ${payload.field_count} 個欄位。`;
  renderTypeTree(payload.types);
  renderAmbiguities(payload.ambiguities);
  refreshSubmitState();
}

function renderTypeTree(types) {
  // 後端回的 types 已含容器（dict／list）與葉，鍵為前序走訪的欄位路徑（. 相接、[] 標元素）。
  // key 裡的字面點跳脫成 \.（#219），所以深度只算「未跳脫的點」與 []，葉名取最後一段後把
  // \. 還原成 .——否則含點 key 會被算錯層、或葉名被切半。
  onboardTypesEl.replaceChildren(...Object.keys(types).map((path) => {
    const type = types[path];
    const depth = (path.match(/(?<!\\)\.|\[\]/g) || []).length;
    const leaf = path.split(/(?<!\\)\./).pop().replace(/\\\./g, ".");
    const node = element("li", {
      "data-testid": `onboard-type-${path}`,
      "data-name": path,
      "data-type": type,
    }, [
      element("span", { text: `${"　".repeat(depth)}${leaf}` }),
      element("span", { class: "type", text: TYPE_TEXT[type] || type }),
    ]);
    if (type === "dict" || type === "list") node.setAttribute("data-container", "true");
    return node;
  }));
}

function renderAmbiguities(ambiguities) {
  currentAmbiguities = ambiguities;
  onboardAmbiguitiesEl.replaceChildren(...ambiguities.map((ambiguity) => {
    const ack = element("input", {
      type: "checkbox",
      "data-testid": `onboard-ambiguity-ack-${ambiguity.line}`,
    });
    ack.addEventListener("change", refreshSubmitState);
    return element("div", {
      class: "onboard-ambiguity",
      "data-testid": `onboard-ambiguity-${ambiguity.line}`,
    }, [
      element("label", {}, [
        ack,
        element("span", { text: `第 ${ambiguity.line} 行「${ambiguity.value}」` }),
      ]),
      element("p", { class: "readings", text: ambiguity.readings.join("；") }),
    ]);
  }));
}

function refreshSubmitState() {
  // 每個歧義都要勾了才解鎖「確認寫入」（AC4：確認後才繼續）。無歧義時 every 回 true。
  // 錯誤顯示中一律停用：偵測失敗的檔案不該送得出去，即使有殘留／勾選的框（縱深防禦，
  // 主要仍靠 clearInspectResults 不留殘留框）。
  const acks = [...onboardAmbiguitiesEl.querySelectorAll("input[type='checkbox']")];
  onboardSubmitEl.disabled = !onboardErrorEl.hidden || !acks.every((box) => box.checked);
}

function renderOnboardError(detail) {
  // detail 三形狀：字串（onboard）、{message,file,line}（inspect）、list（FastAPI 驗證）。
  let message;
  if (typeof detail === "string") {
    message = detail;
  } else if (Array.isArray(detail)) {
    message = detail.map((item) => item.msg || JSON.stringify(item)).join("；");
  } else if (detail && detail.message) {
    // 只顯示 message：inspect 的語法錯誤訊息本身已內嵌「（第 N 行）」，前端不再補一次（#14 審查）。
    message = detail.message;
  } else {
    message = String(detail);
  }
  onboardErrorEl.textContent = message;
  onboardErrorEl.hidden = false;
  onboardSubmitEl.disabled = true;
}

async function submitOnboard() {
  // 歧義確認彙整進 commit 內文，供日後追溯當時怎麼確認的（onboard 原樣寫入、不解析）。
  const note = currentAmbiguities
    .map((ambiguity) => `第 ${ambiguity.line} 行「${ambiguity.value}」已確認`)
    .join("；");
  onboardErrorEl.hidden = true;
  try {
    const response = await fetch(`${API_BASE}/api/configs`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        source_path: onboardPathEl.textContent,
        format: onboardFormatEl.value,
        ambiguity_note: note,
      }),
    });
    const payload = await response.json();
    if (!response.ok) {
      renderOnboardError(payload.detail);
      return;
    }
    showList(currentIdentity);  // 回清單；load() 會重掃，新條目就出現在左側樹
  } catch (error) {
    renderOnboardError(String(error && error.message ? error.message : error));
  }
}

onboardStartEl.addEventListener("click", () => {
  if (selectedSourcePath) openConfirm(selectedSourcePath);
});
onboardFormatEl.addEventListener("change", runInspect);
onboardSubmitEl.addEventListener("click", submitOnboard);
onboardTypesEl.addEventListener("click", (event) => {
  const container = event.target.closest("li[data-container='true']");
  if (!container) return;
  // 折疊狀態記在容器自己身上（data-collapsed），再依「任一祖先折疊了嗎」重算每個節點的可見性
  // ——不用 toggle 逐一翻子節點：巢狀時「先折內層再折外層」會把已折疊的深層子節點翻回來（#14 審查）。
  container.dataset.collapsed = container.dataset.collapsed === "true" ? "false" : "true";
  const collapsed = [...onboardTypesEl.querySelectorAll("li[data-container='true']")]
    .filter((node) => node.dataset.collapsed === "true")
    .map((node) => node.dataset.name);
  for (const node of onboardTypesEl.querySelectorAll("li")) {
    const name = node.dataset.name;
    const hidden = collapsed.some(
      (prefix) => name !== prefix && (name.startsWith(`${prefix}.`) || name.startsWith(`${prefix}[`))
    );
    node.classList.toggle("is-collapsed-child", hidden);
  }
});
confirmView.querySelector(".onboard-cancel").addEventListener("click", showBrowse);

// 已經輸入過身分就直接進清單（重新整理不必再填一次）。
(async function start() {
  try {
    const response = await fetch(`${API_BASE}/api/session`);
    const identity = response.ok ? await response.json() : null;
    // 這個分頁曾被拒（別人持有）就不沿用 app 上的身分——那是持有者的；請填自己的（#33）。
    if (identity && !wasRefused()) {
      showList(identity);
      return;
    }
  } catch (error) {
    // backend 連不上時仍顯示身分輸入頁：那是使用者唯一能操作的東西，
    // 而送出時的錯誤會說明真正的問題。
  }
  showIdentityForm();
})();
</script>
