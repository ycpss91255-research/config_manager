        type: "button", class: "type-clear editing-only", "data-testid": "type-clear",
        title: "清除這一欄的型別指定，回到指定之前", text: "清除",
      });
      clearButton.addEventListener("click", () => specify(row, null, () => {}));
      cell.appendChild(clearButton);
    }
  }
  return cell;
}

function paramRow(row, table) {
  const { entries, onChange, specify } = table;
  const attributes = {
    class: "param-row",
    "data-testid": `param-${row.path}`,
    "data-name": row.path,
    "data-type": row.type,
    "data-depth": String(row.depth),
  };
  if (row.container) attributes["data-container"] = "true";
  const node = element("li", attributes, [
    element("span", {
      class: "param-name",
      text: `${"　".repeat(row.depth)}${row.container ? "▾ " : ""}${row.name}`,
    }),
    typeCell(row, specify),
  ]);
  row.node = node;
  // 清單的元素（不管在第幾層）：這一列有 ↑↓ 與移除。元素的最後一段位置是數字，物件的欄位是鍵。
  if (row.owner && typeof row.segments[row.segments.length - 1] === "number") {
    node.appendChild(listOps(row, table));
  }
  if (row.container) {
    if (row.working) {
      // 清單的擁有者：新增元素的入口在這一列；清單整體有沒有改動也標在這一列（#46）。
      node.appendChild(listAdd(row, table));
      entries.push({ row, node, refresh: () => updateOwner(row, onChange) });
      updateOwner(row, null);
    } else if (row.type === "list" && row.owner) {
      node.appendChild(listAdd(row, table));  // 清單裡的清單：一樣可以加一項
    }
    return node;
  }
  if (row.hint && row.hint.description) {
    // schema 的說明顯示在欄位旁，滑鼠停留看得到全文（§7.5.1）。
    const name = node.querySelector(".param-name");
    name.title = row.hint.description;
    name.appendChild(element("span", {
      class: "param-description", "data-testid": "param-description",
      title: row.hint.description, "aria-label": row.hint.description, text: " ⓘ",
    }));
  }
  if (row.type === "unknown" || row.type === "null") {
    node.querySelector(".param-name").appendChild(element("span", {
      class: "param-unstructured", "data-testid": "param-unstructured",
      title: "這個欄位沒有型別保護，輸入什麼都照字面存成文字。請優先補 schema 給它型別。",
      text: " 未結構化編輯",
    }));
  }
  const control = valueControl(row);
  const source = element("span", {
    class: "param-source", "data-testid": "param-source-value",
    text: row.value === undefined ? "—" : displayValue(row.value, row.type),
  });
  const validation = element("span", { class: "param-validation", "data-testid": "param-validation" });
  node.append(element("span", { class: "param-value-wrap" }, [control]), source, validation);
  const refresh = () => {
    refreshParamRow(node, control, row, source, validation);
    if (row.owner) {
      // 清單底下的列：把值寫回擁有者的工作副本，整個清單的變動與否由擁有者那一列說。
      setAt(row.owner.working, row.segments, currentValue(control, row));
      updateOwner(row.owner, null);
    }
    if (onChange) onChange();
  };
  entries.push({ row, control, node, refresh });
  control.addEventListener("input", refresh);
  control.addEventListener("change", () => {
    // double：離開欄位時把整數樣子的輸入正規化成帶小數點（打字中不動，否則沒法打出 52）。
    if (row.type === "float" && control.value !== "" && !control.validity.badInput) {
      control.value = formatDouble(Number(control.value));
    }
    refresh();
  });
  refresh();  // 一開始就標好 data-valid／data-changed，讓「尚未改動」與「改成一樣的值」是同一個狀態
  return node;
}

// ── 清單的增刪調序（#46、§7.5.2）────────────────────────────────────────────
// 順序本身就是資料：只給新增／移除的話，要把第三項移到第一位得刪掉重打，重打會遺失原值、也容易
// 打錯。所以每個元素有 ↑↓ 與移除，清單有新增；全部改在擁有者的工作副本上，改完整段重畫。

const same = (left, right) => JSON.stringify(left) === JSON.stringify(right);

function setAt(target, segments, value) {
  let node = target;
  for (const segment of segments.slice(0, -1)) node = node[segment];
  node[segments[segments.length - 1]] = value;
}

function updateOwner(owner, onChange) {
  owner.node.dataset.dirty = String(!same(owner.working, owner.listBaseline));
  owner.node.dataset.changed = String(!same(owner.working, owner.value));
  owner.node.dataset.valid = "true";
  if (onChange) onChange();
}

// 擁有者底下某個清單——`segments` 是它相對擁有者的位置，空的就是擁有者自己——在工作副本與影子裡
// 的那兩個陣列。影子先補到一樣長（新增的元素在影子裡是空位）；影子那邊整段沒有（外層元素本身
// 就是新增的）回 null，那就沒有東西要跟著搬。
function listsAt(owner, segments) {
  const walk = (root) => segments.reduce(
    (node, segment) => (node === null || node === undefined ? undefined : node[segment]), root,
  );
  const items = walk(owner.working);
  const found = walk(owner.shadow);
  const mirror = Array.isArray(found) ? found : null;
  while (mirror && mirror.length < items.length) mirror.push(undefined);
  return { items, mirror };
}

function listOps(row, table) {
  const owner = row.owner;
  const parent = row.segments.slice(0, -1);  // 這個元素所在的清單
  const index = row.segments[row.segments.length - 1];
  const last = listsAt(owner, parent).items.length - 1;
  const button = (testid, text, title, disabled, act) => {
    const made = element("button", {
      type: "button", class: "list-op editing-only", "data-testid": testid, title, text,
    });
    made.disabled = disabled;
    made.addEventListener("click", act);
    return made;
  };
  const move = (to) => {
    const { items, mirror } = listsAt(owner, parent);
    [items[index], items[to]] = [items[to], items[index]];
    if (mirror) [mirror[index], mirror[to]] = [mirror[to], mirror[index]];  // 影子跟著搬
    rerenderList(owner, table);
  };
  return element("span", { class: "list-ops" }, [
    button("list-up", "↑", "往上移一位", index === 0, () => move(index - 1)),
    button("list-down", "↓", "往下移一位", index === last, () => move(index + 1)),
    button("list-remove", "✕", "移除這一項", false, () => {
      const { items, mirror } = listsAt(owner, parent);
      items.splice(index, 1);
      if (mirror) mirror.splice(index, 1);
      rerenderList(owner, table);
    }),
  ]);
}

// 新增一項：元素型別一致（§7.5.2）——依清單的元素型別給一個空值；元素是物件時以最後一項為樣板
// （欄位齊、再改值），清單還是空的且不知道元素型別時給空字串（未結構化編輯）。
const EMPTY_BY_TYPE = { int: 0, float: 0, bool: false, string: "" };

function listAdd(listRow, table) {
  const owner = listRow.owner || listRow;  // 清單裡的清單由最外層那份擁有
  const segments = listRow.segments || [];
  const button = element("button", {
    type: "button", class: "list-op editing-only", "data-testid": "list-add", text: "＋ 新增",
    title: "在清單末端加一項",
  });
  button.addEventListener("click", () => {
    const elementType = table.detail.types[`${listRow.typePath}[]`] || "unknown";
    const { items } = listsAt(owner, segments);
    const lastItem = items[items.length - 1];
    let fresh = EMPTY_BY_TYPE[elementType];
    if (elementType === "dict" || elementType === "list") fresh = lastItem === undefined ? {} : clone(lastItem);
    if (fresh === undefined) fresh = "";
    items.push(fresh);
    // 影子在同一個位置留空位：新增的元素沒有來源值，就算以最後一項為樣板也一樣。
    listsAt(owner, segments);
    rerenderList(owner, table);
    const added = table.list.querySelector(
      `[data-name='${listRow.path}[${items.length - 1}]'] [data-testid='param-value']`,
    );
    if (added && added.focus) added.focus();
  });
  return button;
}

// 整段重畫擁有者底下的列：舊的列與 entries 拿掉、從工作副本重建。擁有者那一列不動。
function rerenderList(owner, table) {
  const { detail, entries, list } = table;
  const prefix = `${owner.path}[`;
  for (const node of [...list.querySelectorAll("li[data-name]")]) {
    if (node.dataset.name.startsWith(prefix)) node.remove();
  }
  for (let index = entries.length - 1; index >= 0; index -= 1) {
    if (entries[index].row.owner === owner) entries.splice(index, 1);
  }
  const rows = [];
  owner.working.forEach((child, index) => collectRows(detail, rows, {
    value: owner.shadow[index], draft: child, path: `${owner.path}[${index}]`,
    typePath: `${owner.typePath}[]`, depth: owner.depth + 1, name: `[${index}]`,
    owner, segments: [index],
  }));
  let anchor = owner.node;
  for (const row of rows) {
    const node = paramRow(row, table);
    anchor.after(node);
    anchor = node;
  }
  updateOwner(owner, table.onChange);
}

function currentValue(control, row) {
  if (control.choices) return control.choices[control.selectedIndex];
  if (row.type === "bool") return control.checked;
  if (row.type === "int" || row.type === "float") return Number(control.value);
  return control.value;
}

// 值相對 schema 的範圍／倍數（#40）。回原因與修法；合格回空字串。倍數以容許誤差比（0.3 ÷ 0.1 在
// 浮點數上不是整數）。
function rangeProblem(number, hint) {
  if (!hint) return "";
  if (hint.minimum !== undefined && number < hint.minimum) return `超出範圍：不可小於 ${hint.minimum}`;
  if (hint.maximum !== undefined && number > hint.maximum) return `超出範圍：不可大於 ${hint.maximum}`;
  if (hint.exclusiveMinimum !== undefined && number <= hint.exclusiveMinimum) {
    return `超出範圍：必須大於 ${hint.exclusiveMinimum}`;
  }
  if (hint.exclusiveMaximum !== undefined && number >= hint.exclusiveMaximum) {
    return `超出範圍：必須小於 ${hint.exclusiveMaximum}`;
  }
  if (hint.multipleOf !== undefined) {
    const ratio = number / hint.multipleOf;
    if (Math.abs(ratio - Math.round(ratio)) > 1e-9) return `必須是 ${hint.multipleOf} 的倍數`;
  }
  return "";
}

function localProblem(control, row) {
  if (control.choices) {
    const outside = control.selectedOptions[0] && control.selectedOptions[0].dataset.outside;
    return outside ? "目前的值不在允許的值裡，請改選一個" : "";
  }
  if (row.type !== "int" && row.type !== "float") return "";
  if (control.validity.badInput) return row.type === "int" ? "必須是整數，不接受小數或文字" : "必須是數字";
  if (control.value === "") return "不可為空";
  const number = Number(control.value);
  if (row.type === "int" && !Number.isInteger(number)) return "必須是整數，不接受小數或文字";
  return rangeProblem(number, row.hint);
}

function refreshParamRow(node, control, row, source, validation) {
  const problem = localProblem(control, row);
  validation.textContent = problem;
  node.dataset.valid = problem ? "false" : "true";
  delete node.dataset.warning;  // 規則的警告是後端標的；值一改就重算，標記由下一次儲存重標
  const current = displayValue(currentValue(control, row), row.type);
  const changed = current !== displayValue(row.value, row.type);  // 相對來源（「來源值」欄標色）
  node.dataset.changed = String(changed);
  node.dataset.dirty = String(current !== displayValue(row.baseline, row.type));  // 相對已存的草稿
  if (changed) source.setAttribute("data-changed", "true");
  else source.removeAttribute("data-changed");
}

function toggleCollapse(list, container) {
  // 折疊狀態記在容器身上，再依「任一祖先折疊了嗎」重算每列可見性（與 W8 型別樹同一做法）。
  container.dataset.collapsed = container.dataset.collapsed === "true" ? "false" : "true";
  const collapsed = [...list.querySelectorAll("li[data-container='true']")]
    .filter((node) => node.dataset.collapsed === "true")
    .map((node) => node.dataset.name);
  for (const node of list.querySelectorAll("li[data-name]")) {
    const name = node.dataset.name;
    const hidden = collapsed.some(
      (prefix) => name !== prefix && (name.startsWith(`${prefix}.`) || name.startsWith(`${prefix}[`))
    );
    node.classList.toggle("is-collapsed-child", hidden);
  }
}

// ── W4 歷史（#25／#26）───────────────────────────────────────────────────────
// 使用者看到的是行為，不是代號（§7.6.1）：內部類型只在這張表裡對應成中文，列表上不出現
// cfg／revert／import 這些字。左列表／右差異（圖 13）；差異以參數為單位（§7.6.2）：哪個參數從什麼
// 變成什麼，與 W3 的欄位表語言、顏色一致（改動＝偏離紅）。「當前版本」＝來源複本現況。
const KIND_TEXT = {
  import: "納入管理", cfg: "修改參數", revert: "退回舊版本",
  adopt: "採納現場調整", meta: "調整設定", unmanage: "解除管理",
};
const ALL_KINDS = Object.keys(KIND_TEXT).join(",");
let historyGeneration = 0;

function formatTime(iso) {
  const parsed = new Date(iso);
  return Number.isNaN(parsed.getTime()) ? iso : parsed.toLocaleString("zh-TW", { hour12: false });
}

// 行為描述之外的說明：退回舊版本附「退回到哪一版」（§7.6.1），其餘直接用紀錄的說明。
function describeChange(change) {
  if (change.kind === "revert") {
    const matched = /rollback to ([0-9a-f]+)/.exec(change.summary);
    if (matched) return `退回到版本 ${matched[1]}`;
  }
  return change.summary;
}

function openHistory(detail, notice) {
  const generation = ++historyGeneration;
  const back = element("button", { type: "button", "data-testid": "history-back", text: "返回欄位表" });
  back.addEventListener("click", () => openPanel(detail.uid));
  const filter = element("div", { class: "history-filter", "data-testid": "history-filter", role: "group" }, [
    element("button", { type: "button", "data-filter": "content", "aria-pressed": "true", text: "只看內容變更" }),
    element("button", { type: "button", "data-filter": "all", "aria-pressed": "false", text: "全部" }),
  ]);
  const view = element("section", { class: "panel history", "data-testid": `history-${detail.uid}` }, [
    element("div", { class: "panel-head" }, [
      element("span", { class: "name", text: `歷史　${detail.name}` }),
      element("span", { class: "target", text: detail.target }),
      back,
    ]),
    filter,
    element("p", { class: "notice", "data-testid": "history-notice", text: notice || "" }),
    element("div", { class: "history-body" }, [
      element("ul", { class: "history-list", "data-testid": "history-list" }),
      element("div", { class: "history-diff", "data-testid": "history-diff" }, [
        element("p", { class: "notice", text: "選一筆變更，這裡顯示它與目前版本的差異（以參數為單位）。" }),
      ]),
    ]),
  ]);
  filter.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-filter]");
    if (!button) return;
    for (const option of filter.querySelectorAll("button[data-filter]")) {
      option.setAttribute("aria-pressed", String(option === button));
    }
    loadHistory(view, detail, button.dataset.filter, ++historyGeneration);
  });
  view.querySelector("[data-testid='history-notice']").hidden = !notice;
  mountView(detail.uid, view, "history");
  loadHistory(view, detail, "content", generation);
}

async function loadHistory(view, detail, filter, generation) {
  const list = view.querySelector("[data-testid='history-list']");
  list.replaceChildren(element("li", { class: "notice", text: "載入中…" }));
  const query = filter === "all" ? `?prefix=${ALL_KINDS}` : "";
  try {
    const response = await apiFetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/history${query}`);
    if (!response.ok) throw new Refused(await loadErrorText(response));
    const changes = await response.json();
    if (generation !== historyGeneration) return;
    list.replaceChildren(...changes.map((change) => historyEntry(change, detail, view)));
    if (!changes.length) {
      list.appendChild(element("li", {
        class: "notice", "data-testid": "history-empty",
        text: filter === "all"
          ? "這份 config 還沒有任何變更紀錄。"
          : "這份 config 納管後還沒有改過內容，所以沒有內容變更的紀錄。"
            + "下一步：切到「全部」可看到其他類型（納入管理、退回舊版本…）。",
      }));
    } else if (filter === "all" && changes.length === 1) {
      // 只有一筆（通常就是納入管理那一筆）：說明為什麼沒有東西可比、可退，不讓人對著一筆紀錄找按鈕。
      list.appendChild(element("li", {
        class: "notice", "data-testid": "history-single",
        text: "目前只有這一筆紀錄——還沒有更早的版本可以比較或退回。修改並進版之後，這裡會多出新的紀錄。",
      }));
    }
  } catch (error) {
    if (generation !== historyGeneration) return;
    list.replaceChildren(element("li", { class: "notice error", "data-testid": "history-error" }, [
      element("strong", { text: "讀不到變更歷史。" }),
      element("pre", { text: failureText("讀取變更歷史", error) }),
    ]));
  }
}

function historyEntry(change, detail, view) {
  const author = change.author.replace(/\s*<[^>]*>$/, "");  // 列表只顯示姓名；email 在 title
  const node = element("li", {
    class: "history-entry", "data-testid": `history-entry-${change.sha}`, "aria-selected": "false",
  }, [
    element("span", { class: "history-kind", text: KIND_TEXT[change.kind] || "變更" }),
    element("span", { class: "history-summary", text: describeChange(change) }),
    element("span", { class: "history-meta" }, [
      element("span", { "data-testid": "history-author", text: author, title: change.author }),
      element("time", { "data-testid": "history-time", datetime: change.at, text: formatTime(change.at) }),
    ]),
  ]);
  if ((change.overrides || []).length) {
    // 這一筆略過了哪些規則、理由是什麼（#42／#45）：理由出現在變更紀錄中，不只在 commit 內文。
    node.appendChild(element("ul", { class: "history-overrides", "data-testid": "history-overrides" },
      change.overrides.map((item) => element("li", { text: `略過規則 ${item.rule}：${item.reason}` }))));
  }
  node.addEventListener("click", () => selectChange(view, detail, change, node));
  return node;
}

async function selectChange(view, detail, change, node) {
  const generation = ++historyGeneration;
  for (const entry of view.querySelectorAll("li[data-testid^='history-entry-']")) {
    entry.setAttribute("aria-selected", String(entry === node));
  }
  const diff = view.querySelector("[data-testid='history-diff']");
  diff.replaceChildren(element("p", { class: "notice", text: "載入中…" }));
  try {
    const url = `${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/history/${change.sha}`;
    const response = await apiFetch(url);
    if (!response.ok) throw new Refused(await loadErrorText(response));
    const version = await response.json();
    if (generation !== historyGeneration) return;
    renderDiff(diff, version, detail, view);
  } catch (error) {
    if (generation !== historyGeneration) return;
    diff.replaceChildren(element("div", { class: "notice error", "data-testid": "history-diff-error" }, [
      element("strong", { text: "讀不到這一版的內容。" }),
      element("pre", { text: failureText("讀取這一版的內容", error) }),
    ]));
  }
}

// 那一版 vs 目前版本，以參數為單位（§7.6.2）：same／changed／added（那版沒有、現在有）／removed。
function renderDiff(target, version, detail, view) {
  // 那一版（左）vs 目前版本（右），與 W5 共用同一套比對與列（paramDiff／diffRow）。
  const compared = paramDiff(version, detail);
  const rows = compared.map((row) => diffRow(row, "diff-from", "diff-to", "→"));
  const differing = compared.filter((row) => row.change !== "same").length;
  // 退回此版本（#27、§5.3 圖 7）：看過差異才退；不可逆（會產生一筆新紀錄並寫出目標）→ W6 確認對話框。
  const revertButton = element("button", {
    type: "button", class: "editing-only", "data-testid": "history-revert", text: "退回此版本",
  });
  revertButton.disabled = differing === 0;
  revertButton.title = differing === 0 ? "這一版與目前版本相同，沒有東西可退" : "";
  revertButton.addEventListener("click", () => revertTo(view, detail, version, differing, revertButton));
  target.replaceChildren(
    element("p", {
      class: "diff-summary", "data-testid": "history-diff-summary",
      text: differing ? `與目前版本相比：${differing} 個參數不同（左邊是那一版，右邊是目前）` : "與目前版本沒有參數不同。",
    }),
    element("ul", {}, rows),
    element("div", { class: "panel-actions" }, [
      element("span", { class: "hint", text: "退版會產生一筆新的變更紀錄並寫出到目標；歷史不會被改寫，之後仍可再退。" }),
      revertButton,
    ]),
  );
}

// 退版時 schema 跟著回到那一版（#39 的定案）。會改到開發者設的限制，所以確認框先說、完成後再說一次，
// 不讓它悄悄發生。沒有影響（null）就不提。
const SCHEMA_EFFECT_TEXT = {
  restore: "這份的 schema 也會回到那一版當時的內容——之後才加上的限制會一併退掉。",
  remove: "那一版當時還沒有 schema：退回後這份不再有 schema，修改不再依它檢查。",
};
const SCHEMA_DONE_TEXT = {
  restore: "schema 也回到了那一版當時的內容。",
  remove: "這份現在沒有 schema。",
};

async function revertTo(view, detail, version, differing, button) {
  if (isBusy(button)) return;
  const short = version.sha.slice(0, 7);
  const ok = await confirmAction(
    "退回此版本？",
    `「${detail.name}」會回到版本 ${short} 的內容：${differing} 個參數會改變、並寫出到目標。` +
    "這會產生一筆新的變更紀錄；歷史不會被改寫，之後仍可再退。" + (SCHEMA_EFFECT_TEXT[version.schema_effect] || ""),
    "退回此版本",
  );
  if (!ok) return;
  await whileBusy(button, "退版中…", async () => {
    const diff = view.querySelector("[data-testid='history-diff']");
    try {
      const response = await apiFetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/revert`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ version: version.sha }),
      });
      const payload = await response.json();
      if (!response.ok) {
        // 409（有未進版草稿）／422／500：原樣顯示後端的原因與下一步，差異區保留讓人重看。
        diff.prepend(element("div", { class: "notice error", "data-testid": "history-revert-error" }, [
          element("strong", { text: "沒有退版。" }),
          element("pre", { text: detailText(payload.detail) }),
        ]));
        return;
      }
      // 目前版本變了：重抓單筆內容、重開歷史（列表多一筆退回舊版本），左側樹重掃狀態。
      load();
      const fresh = await apiFetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}`);
      const freshDetail = fresh.ok ? await fresh.json() : detail;
      openHistory(freshDetail, `已退回到版本 ${short}，並寫出到目標。${SCHEMA_DONE_TEXT[payload.schema_effect] || ""}`);
    } catch (error) {
      diff.prepend(element("div", { class: "notice error", "data-testid": "history-revert-error" }, [
        element("strong", { text: "沒有退版。" }),
        element("pre", { text: failureText("退回此版本", error) }),
      ]));
    }
  });
}

// ── W5 差異檢視（#30）────────────────────────────────────────────────────────
// 只在偏離時出現（§7.7、ADR-00000008）：橫幅說明目標被介面外修改、沒有對應紀錄與作者；主區域是
// 來源（repo，唯一真實來源）與目標（磁碟現況）的並排參數比對——使用者要做的是「判斷哪一邊是對的」，
// 並排比合併差異更貼這個決策。呈現與 W4 歷史差異同一套（參數為單位、同樣的 data-change 與顏色）。
// 處置的三個按鈕是 #31。
function driftBanner(detail, withEntry) {
  const banner = element("div", { class: "notice error drift-banner", "data-testid": "drift-banner" }, [
    element("strong", { text: "偏離：目標檔案內容與 repo 不一致。" }),
    element("p", {
      text: "此修改未經介面進行，因此沒有對應的變更紀錄與作者資訊。請比對兩邊，判斷哪一邊是對的。",
    }),
  ]);
  if (withEntry) {
    const open = element("button", { type: "button", "data-testid": "panel-diff", text: "檢視差異" });
    open.addEventListener("click", () => openDiffView(detail));
    banner.appendChild(element("div", { class: "actions" }, [open]));
  }
  return banner;
}

// ── 未部署的寫出修復（#306；後端 #29、設計 §5.4）───────────────────────────────
// 目標檔案不在了（被刪、被搬走）：說明是哪個路徑，給「寫出到目標」把來源內容與記下的權限寫回去。
// 設定庫不變、不留紀錄——按之前就寫在這裡。只在**未部署**時出現：偏離是目標「在、但不一樣」，
// 那要人判斷哪一邊對（差異檢視的三個處置），不是一鍵蓋掉。
function missingBanner(detail) {
  const error = element("div", { class: "notice error", "data-testid": "apply-error", hidden: "" });
  const apply = element("button", { type: "button", "data-testid": "panel-apply", text: "寫出到目標" });
  apply.addEventListener("click", () => whileBusy(apply, "寫出中…", () => applyMissing(detail, error)));
  return element("div", { class: "notice missing-banner", "data-testid": "missing-banner" }, [
    element("strong", { text: "未部署：目標檔案不存在。" }),
    element("p", {
      text: `設定庫裡有這份 config 的來源，但 ${detail.target} 這個位置沒有檔案（可能被刪除或搬走）。`
        + "按「寫出到目標」會把來源內容與記下的權限寫回這個位置；設定庫不變，所以不會多一筆變更紀錄。",
    }),
    error,
    element("div", { class: "actions editing-only" }, [apply]),
  ]);
}

// 畫面上的「未部署」是上一次比對的結果。按下時先重新比對：這段時間目標要是出現了，就不寫——
// 後端的寫出不看目標在不在，照寫的話等於不留紀錄地蓋掉現場的內容。狀態變了就說明原因並顯示現況。
function noLongerMissing(detail, fresh) {
  if (!fresh) {
    return `「${detail.name}」已經不在清單裡（可能已被解除納管），所以沒有寫出。`
      + "下一步：看左側的清單確認現況。";
  }
  if (fresh.error) {
    return `目標現在判不出狀態（${fresh.error}），所以沒有寫出。下一步：先排除這個原因，再按「檢查差異」。`;
  }
  if (fresh.state === "drift") {
    return `目標檔案已經存在（${detail.target}），而且內容與來源不同，所以沒有寫出——照寫會不留紀錄地`
      + "蓋掉現場的內容。下一步：按「檢視差異」比對兩邊，再決定以來源覆蓋或把現況納入來源。";
  }
  if (fresh.state === "in_sync") {
    return `目標檔案已經存在（${detail.target}），而且與來源一致，不需要寫出。下一步：不必處理，畫面已是現況。`;
  }
  return null;
}

async function applyMissing(detail, errorEl) {
  errorEl.hidden = true;
  try {
    const listing = await apiFetch(`${API_BASE}/api/configs`);
    if (!listing.ok) throw new Refused(await loadErrorText(listing));
    const changed = noLongerMissing(detail, (await listing.json()).find((row) => row.uid === detail.uid));
    if (changed) {
      await load();  // 樹先換成現況，重畫的區塊才認得新的狀態
      openPanel(detail.uid, element("div", {
        class: "notice error", "data-testid": "apply-error",
      }, [element("strong", { text: changed })]));
      return;
    }
    const response = await apiFetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/apply`, {
      method: "POST",
    });
    const payload = await response.json();
    if (!response.ok) {
      renderSaveError(errorEl, payload.detail);  // 後端的原因（哪個路徑、為什麼、下一步）原樣顯示
      return;
    }
    clearPromoteBanners();
    promoteDoneEl.textContent = `已把「${detail.name}」的來源寫出到 ${payload.target}，狀態回到一致。`
      + "設定庫沒有改變，所以沒有變更紀錄。";
    promoteDoneEl.hidden = false;
    await load();
    openPanel(detail.uid);
  } catch (error) {
    renderSaveError(errorEl, failureText("寫出到目標", error));
  }
}

// 兩棵值樹以參數為單位比：same／changed／added（右邊有、左邊沒有）／removed（左邊有、右邊沒有）。
// W4（那一版 vs 目前）與 W5（來源 vs 目標）共用，顏色語言因此一致。
function paramDiff(left, right) {
  const leaves = (payload) => new Map(
    paramRows({ types: payload.types || {}, values: payload.values || {}, draft_values: null })
      .filter((row) => !row.container)
      .map((row) => [row.path, displayValue(row.value, row.type)]),
  );
  const older = leaves(left);
  const current = leaves(right);
  const paths = [...current.keys(), ...[...older.keys()].filter((path) => !current.has(path))];
  return paths.map((path) => {
    const from = older.get(path);
    const to = current.get(path);
    let change = "same";
    if (from === undefined) change = "added";
    else if (to === undefined) change = "removed";
    else if (from !== to) change = "changed";
    return { path, from, to, change };
  });
}

function diffRow(row, fromTestid, toTestid, separator) {
  return element("li", { class: "diff-row", "data-testid": `diff-row-${row.path}`, "data-change": row.change }, [
    element("span", { class: "diff-name", text: row.path.replace(/\\\./g, ".") }),
    element("span", { class: "diff-from", "data-testid": fromTestid, text: row.from === undefined ? "（無）" : row.from }),
    element("span", { text: separator }),
    element("span", { class: "diff-to", "data-testid": toTestid, text: row.to === undefined ? "（無）" : row.to }),
  ]);
}

function openDiffView(detail) {
  const back = element("button", { type: "button", "data-testid": "diff-back", text: "返回欄位表" });
  back.addEventListener("click", () => openPanel(detail.uid));
  const view = element("section", { class: "panel", "data-testid": `diff-${detail.uid}` }, [
    element("div", { class: "panel-head" }, [
      element("span", { class: "name", text: `差異檢視　${detail.name}` }),
      element("span", { class: "target", text: detail.target }),
      back,
    ]),
    driftBanner(detail, false),
  ]);
  if (detail.target_error) {
    view.appendChild(element("div", { class: "notice error", "data-testid": "diff-target-error" }, [
      element("strong", { text: "目標現況無法比對。" }),
      element("pre", { text: detail.target_error }),
    ]));
  } else {
    // 左＝來源（repo，唯一真實來源）、右＝目標（磁碟現況）：來源在 paramDiff 的 left。
    const rows = paramDiff(
      { types: detail.types, values: detail.values },
      { types: infer(detail.target_values), values: detail.target_values },
    );
    const differing = rows.filter((row) => row.change !== "same").length;
    view.append(
      element("p", {
        class: "diff-summary", "data-testid": "diff-summary",
        text: `${differing} 個參數不同（左邊是 repo 的來源，右邊是目標的磁碟現況）`,
      }),
      element("div", { class: "diff-head" }, [
        element("span", { class: "diff-name", text: "參數" }),
        element("span", { class: "diff-side", "data-testid": "diff-source", text: "repo（唯一真實來源）" }),
        element("span", { class: "diff-side", "data-testid": "diff-target", text: "target（磁碟現況）" }),
      ]),
      element("ul", { class: "param-table" }, rows.map((row) => diffRow(row, "diff-source-value", "diff-target-value", "｜"))),
    );
  }
  view.appendChild(resolveActions(detail, view));
  mountView(detail.uid, view, "diff");
}

// ── W5 三種處置（#31、§5.4、A3）──────────────────────────────────────────────
// 偏離不自動處置（設計原則 N-2）：三個相反方向的出口由人選，後果在按下之前就寫在按鈕旁。
// 覆蓋與先納入不可逆（丟掉現場改動／載入的草稿要人接手）→ W6 確認；納入走完整驗證，含非法值被拒。
const RESOLVE_OPTIONS = [
  {
    action: "overwrite", label: "以來源覆蓋目標", testid: "resolve-overwrite",
    why: "現場改動是不該保留的臨時測試：把 repo 的來源寫回目標、捨棄現場修改；記一筆紀錄。",
    confirm: [
      "以來源覆蓋目標？",
      "目標檔案會被 repo 的來源覆蓋，現場的修改全部丟掉，無法復原；會記一筆變更紀錄。",
      "以來源覆蓋",
    ],
  },
  {
    action: "adopt", label: "將目標現況納入來源", testid: "resolve-adopt",
    why: "現場改動是有效的調整：走完整驗證後成為來源、記一筆採納紀錄；含非法值會被拒。",
    confirm: null,
  },
  {
    action: "adopt_draft", label: "先納入、待修正", testid: "resolve-adopt-draft",
    why: "現場改動含非法值但不該丟：載入草稿供修正，進版前須改正；來源與目標都先不動。",
    confirm: [
      "先納入、待修正？",
      "目標現況會載入為這份 config 的草稿（覆蓋既有草稿），非法值以警告標示，進版前須改正。"
        + "來源與目標都先不動；不要了可以捨棄這份草稿。",
      "先納入",
    ],
  },
];

function resolveActions(detail, view) {
  const error = element("div", { class: "notice error resolve-error", "data-testid": "resolve-error" });
  error.hidden = true;
  const options = RESOLVE_OPTIONS.map((option) => {
    const button = element("button", { type: "button", "data-testid": option.testid, text: option.label });
    button.addEventListener("click", () => resolveDrift(detail, option, view, error, button));
    return element("div", { class: "resolve-option" }, [button, element("span", { class: "why", text: option.why })]);
  });
  return element("div", {}, [error, element("div", { class: "resolve-actions editing-only" }, options)]);
}

async function resolveDrift(detail, option, view, errorEl, button) {
  if (isBusy(button)) return;
  if (option.confirm) {
    const ok = await confirmAction(...option.confirm);
    if (!ok) return;
  }
  await whileBusy(button, "處理中…", async () => {
    errorEl.hidden = true;
    for (const button of view.querySelectorAll(".resolve-actions button")) button.disabled = true;
    try {
      const response = await apiFetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/resolve`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: option.action }),
      });
      const payload = await response.json();
      if (!response.ok) {
        // 422（納入：現況含非法值，列行號／原因／建議並指去先納入待修正）／409／500：原樣顯示，差異區保留。
        renderSaveError(errorEl, payload.detail);
        return;
      }
      clearPromoteBanners();
      if (option.action === "adopt_draft") {
        setDrafts(payload.drafts.map((draft) => draft.uid));
        openPanel(detail.uid, adoptDraftNotice(payload.warnings));
        return;
      }
      load();  // 覆蓋／納入後狀態回到一致，樹重掃
      promoteDoneEl.textContent = option.action === "overwrite"
        ? `已以來源覆蓋「${detail.name}」的目標，並記一筆變更紀錄。`
        : `已將「${detail.name}」的目標現況納入來源（採納現場調整），並寫出。`;
      promoteDoneEl.hidden = false;
      openPanel(detail.uid);
    } catch (error) {
      renderSaveError(errorEl, failureText("處置偏離", error));
    } finally {
      for (const button of view.querySelectorAll(".resolve-actions button")) button.disabled = false;
    }
  });
}

function adoptDraftNotice(warnings) {
  const notice = element("div", {
    class: warnings.length ? "notice error" : "notice", "data-testid": "adopt-draft-notice",
  }, [
    element("strong", {
      text: warnings.length
        ? `目標現況已載入為草稿，含 ${warnings.length} 個問題——進版前須改正（整批進版會被擋）。`
        : "目標現況已載入為草稿，沒有發現問題；儲存或進版即可。",
    }),
  ]);
  if (warnings.length) {
    notice.appendChild(element("ul", {}, warnings.map((problem) => element("li", {
      text: problemText(problem),
    }))));
  }
  return notice;
}

// 目標現況沒有型別表（型別由來源推斷、不由前端猜）：只借來源的型別表走訪路徑，來源沒有的欄位
// 以值的樣子給個粗略型別讓它顯示得出來——這裡只是「顯示」，不是判定。
function infer(values) {
  const out = {};
  const walk = (value, path) => {
    if (path) out[path] = value === null ? "null" : Array.isArray(value) ? "list" : typeof value === "object" ? "dict" : typeof value === "boolean" ? "bool" : typeof value === "number" ? (Number.isInteger(value) ? "int" : "float") : "string";
    if (value && typeof value === "object" && !Array.isArray(value)) {
      for (const [key, child] of Object.entries(value)) walk(child, path ? `${path}.${String(key).replace(/\./g, "\\.")}` : String(key).replace(/\./g, "\\."));
    } else if (Array.isArray(value)) {
      value.forEach((child) => walk(child, `${path}[]`));
    }
  };
  walk(values || {}, "");
  return out;
}

// ── 進版與捨棄變更（#22）─────────────────────────────────────────────────────
// 進版是全域動作：全部草稿一次驗證、記錄、寫出，整批原子（§7.4.3、T18）。任一份沒過整批不進版，
// 後端指名哪一份（uid）的哪些參數（行號／原因／建議）——原樣列在橫幅上並打開那份。捨棄變更清草稿、
// 回到來源內容，不動來源也不動目標；不可逆，先經 W6 的確認對話框。
const confirmDialog = document.querySelector("[data-testid='confirm-dialog']");

// 所有要先確認的動作共用這一個對話框（#50），文案與行為一致：標題是問句、指名對象；內文說會
// 發生什麼、什麼不會變、能不能復原；確認鈕寫的是那個動作本身（`okLabel`，不是一律「確認」），
// 取消鈕永遠在、Esc 也是取消；**開啟時焦點在取消**——手滑按到 Enter 不會把東西刪掉。
// `items` 是要一併列給人看的清單（例如移除白名單時受影響的項目），沒有就不顯示。
function confirmAction(title, body, okLabel = "確認", items = []) {
  confirmDialog.querySelector("[data-testid='confirm-title']").textContent = title;
  confirmDialog.querySelector("[data-testid='confirm-body']").textContent = body;
  const list = confirmDialog.querySelector("[data-testid='confirm-items']");
  list.replaceChildren(...items.map((text) => element("li", { text })));
  list.hidden = items.length === 0;
  confirmDialog.querySelector("[data-testid='confirm-ok']").textContent = okLabel;
  return new Promise((resolve) => {
    const finish = (answer) => {
      okButton.removeEventListener("click", onOk);
      cancelButton.removeEventListener("click", onCancel);
      confirmDialog.removeEventListener("cancel", onCancel);
      if (confirmDialog.open) confirmDialog.close();
      resolve(answer);
    };
    const onOk = () => finish(true);
    const onCancel = () => finish(false);
    const okButton = confirmDialog.querySelector("[data-testid='confirm-ok']");
    const cancelButton = confirmDialog.querySelector("[data-testid='confirm-cancel']");
    okButton.addEventListener("click", onOk);
    cancelButton.addEventListener("click", onCancel);
    // Esc 走 `cancel` 事件，不聽 `close`：`close` 連我們自己關對話框時也會發、而且是晚一拍才發——
    // 上一個確認剛關、下一個確認緊接著開的話，那個晚到的 `close` 會把新的這一個當成被取消。
    confirmDialog.addEventListener("cancel", onCancel);
    confirmDialog.showModal();
    cancelButton.focus();
  });
}

// 進行中的指示（#50）：會寫入或要等一下的動作，按下後那顆按鈕標成進行中（`aria-busy`、文字換成
// 「…中」、不能再按），做完還原——看得出有在跑，也不會因為多按一下而送出兩次。
async function whileBusy(button, label, work) {
  if (!button) return work();
  if (isBusy(button)) return undefined;  // 已經在跑：這一下不算（例如表單被 Enter 再送一次）
  const idle = button.textContent;
  button.setAttribute("aria-busy", "true");
  button.inert = true;  // 滑鼠與鍵盤都按不到；不動 disabled——那是各個動作自己在管的
  button.textContent = label;
  try {
    return await work();
  } finally {
    button.removeAttribute("aria-busy");
    button.inert = false;
    // 動作自己改過按鈕文字（例如進版後變成「進版 (0)」）就不動它。
    if (button.textContent === label) button.textContent = idle;
  }
}

// 要先確認的動作在最前面問這個：已經在跑就不再開一次確認對話框。
function isBusy(button) {
  return Boolean(button) && button.getAttribute("aria-busy") === "true";
}

function clearPromoteBanners() {
  promoteErrorEl.hidden = true;
  promoteDoneEl.hidden = true;
}

async function promoteAll() {
  clearPromoteBanners();
  promoteButton.disabled = true;
  try {
    const response = await apiFetch(`${API_BASE}/api/promote`, { method: "POST" });
    const payload = await response.json();
    if (!response.ok) {
      renderSaveError(promoteErrorEl, payload.detail);  // 同一種結構化形：message＋逐條行號／原因／建議
      const detail = payload.detail;
      if (detail && detail.uid) openPanel(detail.uid);  // 把人帶到沒過的那一份
      setDrafts(draftUids);  // 草稿保留，按鈕恢復
      return;
    }
    setDrafts([]);  // 進版後草稿清空（T18）
    promoteDoneEl.textContent = `已進版 ${payload.promoted.length} 份，各記一筆變更紀錄並寫出至目標。`;
    promoteDoneEl.hidden = false;
    load();  // 目標變了，重掃狀態
    for (const uid of openUids()) openPanel(uid);  // 打開的那幾份現在來源＝剛進版的內容
  } catch (error) {
    renderSaveError(promoteErrorEl, failureText("進版", error));
    setDrafts(draftUids);
  }
}

async function discardDrafts(uid, name, button = discardAllButton) {
  if (isBusy(button)) return;
  const scope = uid ? `「${name}」的草稿` : `全部 ${draftUids.size} 份草稿`;
  const ok = await confirmAction(
    `捨棄${uid ? "這份" : "全部"}變更？`,
    `${scope}會被清除、回到來源內容。來源與目標檔案都不會改變；這個動作無法復原。`,
    "捨棄變更",
  );
  if (!ok) return;
  await whileBusy(button, "捨棄中…", async () => {
    clearPromoteBanners();
    try {
      const path = uid ? `/api/drafts/${encodeURIComponent(uid)}` : "/api/drafts";
      const response = await apiFetch(`${API_BASE}${path}`, { method: "DELETE" });
      const payload = await response.json();
      if (!response.ok) {
        renderSaveError(promoteErrorEl, payload.detail);
        return;
      }
      setDrafts(payload.drafts.map((draft) => draft.uid));
      promoteDoneEl.textContent = uid
        ? `已捨棄「${name}」的草稿，畫面回到來源內容。來源與目標檔案都沒有改變。`
        : "已捨棄全部草稿，畫面回到來源內容。來源與目標檔案都沒有改變。";
      promoteDoneEl.hidden = false;
      for (const open of openUids()) {
        if (!uid || uid === open) openPanel(open);  // 畫面回到來源內容
      }
    } catch (error) {
      renderSaveError(promoteErrorEl, failureText("捨棄變更", error));
    }
  });
}

// 解除納管（#287，後端 #28）：不可逆，先說實際會發生的事再做（設計原則 2）。成功後這份從樹與
// 工作區消失；目標檔案不動。後端拒絕（有草稿、寫入失敗）時原因原樣顯示，項目留在原處。
async function unmanageConfig(detail, button) {
  if (isBusy(button)) return;
  const ok = await confirmAction(
    `解除「${detail.name}」的納管？`,
    `系統不再追蹤這份檔案，它會從清單消失。目標檔案 ${detail.target} 保留、內容不動；`
      + "過去的變更歷史仍留在設定庫裡。之後要再管理它，得重新納管。",
    "解除納管",
  );
  if (!ok) return;
  await whileBusy(button, "解除中…", async () => {
    clearPromoteBanners();
    try {
      const response = await apiFetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}`, {
        method: "DELETE",
      });
      const payload = await response.json();
      if (!response.ok) {
        renderSaveError(promoteErrorEl, payload.detail);
        return;
      }
      closeSlot(detail.uid);
      promoteDoneEl.textContent = `已解除「${detail.name}」的納管，並記一筆變更紀錄。目標檔案保留在 ${detail.target}。`;
      promoteDoneEl.hidden = false;
      load();
    } catch (error) {
      renderSaveError(promoteErrorEl, failureText("解除納管", error));
    }
  });
}

promoteButton.addEventListener("click", () => whileBusy(promoteButton, "進版中…", promoteAll));
discardAllButton.addEventListener("click", () => discardDrafts(null, null));

// ── 編輯階段（#33、§7.2.2、ADR-00000014）──────────────────────────────────────
// 一次只有一個編輯階段。進清單時向 backend 取得；成功就拿到識別碼（只存在這個分頁的 sessionStorage，
// 重新整理不丟）並定期續期；關閉頁面時主動釋放；異常中斷靠續期逾時自動釋放。已被占用→唯讀：
// 橫幅指名持有者與開始時間，會寫入的控制項不出現（不是停用）。不提供強制接管。
const readonlyBanner = document.querySelector("[data-testid='readonly-banner']");
const SESSION_TOKEN_KEY = "cm.session.token";
const RENEW_EVERY_MS = 30_000;
let sessionToken = null;
let renewTimer = null;

function storedToken() {
  try { return sessionStorage.getItem(SESSION_TOKEN_KEY); } catch (_error) { return null; }
}

function rememberToken(token) {
  sessionToken = token;
  try {
    if (token) sessionStorage.setItem(SESSION_TOKEN_KEY, token);
    else sessionStorage.removeItem(SESSION_TOKEN_KEY);
  } catch (_error) {
    // 私密視窗等存不進去：識別碼還在記憶體裡，只是重新整理後要重新取得。
  }
}

function setReadonly(holder, startedAt, reason) {
  document.body.dataset.readonly = "true";
  currentRole.textContent = "唯讀";
  const who = holder
    ? `目前由 ${holder.name}（${holder.email}）自 ${formatTime(startedAt)} 起編輯中。`
    : "";
  readonlyBanner.replaceChildren(
    element("strong", { text: "唯讀模式。" }),
    element("p", {
      text: reason || `${who}一次只允許一個編輯階段；等對方離開或逾時釋放後重新整理即可取得。不提供強制接管。`,
    }),
  );
  readonlyBanner.hidden = false;
  if (renewTimer) { clearInterval(renewTimer); renewTimer = null; }
}

function setEditing() {
  document.body.dataset.readonly = "false";
  readonlyBanner.hidden = true;
  // 標頭的身分要跟著回來：轉唯讀時它被改成「唯讀」，取回編輯階段後不改回去的話，畫面說唯讀、
  // 實際上卻可以編輯（人工驗證 U38）。
  if (currentIdentity) currentRole.textContent = identityLabel(currentIdentity);
}

function identityLabel(identity) {
  return `${identity.name}・${ROLE_TEXT[identity.role] || identity.role}`;
}

async function acquireSession() {
  // 重新整理：舊頁面卸載時已送出釋放，存著的識別碼可能還有效（釋放晚到）也可能已失效（釋放先到）。
  // 先試著接續（後端會換一個新的識別碼，晚到的舊釋放就動不了它）；失效了就往下重新取得。
  const token = storedToken();
  if (token && await renewSession(token, true)) return;
  try {
    const response = await apiFetch(`${API_BASE}/api/session/lock`, { method: "POST" });
    const payload = await response.json();
    if (response.status === 409 && payload.detail && payload.detail.kind === "held") {
      setReadonly(payload.detail.holder, payload.detail.started_at, null);
      return;
    }
    if (!response.ok) {
      setReadonly(null, null, `取不到編輯階段：${detailText(payload.detail)}`);
      return;
    }
    rememberToken(payload.token);
    setEditing();
    if (payload.cleared_drafts) {
      // 上一個階段逾時釋放時的草稿被清掉——說出來，不靜默丟棄（T13）。
      promoteDoneEl.textContent = `上一個編輯階段逾時釋放，清除了 ${payload.cleared_drafts} 份未進版的草稿。`;
      promoteDoneEl.hidden = false;
    }
    if (!renewTimer) renewTimer = setInterval(() => renewSession(sessionToken), RENEW_EVERY_MS);
  } catch (error) {
    setReadonly(null, null, `取不到編輯階段：${failureText("取得編輯階段", error)}`);
  }
}

// `resuming`＝頁面剛載入、拿存著的識別碼回來接續。此時識別碼失效不算「階段被回收」——多半只是
// 自己重新整理時釋放掉的——所以不轉唯讀，交給 acquireSession 重新取得。
async function renewSession(token, resuming = false) {
  if (!token) return false;
  try {
    const response = await apiFetch(`${API_BASE}/api/session/lock/renew`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token, resume: resuming }),
    });
    if (response.ok) {
      const payload = await response.json();
      rememberToken(payload.token || token);
      setEditing();
      if (!renewTimer) renewTimer = setInterval(() => renewSession(sessionToken), RENEW_EVERY_MS);
      return true;
    }
    if (response.status === 410) {
      rememberToken(null);
      // 使用中的階段失效（逾時被回收或已釋放）：明確轉唯讀並說明，不替使用者悄悄重新取得。
      if (!resuming) {
        setReadonly(null, null, "編輯階段已失效（逾時被回收或已釋放），這個分頁現在是唯讀。重新整理頁面以重新取得。");
        // 階段失效可能是因為這個瀏覽器閒置逾時被退出了：馬上問後端，是的話回身分輸入頁（#48）。
        if (idleTimer) idleTick(false);
      }
    }
    return false;
  } catch (_error) {
    return false;  // 暫時連不上：下一次續期再試，不因此轉唯讀
  }
}

// 關頁（或重新整理）時主動釋放。用 sendBeacon＋text/plain：瀏覽器保證在頁面卸載後仍送出，且不必
// 跨來源預檢（關頁當下預檢多半來不及）。萬一這發也沒送到，後端的續期逾時會把階段收回（§7.2.2）。
window.addEventListener("pagehide", () => {
  if (!sessionToken) return;
  const body = new Blob([JSON.stringify({ token: sessionToken })], { type: "text/plain" });
  const sent = navigator.sendBeacon && navigator.sendBeacon(`${API_BASE}/api/session/lock/release`, body);
  if (!sent) {
    apiFetch(`${API_BASE}/api/session/lock`, {
      method: "DELETE",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token: sessionToken }),
      keepalive: true,
    }).catch(() => {});
  }
});

// ── W1 身分輸入 ──────────────────────────────────────────────────────────────
// 不是登入：沒有密碼、不驗證、角色是自我宣告（ADR-00000020）。唯一的用途是成為
// 變更紀錄的作者。文案一律用「身分輸入」，因為說「登入」會讓人以為有存取控制
// （CONTEXT.md「避免使用的說法」）。
const ROLE_TEXT = { user: "一般使用者", developer: "開發者" };

const identityForm = document.querySelector("[data-testid='identity-form']");
const identityError = document.querySelector("[data-testid='identity-error']");
const roleToggle = document.querySelector("[data-testid='role-toggle']");
const currentRole = document.querySelector("[data-testid='current-role']");
const header = document.querySelector("header");
const listView = document.querySelector("main");

function selectedRole() {
  const pressed = roleToggle.querySelector("[aria-pressed='true']");
  return pressed ? pressed.dataset.role : "user";
}

roleToggle.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-role]");
  if (!button) return;
  for (const option of roleToggle.querySelectorAll("button[data-role]")) {
    option.setAttribute("aria-pressed", String(option === button));
  }
});

// 六個整頁 view 靠 hidden 布林互斥切換。集中在這裡把全部設 hidden，各 show* 先呼叫它再打開
// 自己那個——否則每個 show* 都得逐一記得隱藏其餘五個，漏掉一個（whitelistView 先前就被 showList／
// showBrowse／showConfirm 全數漏掉，#252）就會兩個 view 疊著顯示，且殘留 view 裡的控制（如白名單的
// 「確認移除」）還活著、可從不該出現它的畫面觸發不可逆刪除。browseView／confirmView／whitelistView
// 在此函式之後才宣告，但本函式只在事件與啟動時被呼叫（那時整段 script 已初始化完畢），故安全。
function hideAllPageViews() {
  identityForm.hidden = true;
  header.hidden = true;
  listView.hidden = true;
  browseView.hidden = true;
  confirmView.hidden = true;
  whitelistView.hidden = true;
}

// ── 閒置逾時（#48）──────────────────────────────────────────────────────────────
// 部署模式：這個瀏覽器的人 10 分鐘沒操作就自動退出並釋放編輯階段；逾時前 1 分鐘提示，可延長。
// **判定在後端**（它記最後一次操作的時間）：這裡只做三件事——把「有人在操作」回報上去、照後端說的
// 剩餘時間顯示提示、後端說已逾時就回身分輸入頁。開發模式後端回「不逾時」，這裡就不啟動。
const IDLE_TICK_MS = window.CM_IDLE_TICK_MS || 15_000;
const idleWarning = document.querySelector("[data-testid='idle-warning']");
const idleWarningText = document.querySelector("[data-testid='idle-warning-text']");
const timeoutNotice = document.querySelector("[data-testid='session-timeout']");
let idleTimer = null;
let idleCountdown = null;
let interacted = false;
let lastActivityAt = 0;
// 後端最近一次說的：{ seconds, at }——還剩幾秒、是在本機的哪個時刻說的（倒數顯示用）。
let idleLeft = null;

async function idleRequest(active) {
  try {
    const response = await apiFetch(
      `${API_BASE}/api/session/${active ? "activity" : "idle"}`, { method: active ? "POST" : "GET" },
    );
    return response.ok ? await response.json() : null;
  } catch (_error) {
    return null;  // 問不到：下一輪再問。前端不自己判定逾時。
  }
}

async function startIdleWatch() {
  stopIdleWatch();
  const view = await idleRequest(false);
  if (!view || view.timeout_seconds === null) return;  // 開發模式（或問不到）：不逾時、不監看
  idleTimer = setInterval(idleTick, IDLE_TICK_MS);
  applyIdle(view);
}

function stopIdleWatch() {
  if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
  if (idleCountdown) { clearInterval(idleCountdown); idleCountdown = null; }
  idleWarning.hidden = true;
  idleLeft = null;
  interacted = false;
}

async function idleTick(active = interacted) {
  interacted = false;
  if (active) lastActivityAt = Date.now();
  applyIdle(await idleRequest(active));
}

function applyIdle(view) {
  if (!view || !idleTimer) return;
  if (view.timed_out || view.remaining_seconds === null) {
    leaveForIdle(view.timeout_seconds);
    return;
  }
  idleLeft = { seconds: view.remaining_seconds, at: Date.now() };
  const warning = view.remaining_seconds <= view.warn_seconds;
  idleWarning.hidden = !warning;
  if (warning && !idleCountdown) idleCountdown = setInterval(showIdleCountdown, 1000);
  if (!warning && idleCountdown) { clearInterval(idleCountdown); idleCountdown = null; }
  showIdleCountdown();
}

// 提示上的秒數是顯示用的倒數（從後端最近一次的答案往下數）；數到 0 就立刻再問後端——退出與否
// 由它說了算。
function showIdleCountdown() {
  if (!idleLeft || idleWarning.hidden) return;
  const seconds = Math.max(0, Math.ceil(idleLeft.seconds - (Date.now() - idleLeft.at) / 1000));
  const drafts = draftUids.size
    ? `、${draftUids.size} 份未進版的草稿會被清除`
    : "";
  idleWarningText.textContent =
    `已有一段時間沒有操作，約 ${seconds} 秒後將自動退出並釋放編輯階段${drafts}。要繼續請按「繼續使用」。`;
  if (seconds === 0) idleTick(false);
}

// 逾時：後端已清掉這個瀏覽器的身分、釋放了它的編輯階段。回身分輸入頁並說明發生了什麼。
function leaveForIdle(timeoutSeconds) {
  stopIdleWatch();
  if (renewTimer) { clearInterval(renewTimer); renewTimer = null; }
  rememberToken(null);
  currentIdentity = null;
  // 表單清空、角色回到預設：下一個坐下來的可能是別人，不留上一個人的姓名、Email 與角色給他按。
  identityForm.reset();
  for (const button of roleToggle.querySelectorAll("button[data-role]")) {
    button.setAttribute("aria-pressed", String(button.dataset.role === "user"));
  }
  showIdentityForm(timeoutSeconds || true);
}

function noteInteraction() {
  if (!idleTimer) return;
  interacted = true;
  // 安靜了一陣子之後的第一個動作立刻回報：等下一輪才報的話，人剛回來卻在那幾秒內被判逾時。
  if (Date.now() - lastActivityAt >= IDLE_TICK_MS) idleTick(true);
}

for (const kind of ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"]) {
  window.addEventListener(kind, noteInteraction, { passive: true });
}
document.querySelector("[data-testid='idle-extend']").addEventListener("click", () => idleTick(true));

// 記住此裝置（#288）：姓名與 Email 存在這個瀏覽器自己的 localStorage，後端不存。角色刻意不存——
// 每次開啟都要重新選，開發者身分不該因為上次勾過就自動帶著。
const REMEMBERED_KEY = "cm.identity.remembered";
const rememberLabel = document.querySelector("[data-testid='remember-device']");

function rememberedIdentity() {
  try {
    const raw = localStorage.getItem(REMEMBERED_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    return parsed && typeof parsed.name === "string" && typeof parsed.email === "string" ? parsed : null;
  } catch (_error) {
    return null;
  }
}

function rememberIdentity(identity) {
  try {
    if (identity) localStorage.setItem(REMEMBERED_KEY, JSON.stringify({ name: identity.name, email: identity.email }));
    else localStorage.removeItem(REMEMBERED_KEY);
  } catch (_error) {
    // 存不進去（私密視窗等）：只是下次要再打一次姓名與 Email。
  }
}

// `timedOut`：因閒置被退出後回到這一頁（值是逾時的秒數，不知道就給 true）——說明發生了什麼，
// 不留一張沒頭沒尾的表單。
function showIdentityForm(timedOut = false) {
  hideAllPageViews();
  timeoutNotice.hidden = !timedOut;
  if (timedOut) {
    const minutes = typeof timedOut === "number" ? `超過 ${Math.round(timedOut / 60) || 1} 分鐘` : "過久";
    timeoutNotice.textContent =
      `閒置${minutes}沒有操作，已自動退出；編輯階段已釋放，未進版的草稿（若有）已清除。`
      + "下一步：重新輸入身分以繼續。";
  }
  // 只在開發模式提供；模式未知時也不提供（不假設是開發模式，#47）。
  rememberLabel.hidden = document.body.dataset.mode !== "development";
  const remembered = rememberLabel.hidden ? null : rememberedIdentity();
  if (remembered) {
    identityForm.elements.name.value = remembered.name;
    identityForm.elements.email.value = remembered.email;
    identityForm.elements.remember.checked = true;
  }
  identityForm.hidden = false;
}

// 目前身分。browse 的拒絕 UX 依角色分流（開發者才有加入白名單入口），返回也靠它。
let currentIdentity = null;

function showList(identity) {
  currentIdentity = identity;
  hideAllPageViews();
  header.hidden = false;
  listView.hidden = false;
  currentRole.textContent = identityLabel(identity);
  // 白名單維護面板開發者專屬：按鈕對一般使用者不出現於 DOM（UI-ELEMENTS.md 角色表、
  // ADR-00000020），不是停用。一般使用者的檢視走 browse 的根清單與允許範圍。
  whitelistButton.hidden = identity.role !== "developer";
  load();
  acquireSession();
  startIdleWatch();
}

// 別人正持有編輯階段（#33）：沒有自己的身分也能看清單，但一切會寫入的控制項不出現。
function showReadonlyList(detail) {
  currentIdentity = null;
  hideAllPageViews();
  header.hidden = false;
  listView.hidden = false;
  currentRole.textContent = "唯讀";
  whitelistButton.hidden = true;
  setReadonly(detail.holder, detail.started_at, null);
  load();
}

identityForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  identityError.hidden = true;

  const body = {
    name: identityForm.elements.name.value,
    email: identityForm.elements.email.value,
    role: selectedRole(),
  };

  await whileBusy(identityForm.querySelector("button.enter"), "進入中…", async () => {
    try {
      const response = await apiFetch(`${API_BASE}/api/session`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      const payload = await response.json();
      if (response.status === 409 && payload.detail && payload.detail.kind === "held") {
        // 別人正在編輯：不換身分（否則對方的紀錄會掛到你頭上），改以唯讀進清單（§7.2.2）。
        showReadonlyList(payload.detail);
        return;
      }
      if (!response.ok) {
        // 端點的訊息已經寫成可行動的樣子（欄位＋原因＋下一步），原樣顯示，
        // 不在這裡改寫成一句籠統的「輸入無效」（不變式 2）。
        identityError.textContent = detailText(payload.detail) || `${response.status} ${response.statusText}`;
        identityError.hidden = false;
        return;
      }
      rememberIdentity(!rememberLabel.hidden && identityForm.elements.remember.checked ? payload : null);
      showList(payload);
    } catch (error) {
      identityError.textContent = failureText("送出身分", error);
      identityError.hidden = false;
    }
  });
});

// ── W7 檔案瀏覽（#13）─────────────────────────────────────────────────────────
// 受白名單限制的瀏覽，供納管時選定路徑。獨立整頁 view，從工具列「納管」開啟。
// 白名單根為起點（GET /api/allowed-roots）；下鑽用後端回應的每個 entry.path，不在前端
// 拼路徑；麵包屑與目前位置用回應的 path（realpath）。拒絕依 kind＋角色分流（只有
// outside_roots 給開發者「加入白名單」入口，一般使用者看唯讀允許範圍）。
const browseView = document.querySelector("[data-testid='browse']");
const browseRootsEl = document.querySelector("[data-testid='browse-roots']");
const browseListEl = document.querySelector("[data-testid='browse-list']");
const breadcrumbEl = document.querySelector("[data-testid='breadcrumb']");
const browsePathInput = document.querySelector("[data-testid='browse-path-input']");
const browseSelectionEl = document.querySelector("[data-testid='browse-selection']");
const browseRejectedEl = document.querySelector("[data-testid='browse-rejected']");
const browseHintEl = document.querySelector("[data-testid='browse-hint']");

let whitelistRoots = [];
// 每次導覽遞增；回應回來時若世代已變（使用者又點了別的目錄／麵包屑、或用「前往」貼了新路徑），
// 丟棄這個過時回應——否則晚到的舊目錄回應會覆蓋新目錄，或讓被拒面板與成功清單並存（#252）。
let browseGeneration = 0;

function showBrowse() {
  // hideAllPageViews 一併藏起確認 view——否則兩個整頁 view 疊著，殘留的「確認寫入」還能送舊
  // 路徑（#14 審查）。並清掉可能殘留的選檔狀態（loadBrowseRoots 會重載根、清列表與麵包屑）。
  hideAllPageViews();
  selectedSourcePath = null;
  onboardStartEl.hidden = true;
  browseView.hidden = false;
  loadBrowseRoots();
}

async function loadBrowseRoots() {
  breadcrumbEl.replaceChildren();
  browseListEl.replaceChildren();
  browseSelectionEl.hidden = true;
  browseRejectedEl.hidden = true;
  try {
    const response = await apiFetch(`${API_BASE}/api/allowed-roots`);
    if (!response.ok) throw new Refused(await loadErrorText(response));
    whitelistRoots = (await response.json()).prefixes;
    browseRootsEl.replaceChildren(...whitelistRoots.map((prefix) =>
      element("li", { "data-testid": `browse-root-${prefix}`, "data-path": prefix }, [
        element("span", { class: "browse-name", text: prefix }),
      ])
    ));
    browseHintEl.textContent = whitelistRoots.length
      ? "挑一個允許瀏覽的根開始，或在上方貼一個絕對路徑。"
      : "白名單目前是空的，所以沒有可以瀏覽的目錄。下一步：" + (
        currentIdentity && currentIdentity.role === "developer"
          ? "回主畫面按「白名單」，加入要管理的目錄。"
          : "請開發者把要管理的目錄加進白名單。");
  } catch (error) {
    browseHintEl.textContent = failureText("讀取白名單", error);
  }
}

async function browseTo(path) {
  const generation = ++browseGeneration;
  browseRejectedEl.hidden = true;
  // 換目錄就清掉「已選」——選取屬於某個目錄，離開它之後那個殘留會與目前位置不一致（#13）。
  browseSelectionEl.hidden = true;
  onboardStartEl.hidden = true;
  selectedSourcePath = null;
  try {
    const response = await apiFetch(`${API_BASE}/api/browse?path=${encodeURIComponent(path)}`);
    const payload = await response.json();
    if (generation !== browseGeneration) return;  // 有更新的導覽開始了，這個回應過時、丟棄
    if (!response.ok) {
      renderBrowseRejection(payload.detail, path);
      return;
    }
    // 成功抵達新目錄：再清一次選取狀態並確保被拒面板收起——若在載入途中於舊清單選了檔、或先前
    // 有一則被拒回應，這裡讓成功清單與那些殘留互斥，不會出現「已選：舊目錄的檔」或拒絕面板與清單
    // 並存（#252）。起點根清單也讓位給內容。
    selectedSourcePath = null;
    browseSelectionEl.hidden = true;
    onboardStartEl.hidden = true;
    browseRejectedEl.hidden = true;
    browseRootsEl.replaceChildren();
    browseHintEl.textContent = "";
    renderBreadcrumb(payload.path);
    renderBrowseEntries(payload.entries);
  } catch (error) {
    if (generation !== browseGeneration) return;
    browseHintEl.textContent = failureText("瀏覽目錄", error);
  }
}

function renderBrowseEntries(entries) {
  if (!entries.length) {
    browseListEl.replaceChildren(element("li", {
      class: "whitelist-empty", "data-testid": "browse-empty",
      text: "這個目錄是空的，沒有可以納管的檔案。下一步：回上一層，或換一個目錄。",
    }));
    return;
  }
  browseListEl.replaceChildren(...entries.map((entry) =>
    element("li", {
      "data-testid": `browse-entry-${entry.name}`,
      "data-kind": entry.kind,
      "data-name": entry.name,
      "data-path": entry.path,
    }, [
      element("span", { class: "browse-name", text: entry.name }),
      element("span", { class: "kind", text: entry.kind === "dir" ? "目錄" : "檔案" }),
    ])
  ));
}

function renderBreadcrumb(path) {
  // 夾在白名單根為界：找出含這條路徑的根，只從根往下顯示（上溯不越過根）。
  const root = whitelistRoots.find((r) => path === r || path.startsWith(`${r}/`));
  const nodes = [];
  const pushSegment = (label, target) => {
    if (nodes.length) nodes.push(element("span", { class: "sep", text: "›" }));
    const seg = element("button", { type: "button", "data-path": target, text: label });
    seg.addEventListener("click", () => browseTo(target));
    nodes.push(seg);
  };
  if (root) {
    pushSegment(root, root);
    let acc = root;
    for (const part of path.slice(root.length).split("/").filter(Boolean)) {
      acc += `/${part}`;
      pushSegment(part, acc);
    }
  } else {
    // 路徑不在任何已知根底下——不該發生（root_prefixes 與 payload.path 都已 realpath 正規化，
    // 成功瀏覽的路徑必在某根之下）。防禦性地只顯示路徑、**不做可點的祖先**，免得在根不相符時
    // 讓人點到白名單根之上（#13 資安審查）。
    nodes.push(element("span", { class: "sep", text: path }));
  }
  breadcrumbEl.replaceChildren(...nodes);
}

function selectBrowseFile(path) {
  selectedSourcePath = path;
  browseSelectionEl.textContent = `已選：${path}`;
  browseSelectionEl.hidden = false;
  onboardStartEl.hidden = false;  // 選了檔才出現「檢視並納管」（進 W8 確認）
}

function renderBrowseRejection(detail, attempted) {
  // detail 是 {kind, message}（#13）。原樣顯示 message（含下一步，不改寫）；依 kind＋角色
  // 決定：只有 outside_roots 給加入白名單入口，開發者可加、一般使用者看唯讀允許範圍。
  const kind = detail && detail.kind;
  const message = (detail && detail.message) || String(detail);
  browseListEl.replaceChildren();
  const children = [
    element("strong", { text: "無法瀏覽這個路徑。" }),
    element("p", { class: "msg", text: message }),
  ];
  if (kind === "outside_roots") {
    if (currentIdentity && currentIdentity.role === "developer") {
      const prefixInput = element("input", {
        type: "text",
        "data-testid": "whitelist-prefix-input",
      });
      // 預填後端建議的目錄前綴（被拒目標的 realpath，檔案則取父目錄），退回 resolved／原字串；
      // 白名單根必須是目錄，用原字串會在目標是檔案或有 symlink 時加入失敗（#13）。可編輯。
      prefixInput.value = detail.suggested || detail.resolved || attempted;
      const addButton = element("button", { type: "button", text: "加入白名單" });
      addButton.addEventListener("click", () => addToWhitelist(prefixInput.value, addButton));
      children.push(element("div", { class: "add-row" }, [prefixInput, addButton]));
    } else {
      children.push(element("p", {
        text: "請開發者代為加入白名單。目前允許瀏覽的範圍：",
      }));
      children.push(element("ul", {
        class: "allowed-range", "data-testid": "allowed-range",
      }, whitelistRoots.map((prefix) => element("li", { text: prefix }))));
    }
  }
  browseRejectedEl.replaceChildren(...children);
  browseRejectedEl.setAttribute("data-kind", kind || "browse_error");
  browseRejectedEl.hidden = false;
}

// 加入白名單前的預覽與確認（§7.9：顯示「此路徑下有幾個可納管檔」供確認再送出）。兩個入口共用
// ——白名單維護頁，與瀏覽被拒時的「加入白名單」。後者原本一按就生效（人工驗證 U13）。
// 明確寫出即將開放的路徑：加入的是整個目錄（含子目錄），不只是剛才想看的那個檔案。
async function confirmAddRoot(prefix, showError) {
  // 顯示確認框前先比對目前的白名單：已經在裡面的直接說、不問「要開放嗎」——問了再答已存在，
  // 等於白按一次（複驗回饋）。只比對得出字面或後端解析過的路徑；符號連結等後端送出時仍會擋。
  const wanted = prefix.replace(/\/+$/, "") || prefix;
  try {
    const listed = await apiFetch(`${API_BASE}/api/allowed-roots`);
    if (listed.ok) {
      const roots = (await listed.json()).roots || [];
      const same = roots.find((root) => [root.prefix, root.resolved].includes(wanted));
      if (same) {
        showError(`「${same.prefix}」已經在白名單裡，這次沒有加入；既有的項目不用更動。`);
        return false;
      }
    }
  } catch (_error) {
    // 查不到目前的白名單就略過這一步：後端送出時仍會擋重複。
  }
  let payload;
  try {
    const response = await apiFetch(`${API_BASE}/api/candidate-count?prefix=${encodeURIComponent(prefix)}`);
    payload = await response.json();
    if (!response.ok) {
      showError(detailText(payload.detail));
      return false;
    }
  } catch (error) {
    showError(failureText("計算可納管檔案數", error));
    return false;
  }
  const shown = payload.capped ? `${payload.count} 個以上` : `${payload.count} 個`;
  return confirmAction(
    "加入白名單？",
    `將開放「${prefix}」這個目錄與它底下的所有子目錄，供瀏覽與納管；目前底下有 ${shown}可納管檔。`
      + "這會留下一筆紀錄（誰在何時加入），之後可以在白名單維護移除。",
    "加入白名單",
  );
}

async function addToWhitelist(prefix, button) {
  if (isBusy(button)) return;
  const showAddError = (text) => {
    const slot = browseRejectedEl.querySelector(".msg");
    if (slot) slot.textContent = text;
  };
  if (!await confirmAddRoot(prefix, showAddError)) return;
  await whileBusy(button, "加入中…", async () => {
    try {
      const response = await apiFetch(`${API_BASE}/api/allowed-roots`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ prefix }),
      });
      const payload = await response.json();
      if (!response.ok) {
        // 端點的訊息已可行動（含下一步），原樣顯示，不改寫（不變式 2）。
        const text = typeof payload.detail === "string"
          ? payload.detail
          : (payload.detail && payload.detail.message) || `${response.status}`;
        showAddError(text);
        return;
      }
      whitelistRoots = payload.prefixes;
      browseRejectedEl.hidden = true;
      browseTo(prefix);  // 重跑被拒的瀏覽——該路徑現在在白名單內了
    } catch (error) {
      showAddError(failureText("加入白名單", error));
    }
  });
}

browseRootsEl.addEventListener("click", (event) => {
  const li = event.target.closest("li[data-path]");
  if (li) browseTo(li.dataset.path);
});

browseListEl.addEventListener("click", (event) => {
  const li = event.target.closest("li[data-testid^='browse-entry-']");
  if (!li) return;
  if (li.dataset.kind === "dir") browseTo(li.dataset.path);
  else selectBrowseFile(li.dataset.path);
});

document.querySelector("[data-testid='open-browse']").addEventListener("click", showBrowse);
browseView.querySelector(".browse-back").addEventListener("click", () => showList(currentIdentity));

// ── W9 白名單維護（#15）──────────────────────────────────────────────────────
// 開發者專屬面板：檢視誰/何時、新增含候選數預覽（GET /api/candidate-count，#206）、
// 移除含受影響確認（DELETE 未帶 confirmed 先回受影響清單＋409）。按鈕由 showList 依角色
// 顯示/隱藏。逃逸（../、symlink）由後端擋成 422，這裡原樣呈現。
const whitelistView = document.querySelector("[data-testid='whitelist']");
const whitelistButton = document.querySelector("[data-testid='open-whitelist']");
const whitelistRootsEl = document.querySelector("[data-testid='whitelist-roots']");
const whitelistAddInput = document.querySelector("[data-testid='whitelist-add-input']");
const whitelistPreviewEl = document.querySelector("[data-testid='whitelist-preview']");
const whitelistErrorEl = document.querySelector("[data-testid='whitelist-error']");
// 每次預覽遞增；晚到的舊預覽若世代已變就丟棄——否則「此路徑下有 N 個可納管檔」會顯示上一次
// 輸入的數字，與目前輸入框不符；加入成功時也遞增它，作廢加入前送出、仍在途的預覽（#252）。
let previewGeneration = 0;

// 端點的 detail 有兩形：純字串（add／remove 的值錯誤）或物件（candidate-count 與 DELETE
// 確認的 {kind, message, …}）。兩者都取得出可行動訊息，不自造籠統字句（不變式 2）。
function detailText(detail) {
  if (typeof detail === "string") return detail;
  if (detail && detail.message) return detail.message;
  return JSON.stringify(detail);
}

function showWhitelist() {
  hideAllPageViews();
  whitelistView.hidden = false;
  whitelistAddInput.value = "";
  whitelistPreviewEl.hidden = true;
  whitelistErrorEl.hidden = true;
  loadWhitelist();
}

async function loadWhitelist() {
  try {
    const response = await apiFetch(`${API_BASE}/api/allowed-roots`);
    if (!response.ok) throw new Refused(await loadErrorText(response));
    const roots = (await response.json()).roots;
    if (!roots.length) {
      whitelistRootsEl.replaceChildren(
        element("li", {
          class: "whitelist-empty", "data-testid": "whitelist-empty",
          text: "白名單目前是空的，所以沒有任何目錄可以瀏覽或納管。下一步：在上方輸入一個目錄的絕對路徑，按「加入白名單」。",
        })
      );
      return;
    }
    whitelistRootsEl.replaceChildren(...roots.map(whitelistRootRow));
  } catch (error) {
    whitelistRootsEl.replaceChildren(
      element("li", { class: "whitelist-empty", text: failureText("讀取白名單", error) })
    );
  }
}

function whitelistRootRow(root) {
  const remove = element("button", {
    type: "button", "data-testid": "whitelist-remove", text: "移除",
  });
  remove.addEventListener("click", () => beginRemoveRoot(root.prefix, remove));
  return element("li", { "data-testid": `whitelist-root-${root.prefix}`, "data-prefix": root.prefix }, [
    element("span", { class: "whitelist-prefix", text: root.prefix }),
    element("span", { class: "whitelist-resolved", text: root.resolved }),
    element("span", { class: "whitelist-who", text: `由 ${root.added_by} 於 ${root.added_at}` }),
    remove,
  ]);
}

async function previewCandidates() {
  whitelistErrorEl.hidden = true;
  const prefix = whitelistAddInput.value.trim();
  if (!prefix) { whitelistPreviewEl.hidden = true; return; }
  const generation = ++previewGeneration;
  try {
    const response = await apiFetch(`${API_BASE}/api/candidate-count?prefix=${encodeURIComponent(prefix)}`);
    const payload = await response.json();
    if (generation !== previewGeneration) return;  // 有更新的預覽／加入開始了，這個回應過時、丟棄
    if (!response.ok) {
      whitelistPreviewEl.hidden = true;
      whitelistErrorEl.textContent = detailText(payload.detail);
      whitelistErrorEl.hidden = false;
      return;
    }
    const shown = payload.capped ? `${payload.count}+` : `${payload.count}`;
    whitelistPreviewEl.textContent = `此路徑下有 ${shown} 個可納管檔。`;
    whitelistPreviewEl.hidden = false;
  } catch (error) {
    if (generation !== previewGeneration) return;
    whitelistPreviewEl.hidden = true;
    whitelistErrorEl.textContent = failureText("計算可納管檔案數", error);
    whitelistErrorEl.hidden = false;
  }
}

function clearPreview() {
  ++previewGeneration;  // 仍在途的預覽回來時作廢
  whitelistPreviewEl.hidden = true;
  whitelistPreviewEl.textContent = "";
}

async function addRoot(button) {
  if (isBusy(button)) return;
  whitelistErrorEl.hidden = true;
  clearPreview();  // 舊的預覽不留到這次的結果旁邊——那會被誤認成目前路徑的數字
  const prefix = whitelistAddInput.value.trim();
  if (!prefix) return;
  const showError = (text) => {
    whitelistErrorEl.textContent = text;
    whitelistErrorEl.hidden = false;
  };
  if (!await confirmAddRoot(prefix, showError)) return;
  await whileBusy(button, "加入中…", async () => {
    try {
      const response = await apiFetch(`${API_BASE}/api/allowed-roots`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ prefix }),
      });
      const payload = await response.json();
      if (!response.ok) {
        whitelistErrorEl.textContent = detailText(payload.detail);
        whitelistErrorEl.hidden = false;
        return;
      }
      whitelistAddInput.value = "";
      whitelistPreviewEl.hidden = true;
      ++previewGeneration;  // 作廢加入前送出、仍在途的預覽，免得它稍後把已清空的預覽面板顯示回來（#252）
      loadWhitelist();
    } catch (error) {
      whitelistErrorEl.textContent = failureText("加入白名單", error);
      whitelistErrorEl.hidden = false;
    }
  });
}

async function beginRemoveRoot(prefix, button) {
  if (isBusy(button)) return;
  // 先以 confirmed=false 問後端：有受影響的納管項目就列出＋要求確認，不靜默移除（AC3）。
  // 後端在未確認時一律回 409 confirm_required（含受影響清單，可能為空）。
  whitelistErrorEl.hidden = true;
  try {
    const response = await apiFetch(`${API_BASE}/api/allowed-roots`, {
      method: "DELETE",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ prefix, confirmed: false }),
    });
    const payload = await response.json();
    if (response.status === 409 && payload.detail && payload.detail.kind === "confirm_required") {
      if (await confirmRemoval(prefix, payload.detail)) await confirmRemoveRoot(prefix, button);
      return;
    }
    whitelistErrorEl.textContent = detailText(payload.detail);
    whitelistErrorEl.hidden = false;
  } catch (error) {
    whitelistErrorEl.textContent = failureText("移除白名單", error);
    whitelistErrorEl.hidden = false;
  }
}

// 移除的確認走共用的確認對話框（#50）。這段是寫給按按鈕的人看的，由介面自己說：要移除的是哪一個、
// 會怎樣、已納管的受不受影響——受影響的項目列在對話框裡。
function confirmRemoval(prefix, detail) {
  const affected = (detail.affected || []).map((item) => `${item.ref}：${item.target}`);
  const about = affected.length
    ? `以下 ${affected.length} 份已納管的設定的目標在這個路徑底下——它們不受影響，仍會繼續管理：`
    : "目前沒有已納管的設定的目標在這個路徑底下。";
  return confirmAction(
    `把「${prefix}」從白名單移除？`,
    `移除後這個路徑底下的檔案不能再瀏覽或納管；之後可以再加回來。${about}`,
    "從白名單移除",
    affected,
  );
}

async function confirmRemoveRoot(prefix, button) {
  await whileBusy(button, "移除中…", async () => {
    try {
      const response = await apiFetch(`${API_BASE}/api/allowed-roots`, {
        method: "DELETE",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ prefix, confirmed: true }),
      });
      const payload = await response.json();
      if (!response.ok) {
        whitelistErrorEl.textContent = detailText(payload.detail);
        whitelistErrorEl.hidden = false;
        return;
      }
      loadWhitelist();
    } catch (error) {
      whitelistErrorEl.textContent = failureText("移除白名單", error);
      whitelistErrorEl.hidden = false;
    }
  });
}

whitelistButton.addEventListener("click", showWhitelist);
whitelistView.querySelector("[data-testid='whitelist-back']")
  .addEventListener("click", () => showList(currentIdentity));
whitelistView.querySelector("[data-testid='whitelist-preview-button']")
  .addEventListener("click", previewCandidates);
const whitelistAddButton = whitelistView.querySelector("[data-testid='whitelist-add']");
whitelistAddButton.addEventListener("click", () => addRoot(whitelistAddButton));
// 路徑一改，先前的預覽就不是這個路徑的了：清掉，不留著讓人誤認。
whitelistAddInput.addEventListener("input", () => {
  clearPreview();
  whitelistErrorEl.hidden = true;
});
browseView.querySelector(".browse-go").addEventListener("click", () => {
  const path = browsePathInput.value.trim();
  if (path) browseTo(path);
});

// ── W8 納管確認（#14）───────────────────────────────────────────────────────
// 選檔（W7）→「檢視並納管」→ POST /api/inspect → 顯示格式／型別／歧義／權限／hostname
// 供確認 → 逐條確認歧義後 → POST /api/configs 寫入 → 回清單。型別只顯示不可編輯（編輯是
// W3／#16）。hostname 只顯示、不由前端送（後端納管當下決定並凍結，不變式 8）。
let selectedSourcePath = null;
let currentAmbiguities = [];
// 每次偵測遞增；回應回來時若世代已變（使用者又換了格式、發了新偵測），丟棄這個過時回應
// ——否則晚到的舊回應會覆寫成與當前格式不符的型別/歧義，甚至以較少的歧義繞過確認閘門（#14 審查）。
let inspectGeneration = 0;

const onboardStartEl = document.querySelector("[data-testid='onboard-start']");
const confirmView = document.querySelector("[data-testid='onboard-confirm']");
const onboardPathEl = document.querySelector("[data-testid='onboard-path']");
const onboardFormatEl = document.querySelector("[data-testid='onboard-format']");
const onboardHostnameEl = document.querySelector("[data-testid='onboard-hostname']");
const onboardPermsEl = document.querySelector("[data-testid='onboard-permissions']");
const onboardSummaryEl = document.querySelector("[data-testid='onboard-summary']");
const onboardTypesEl = document.querySelector("[data-testid='onboard-types']");
const onboardAmbiguitiesEl = document.querySelector("[data-testid='onboard-ambiguities']");
const onboardErrorEl = document.querySelector("[data-testid='onboard-error']");
const onboardSubmitEl = document.querySelector("[data-testid='onboard-submit']");

// 副檔名只當**建議**（不變式 8：副檔名不是持續權威，使用者可改、確認後才明寫進清單檔）。
const FORMAT_BY_EXT = { yaml: "yaml", yml: "yaml", json: "json", toml: "toml", ini: "ini" };
const TYPE_TEXT = {
  bool: "布林", int: "整數", float: "浮點數", string: "字串",
  dict: "物件", list: "陣列", null: "null", unknown: "未知",
};

function guessFormat(path) {
  const ext = path.split(".").pop().toLowerCase();
  return FORMAT_BY_EXT[ext] || "raw";
}

function showConfirm() {
  hideAllPageViews();
  confirmView.hidden = false;
}

function openConfirm(path) {
  onboardPathEl.textContent = path;
  onboardFormatEl.value = guessFormat(path);
  showConfirm();
  runInspect();
}

function clearInspectResults() {
  // 每次偵測前清掉上一檔的結果。少了它，偵測失敗時 W8 會殘留前一檔的型別／歧義／hostname，
  // 而殘留的歧義勾選框仍掛著 change→refreshSubmitState——勾滿就把「確認寫入」重新解鎖，於是
  // 對一個偵測失敗的檔案送出納管、還帶著另一檔的歧義確認，繞過 AC4 的確認閘門。
  onboardHostnameEl.textContent = "";
  onboardPermsEl.textContent = "";
  onboardSummaryEl.textContent = "";
  onboardTypesEl.replaceChildren();
  onboardAmbiguitiesEl.replaceChildren();
  currentAmbiguities = [];
}

async function runInspect() {
  const generation = ++inspectGeneration;
  onboardErrorEl.hidden = true;
  onboardSubmitEl.disabled = true;
  clearInspectResults();
  try {
    const response = await apiFetch(`${API_BASE}/api/inspect`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        source_path: onboardPathEl.textContent,
        format: onboardFormatEl.value,
      }),
    });
    const payload = await response.json();
    if (generation !== inspectGeneration) return;  // 有更新的偵測開始了，這個回應過時、丟棄
    if (!response.ok) {
      renderOnboardError(payload.detail);
      return;
    }
    renderInspect(payload);
  } catch (error) {
    if (generation !== inspectGeneration) return;
    renderOnboardError(failureText("偵測來源檔案", error));
  }
}

function renderInspect(payload) {
  onboardHostnameEl.textContent = `將以 hostname＝${payload.hostname} 納管`;
  const permissions = payload.permissions;
  onboardPermsEl.textContent =
    `原始權限 ${permissions.owner}:${permissions.group} ${permissions.mode}`;
  // raw 不解析——說明語意，不顯示「0 個欄位」這種假訊號（#195 資安審查的同一類）。
  onboardSummaryEl.textContent = payload.format === "raw"
    ? "raw：只版控、不解析，因此沒有欄位、型別或歧義。"
    : `偵測到 ${payload.field_count} 個欄位。`;
  renderTypeTree(payload.types);
  renderAmbiguities(payload.ambiguities);
  refreshSubmitState();
}

function renderTypeTree(types) {
  // 後端回的 types 已含容器（dict／list）與葉，鍵為前序走訪的欄位路徑（. 相接、[] 標元素）。
  // key 裡的字面點跳脫成 \.（#219），所以深度只算「未跳脫的點」與 []，葉名取最後一段後把
  // \. 還原成 .——否則含點 key 會被算錯層、或葉名被切半。
  onboardTypesEl.replaceChildren(...Object.keys(types).map((path) => {
    const type = types[path];
    const depth = (path.match(/(?<!\\)\.|\[\]/g) || []).length;
    const leaf = path.split(/(?<!\\)\./).pop().replace(/\\\./g, ".");
    const node = element("li", {
      "data-testid": `onboard-type-${path}`,
      "data-name": path,
      "data-type": type,
    }, [
      element("span", { text: `${"　".repeat(depth)}${leaf}` }),
      element("span", { class: "type", text: TYPE_TEXT[type] || type }),
    ]);
    if (type === "dict" || type === "list") node.setAttribute("data-container", "true");
    return node;
  }));
}

function renderAmbiguities(ambiguities) {
  currentAmbiguities = ambiguities;
  onboardAmbiguitiesEl.replaceChildren(...ambiguities.map((ambiguity) => {
    const ack = element("input", {
      type: "checkbox",
      "data-testid": `onboard-ambiguity-ack-${ambiguity.line}`,
    });
    ack.addEventListener("change", refreshSubmitState);
    return element("div", {
      class: "onboard-ambiguity",
      "data-testid": `onboard-ambiguity-${ambiguity.line}`,
    }, [
      element("label", {}, [
        ack,
        element("span", { text: `第 ${ambiguity.line} 行「${ambiguity.value}」` }),
      ]),
      element("p", { class: "readings", text: ambiguity.readings.join("；") }),
    ]);
  }));
}

function refreshSubmitState() {
  // 每個歧義都要勾了才解鎖「確認寫入」（AC4：確認後才繼續）。無歧義時 every 回 true。
  // 錯誤顯示中一律停用：偵測失敗的檔案不該送得出去，即使有殘留／勾選的框（縱深防禦，
  // 主要仍靠 clearInspectResults 不留殘留框）。
  const acks = [...onboardAmbiguitiesEl.querySelectorAll("input[type='checkbox']")];
  onboardSubmitEl.disabled = !onboardErrorEl.hidden || !acks.every((box) => box.checked);
}

function renderOnboardError(detail) {
  // detail 三形狀：字串（onboard）、{message,file,line}（inspect）、list（FastAPI 驗證）。
  let message;
  if (typeof detail === "string") {
    message = detail;
  } else if (Array.isArray(detail)) {
    message = detail.map((item) => item.msg || JSON.stringify(item)).join("；");
  } else if (detail && detail.message) {
    // 只顯示 message：inspect 的語法錯誤訊息本身已內嵌「（第 N 行）」，前端不再補一次（#14 審查）。
    message = detail.message;
  } else {
    message = String(detail);
  }
  onboardErrorEl.textContent = message;
  onboardErrorEl.hidden = false;
  onboardSubmitEl.disabled = true;
}

async function submitOnboard() {
  // 歧義確認彙整進 commit 內文，供日後追溯當時怎麼確認的（onboard 原樣寫入、不解析）。
  const note = currentAmbiguities
    .map((ambiguity) => `第 ${ambiguity.line} 行「${ambiguity.value}」已確認`)
    .join("；");
  onboardErrorEl.hidden = true;
  try {
    const response = await apiFetch(`${API_BASE}/api/configs`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        source_path: onboardPathEl.textContent,
        format: onboardFormatEl.value,
        ambiguity_note: note,
      }),
    });
    const payload = await response.json();
    if (!response.ok) {
      renderOnboardError(payload.detail);
      return;
    }
    // 回清單（load() 會重掃，新條目出現在左側樹）、選到剛納管的那一份、說一聲納管成了。
    selectedUid = payload.uid;
    clearPromoteBanners();
    showList(currentIdentity);
    promoteDoneEl.textContent = `已納管「${payload.ref}」，並記一筆變更紀錄。目標檔案：${payload.target}。`;
    promoteDoneEl.hidden = false;
  } catch (error) {
    renderOnboardError(failureText("納管", error));
  }
}

onboardStartEl.addEventListener("click", () => {
  if (selectedSourcePath) openConfirm(selectedSourcePath);
});
onboardFormatEl.addEventListener("change", runInspect);
onboardSubmitEl.addEventListener("click", () => whileBusy(onboardSubmitEl, "納管中…", submitOnboard));
onboardTypesEl.addEventListener("click", (event) => {
  const container = event.target.closest("li[data-container='true']");
  if (!container) return;
  // 折疊狀態記在容器自己身上（data-collapsed），再依「任一祖先折疊了嗎」重算每個節點的可見性
  // ——不用 toggle 逐一翻子節點：巢狀時「先折內層再折外層」會把已折疊的深層子節點翻回來（#14 審查）。
  container.dataset.collapsed = container.dataset.collapsed === "true" ? "false" : "true";
  const collapsed = [...onboardTypesEl.querySelectorAll("li[data-container='true']")]
    .filter((node) => node.dataset.collapsed === "true")
    .map((node) => node.dataset.name);
  for (const node of onboardTypesEl.querySelectorAll("li")) {
    const name = node.dataset.name;
    const hidden = collapsed.some(
      (prefix) => name !== prefix && (name.startsWith(`${prefix}.`) || name.startsWith(`${prefix}[`))
    );
    node.classList.toggle("is-collapsed-child", hidden);
  }
});
confirmView.querySelector(".onboard-cancel").addEventListener("click", showBrowse);

// 已經輸入過身分就直接進清單（重新整理不必再填一次）。
// 模式的中文說法（CONTEXT.md「角色與環境」）。後端回的是代號；不認得的代號原樣顯示，不猜。
const MODE_TEXT = { development: "開發模式", deployment: "部署模式" };

// 問後端現在是哪個模式（#47）。前端沒有決定權，也沒有端點可改——它只能問。問不到時徽章顯示
// 「模式未知」而不是留白或假設某一種：假設成開發模式會讓之後依模式開關的行為（#48、#288）
// 在部署機上開錯邊。之後的程式碼從 `document.body.dataset.mode` 讀。
async function loadMode() {
  const badge = document.querySelector("[data-testid='current-mode']");
  try {
    const response = await apiFetch(`${API_BASE}/api/mode`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const { mode } = await response.json();
    document.body.dataset.mode = mode;
    badge.textContent = MODE_TEXT[mode] || mode;
  } catch (error) {
    delete document.body.dataset.mode;
    badge.textContent = "模式未知";
  }
}

(async function start() {
  await loadMode();
  try {
    const response = await apiFetch(`${API_BASE}/api/session`);
    // 身分屬於這個瀏覽器（#288）：後端只回這個瀏覽器自己宣告過的身分，有就直接進清單。
    const identity = response.ok ? await response.json() : null;
    if (identity) {
      showList(identity);
      return;
    }
  } catch (error) {
    // backend 連不上時仍顯示身分輸入頁：那是使用者唯一能操作的東西，
    // 而送出時的錯誤會說明真正的問題。
  }
  // 沒有身分：先把身分輸入頁顯示出來（那是使用者唯一能操作的東西，不等任何請求），再問是不是
  // 因閒置被退出的——是的話補上說明（重新整理後也一樣，#48）。
  showIdentityForm();
  const idle = await idleRequest(false);
  if (idle && idle.timed_out && !identityForm.hidden) showIdentityForm(idle.timeout_seconds || true);
})();
</script>

</body>
</html>
