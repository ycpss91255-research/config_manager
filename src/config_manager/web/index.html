<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>config_manager</title>
<!--
  單一 HTML ＋ 原生 JS（設計文件 §3.3）：v0.10.0 的畫面是清單、按鈕與差異顯示，
  以 fetch 呼叫 §3.5.3 的端點即可，不需框架也不需打包步驟。

  元素的 data-testid 與可見文字依 doc/UI-ELEMENTS.md 的 W2，不是隨手取的：
  測試以語意屬性選取，不以 CSS class 或 DOM 路徑（ADR-00000019）。改動這裡就要
  同步那份文件，否則「有測試」會變成假象。

  這一版只有清單與狀態（#7）。身分輸入、參數表、歷史、差異檢視隨各自的 issue 加入。
-->
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1b1b;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --panel: #f7f7f7;
    --in-sync: #2e7d32;
    --drift: #c62828;
    --missing: #9e9e9e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --fg: #e8e8e8;
      --muted: #9aa0a6;
      --line: #2c2f33;
      --panel: #1d2023;
      --in-sync: #66bb6a;
      --drift: #ef5350;
      --missing: #8a8f94;
    }
  }
  * { box-sizing: border-box; }
  /* 瀏覽器預設的 [hidden]{display:none} 會被下面任何一條 display 宣告蓋過
     ——header 的 display:flex 就蓋掉了它，於是「隱藏」的頁首照樣顯示。
     這是 hidden 屬性最常見的失效方式，用 !important 釘住。 */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;  /* 窄視窗時整顆按鈕換到下一行，不是把字擠成一欄（人工驗證） */
    align-items: center;
    gap: 8px 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
  }
  /* 中文沒有空白可斷行，彈性容器一擠就會一個字一行。工具列的按鈕、選單、身分一律不拆字、不縮。 */
  header button, header select, header h1, header .who { flex: none; white-space: nowrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .grow { flex: 1; }
  button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  header select {
    font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg);
  }
  .param-row[data-hit="true"] { background: color-mix(in srgb, var(--in-sync) 14%, transparent); }
  input[type="search"] {
    font: inherit;
    padding: 6px 10px;
    flex: 1 1 160px;
    min-width: 120px;
    max-width: 320px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  main {
    padding: 16px 20px 40px;
    display: grid;
    grid-template-columns: minmax(300px, 1fr) minmax(0, 2fr);
    gap: 24px;
    align-items: start;
  }
  /* W3 參數欄位表（#20）：一列一個參數——名稱／型別／值／來源值／驗證。 */
  .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .panel-head { display: flex; align-items: baseline; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .panel-head .target { flex: 1; }
  .param-table { padding: 6px 0; }
  .param-table .param-head { color: var(--muted); font-size: 12px; font-weight: 600; }
  .param-table .param-head:hover { background: transparent; }
  .param-row { align-items: center; }
  .param-row .param-name { flex: 1.4; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
  .param-row[data-container="true"] { cursor: pointer; }
  .param-row[data-container="true"] .param-name { font-weight: 600; }
  .param-row .param-type { flex: none; width: 64px; font-size: 12px; color: var(--muted); }
  .param-table[data-specifiable="true"] .param-type { width: 176px; }
  .param-type select { font-size: 12px; }
  .type-overridden { margin-left: 4px; color: var(--drift); font-weight: 600; }
  .type-clear { margin-left: 4px; font-size: 11px; padding: 0 4px; }
  .readonly-only { display: none; }
  body[data-readonly="true"] .readonly-only { display: inline; }
  .param-row .param-value-wrap { flex: 1; }
  .param-row .param-value-wrap input, .param-row .param-value-wrap select {
    font: inherit; font-size: 13px; width: 100%; padding: 4px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
  }
  .param-row .param-value-wrap input[type="checkbox"] { width: auto; }
  .param-row .param-value-wrap input[readonly] { color: var(--muted); }
  .param-row .param-source { flex: 1; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .param-row .param-source[data-changed="true"] { color: var(--drift); text-decoration: line-through; }
  .param-row .param-validation { flex: 1; font-size: 12px; color: var(--drift); }
  .param-row[data-valid="false"] { background: color-mix(in srgb, var(--drift) 8%, transparent); }
  .param-row.is-collapsed-child { display: none; }
  /* 草稿標記（#21）：樹節點右側的橘點與狀態色點分開（§7.4.3）；面板標頭的「草稿」字樣同色。 */
  .dot-draft { background: #e69b2e; margin-left: 4px; }
  .panel-draft { flex: none; font-size: 12px; color: #e69b2e; font-weight: 600; }
  .panel-schema, .panel-unvalidated { flex: none; font-size: 12px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); }
  .panel-unvalidated { color: #b3261e; border-color: #b3261e; }
  .panel-unmanage, .panel-attributes { flex: none; font-size: 12px; }
  .attributes { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .attributes label { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; font-size: 13px; }
  .attributes input[aria-invalid="true"] { outline: 2px solid var(--drift); }
  .attributes .attributes-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .attributes .hint { font-size: 12px; color: var(--muted); }
  .param-description { color: var(--muted, #777); cursor: help; }
  .panel-actions { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .panel-actions .hint { flex: 1; font-size: 12px; color: var(--muted); }
  .panel-save:disabled { opacity: .5; cursor: not-allowed; }
  .panel-save-error { margin: 0 14px 12px; }
  .panel-save-error ul { margin: 8px 0 0; padding-left: 18px; list-style: disc; }
  .panel-save-error li { display: list-item; padding: 2px 0; border: 0; font-size: 13px; }
  /* W4 歷史（#25／#26）：左列表／右差異（圖 13）。 */
  .history-filter { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .history-filter button[aria-pressed="true"] { border-color: var(--fg); background: var(--bg); font-weight: 600; }
  .history-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 12px 14px; align-items: start; }
  .history-entry { flex-direction: column; align-items: flex-start; gap: 2px; cursor: pointer; }
  .history-entry[aria-selected="true"] { background: var(--bg); outline: 1px solid var(--muted); }
  .history-kind { font-weight: 600; font-size: 13px; }
  .history-summary { font-size: 13px; overflow-wrap: anywhere; }
  .history-meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; }
  .history-diff .notice { margin: 0; }
  .diff-summary { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .diff-row { align-items: baseline; font-size: 13px; }
  .diff-row .diff-name { flex: 1.2; font-family: ui-monospace, "SF Mono", Menlo, monospace; overflow-wrap: anywhere; }
  .diff-row .diff-from, .diff-row .diff-to { flex: 1; overflow-wrap: anywhere; }
  .diff-row[data-change="same"] { color: var(--muted); }
  .diff-row[data-change="changed"] .diff-to, .diff-row[data-change="added"] .diff-to { color: var(--drift); font-weight: 600; }
  .diff-row[data-change="removed"] .diff-from { color: var(--drift); text-decoration: line-through; }
  /* W5 差異檢視（#30）：偏離橫幅＋來源／目標並排；顏色語言同 W4。 */
  .drift-banner { margin: 12px 14px 0; }
  .drift-banner .actions { margin-top: 8px; display: flex; gap: 8px; }
  .diff-head { display: flex; gap: 10px; padding: 8px 14px 0; font-size: 12px; color: var(--muted); font-weight: 600; }
  .diff-head .diff-name { flex: 1.2; }
  .diff-head .diff-side { flex: 1; }
  /* W5 三種處置（#31）：每個出口先說後果、再按。群組節點彙總子節點最嚴重的狀態（§7.4.1）。 */
  .resolve-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .resolve-option { display: flex; flex-direction: column; gap: 6px; }
  .resolve-option .why { font-size: 12px; color: var(--muted); }
  .resolve-error { margin: 0 14px 12px; }
  .group > h2 { display: flex; align-items: center; gap: 8px; }
  /* 單一編輯階段（#33、ADR-00000014）：非持有分頁唯讀——會寫入的控制項不出現，而不是停用。 */
  body[data-readonly="true"] .editing-only { display: none !important; }
  /* 右側工作區堆疊（#35／#36）：一份 config 一個槽，可折疊、可關閉；樹上單擊＝選取（高亮）。 */
  .panel + .panel, .panel + .history, .workspace-stack > * + * { margin-top: 14px; }
  .panel-head { cursor: pointer; user-select: none; }
  .panel[data-collapsed="true"] > :not(.panel-head) { display: none !important; }
  .panel-close { margin-left: 4px; padding: 2px 8px; font-size: 13px; line-height: 1.2; }
  li[aria-selected="true"] { outline: 2px solid var(--fg); outline-offset: -2px; }
  /* 樹的排列（#34） */
  .tree-layout { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .tree-layout select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .host { margin-bottom: 22px; }
  .host > h2 { font-size: 13px; letter-spacing: .04em; margin: 0 0 8px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .host .group { margin-left: 12px; }
  /* 進版／捨棄變更（#22） */
  .banner { grid-column: 1 / -1; }
  .banner ul { margin: 8px 0 0; padding-left: 18px; list-style: disc; }
  .banner li { display: list-item; padding: 2px 0; border: 0; font-size: 13px; }
  button.promote { font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .confirm { border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px; max-width: 460px; background: var(--panel); color: var(--fg); }
  .confirm::backdrop { background: rgba(0, 0, 0, .35); }
  .confirm h3 { margin: 0 0 8px; font-size: 16px; }
  .confirm p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .group { margin-bottom: 22px; }
  .group > h2 {
    font-size: 13px;
    letter-spacing: .04em;
    color: var(--muted);
    margin: 0 0 6px;
    font-weight: 600;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 6px;
  }
  li + li { border-top: 1px solid var(--line); }
  li:hover { background: var(--panel); }
  .dot {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    align-self: center;
  }
  .dot-in_sync { background: var(--in-sync); }
  .dot-drift   { background: var(--drift); }
  .dot-missing { background: var(--missing); }
  /* 判不出狀態（#214）：用偏離的紅並加外框，與四種狀態的實心點區隔。 */
  .dot-error   { background: var(--drift); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--drift); }
  [data-state="error"] .state { color: var(--drift); }
  .name { font-weight: 500; }
  .target {
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .state { margin-left: auto; flex: none; font-size: 13px; color: var(--muted); }
  .notice {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
  }
  .notice.error { border-color: var(--drift); color: var(--drift); }
  .notice.error pre {
    margin: 8px 0 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
  }

  /* W1 身分輸入。刻意不叫「登入」——沒有認證機制，說登入會誤導（CONTEXT.md）。 */
  #identity {
    max-width: 420px;
    margin: 60px auto;
    padding: 26px 28px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
  }
  #identity h2 { margin: 0 0 6px; font-size: 17px; }
  #identity .why { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  #identity label { display: block; margin-bottom: 14px; font-size: 13px; }
  #identity label span { display: block; margin-bottom: 4px; color: var(--muted); }
  #identity input[type="text"], #identity input[type="email"] {
    font: inherit;
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  /* 角色是兩個並排的選項按鈕，明顯可見，不藏在選單裡（ADR-00000020、W1）。 */
  .roles { display: flex; gap: 8px; margin: 4px 0 20px; }
  .roles button { flex: 1; }
  .roles button[aria-pressed="true"] {
    border-color: var(--fg);
    background: var(--bg);
    font-weight: 600;
  }
  #identity .enter { width: 100%; padding: 9px; font-weight: 600; }
  #identity .error {
    margin: 0 0 16px;
    color: var(--drift);
    font-size: 13px;
  }
  .who { color: var(--muted); font-size: 13px; }
  .scan-status { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--muted); }
  .scan-status[data-state="done"] { color: var(--in-sync); }
  .scan-status[data-state="failed"] { color: var(--drift); }
  /* 窄視窗：左側樹與右側工作區上下排，不並排——並排時兩欄的最小寬度加起來超出畫面。 */
  @media (max-width: 760px) {
    header { padding: 10px 12px; }
    header .grow { display: none; }
    main { grid-template-columns: minmax(0, 1fr); padding: 12px 12px 32px; gap: 16px; }
  }

  /* W7 檔案瀏覽 */
  #browse { padding: 16px 20px 40px; }
  .browse-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .breadcrumb {
    display: flex; flex-wrap: wrap; gap: 2px; align-items: baseline;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
  }
  .breadcrumb button {
    border: none; background: none; padding: 2px 4px; color: var(--fg);
    cursor: pointer; font: inherit;
  }
  .breadcrumb button:hover { text-decoration: underline; }
  .breadcrumb .sep { color: var(--muted); }
  .browse-path {
    flex: none; min-width: 260px; font: inherit; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
  }
  .browse-hint { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .browse-hint:empty { display: none; }
  .browse-roots, .browse-list {
    list-style: none; margin: 0 0 14px; padding: 0;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  .browse-roots:empty, .browse-list:empty { display: none; }
  .browse-roots li, .browse-list li {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer;
  }
  .browse-roots li + li, .browse-list li + li { border-top: 1px solid var(--line); }
  .browse-roots li:hover, .browse-list li:hover { background: var(--panel); }
  .browse-name { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
  .browse-list li[data-kind="dir"] .browse-name { font-weight: 600; }
  .browse-list .kind { color: var(--muted); font-size: 12px; margin-left: auto; }
  .browse-selection { font-size: 13px; color: var(--in-sync); font-weight: 600; }
  .browse-rejected {
    padding: 14px 16px; border: 1px solid var(--drift); border-radius: 8px;
    background: var(--panel); color: var(--drift);
  }
  .browse-rejected .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
  .browse-rejected .add-row { display: flex; gap: 8px; margin-top: 12px; }
  .browse-rejected input {
    flex: 1; font: inherit; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--fg);
  }
  .allowed-range {
    margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* W9 白名單維護 */
  #whitelist { padding: 16px 20px 40px; }
  .whitelist-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .whitelist-title { font-size: 15px; margin: 0; }
  .whitelist-add-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .whitelist-input {
    flex: 1; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
  }
  .whitelist-preview { color: var(--in-sync); font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  .whitelist-preview:empty, .whitelist-error:empty { display: none; }
  .whitelist-error { color: var(--drift); font-size: 13px; margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .whitelist-roots {
    list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px;
  }
  .whitelist-roots:empty { display: none; }
  .whitelist-roots li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  .whitelist-roots li + li { border-top: 1px solid var(--line); }
  .whitelist-prefix { font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; }
  .whitelist-resolved { color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  .whitelist-who { color: var(--muted); font-size: 12px; margin-left: auto; }
  .whitelist-empty { color: var(--muted); font-size: 13px; }
  .whitelist-remove-confirm {
    margin-top: 12px; padding: 12px; border: 1px solid var(--drift); border-radius: 8px;
  }
  .whitelist-remove-confirm[hidden] { display: none; }
  .whitelist-affected { margin: 8px 0; padding-left: 18px; font-size: 13px; color: var(--muted); }

  /* W8 納管確認 */
  #onboard-confirm { padding: 16px 20px 40px; }
  .onboard-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .onboard-path {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    color: var(--muted); overflow-wrap: anywhere;
  }
  .onboard-fmt-label { font-size: 12px; color: var(--muted); }
  .onboard-format {
    font: inherit; margin-left: 6px; padding: 5px 8px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--fg);
  }
  .onboard-meta { display: flex; gap: 20px; margin: 0 0 6px; font-size: 13px; }
  .onboard-hostname { color: var(--in-sync); font-weight: 600; }
  .onboard-permissions { color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .onboard-summary { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .onboard-summary:empty { display: none; }
  .onboard-cols { display: flex; gap: 16px; align-items: flex-start; }
  .onboard-types {
    flex: 1; list-style: none; margin: 0; padding: 0;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  .onboard-types:empty { display: none; }
  .onboard-types li {
    padding: 6px 12px; display: flex; align-items: baseline; gap: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
  }
  .onboard-types li + li { border-top: 1px solid var(--line); }
  .onboard-types li[data-container="true"] { cursor: pointer; font-weight: 600; }
  .onboard-types li.is-collapsed-child { display: none; }
  .onboard-types .type { margin-left: auto; color: var(--muted); font-size: 12px; }
  .onboard-ambiguities { flex: none; width: 300px; }
  .onboard-ambiguities:empty { display: none; }
  .onboard-ambiguity {
    border: 1px solid var(--drift); border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; background: var(--panel);
  }
  .onboard-ambiguity label { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .onboard-ambiguity .readings { color: var(--muted); font-size: 12px; margin: 4px 0 0 22px; }
  .onboard-actions { margin-top: 16px; }
  .onboard-start { margin-top: 10px; font-weight: 600; }
  .onboard-submit:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<form id="identity" data-testid="identity-form" hidden>
  <h2>請輸入身分資訊</h2>
  <p class="why">
    這不是登入。沒有密碼，也不會驗證——你填的姓名與 email 會成為變更紀錄的作者，
    讓每一次改動追溯得到人。
  </p>

  <p class="error" data-testid="identity-error" hidden></p>

  <label>
    <span>姓名</span>
    <input type="text" name="name" data-testid="identity-name" autocomplete="name" required>
  </label>
  <label>
    <span>Email</span>
    <input type="email" name="email" data-testid="identity-email" autocomplete="email" required>
  </label>

  <span id="role-label">角色</span>
  <div class="roles" data-testid="role-toggle" role="group" aria-labelledby="role-label">
    <button type="button" data-role="user" aria-pressed="true">一般使用者</button>
    <button type="button" data-role="developer" aria-pressed="false">🔧 開發者</button>
  </div>

  <button type="submit" class="enter">進入</button>
</form>

<header hidden>
  <h1>config_manager</h1>
  <!-- 搜尋範圍（#37、§7.4.2）：預設「全部」＝四種範圍的聯集；指定範圍是為了降噪。 -->
  <select data-testid="search-scope" aria-label="搜尋範圍">
    <option>全部</option>
    <option>config 名稱</option>
    <option>目標路徑</option>
    <option>參數名稱</option>
    <option>參數值</option>
  </select>
  <input type="search" data-testid="search-input" placeholder="搜尋" aria-label="搜尋">
  <span class="grow"></span>
  <span class="who" data-testid="current-role"></span>
  <button type="button" class="editing-only" data-testid="open-browse">納管</button>
  <button type="button" class="editing-only" data-testid="open-whitelist" hidden>白名單</button>
  <button type="button" data-testid="rescan">檢查差異</button>
  <!-- 三段式的第三段（#22、§7.4.3）：進版是全域動作，按鈕顯示待進版草稿數；捨棄變更清草稿、不動來源與目標。 -->
  <button type="button" class="editing-only" data-testid="discard-all" disabled>捨棄變更</button>
  <button type="button" class="promote editing-only" data-testid="promote-all" disabled>進版 (0)</button>
</header>

<!-- W6 確認對話框：捨棄變更（全域／單一）等不可逆動作共用；含可見標題與後果說明。 -->
<dialog data-testid="confirm-dialog" class="confirm">
  <h3 data-testid="confirm-title"></h3>
  <p data-testid="confirm-body"></p>
  <div class="confirm-actions">
    <button type="button" data-testid="confirm-cancel">取消</button>
    <button type="button" data-testid="confirm-ok">確認</button>
  </div>
</dialog>

<main hidden>
  <!-- 進版的結果橫幅：失敗指名哪一份的哪一個參數（原樣列出後端的行號／原因／建議）、成功說進了幾份。 -->
  <!-- W6 唯讀橫幅（#33）：非持有分頁顯示；含持有者姓名、email、開始時間。 -->
  <div class="notice error banner" data-testid="readonly-banner" hidden></div>
  <div class="notice error banner" data-testid="promote-error" hidden></div>
  <div class="notice banner" data-testid="promote-done" hidden></div>
  <!-- 「檢查差異」的回饋：檢查中／檢查完（幾份、結果）／失敗。全部一致時畫面不會變，沒有這一行
       就看不出到底有沒有執行（人工驗證）。 -->
  <p class="scan-status" data-testid="scan-status" role="status" hidden></p>
  <div class="tree-column">
    <!-- 樹的排列（#34、§7.4.1）：依群組（預設）或依主機（第一層 hostname、第二層群組）。單機部署下
         主機層只有一個節點，切換的價值在多機；結構先留著。 -->
    <label class="tree-layout">
      <span>排列</span>
      <select data-testid="tree-layout">
        <option value="group">依群組</option>
        <option value="host">依主機</option>
      </select>
    </label>
    <div id="tree" data-testid="config-tree"></div>
  </div>
  <!-- W2 右側工作區／W3 參數欄位表（#20）：單擊左側樹的 config → 這裡顯示它的欄位表，一次一份
       （雙擊展開與多開是 #35／#36）。元素的 data-testid 依 UI-ELEMENTS.md 的 W3。 -->
  <section id="workspace" data-testid="workspace">
    <p class="notice" data-testid="workspace-empty">從左側點選一份 config，這裡會顯示它的參數欄位表。</p>
  </section>
</main>

<!-- W7 檔案瀏覽（#13）：受白名單限制的瀏覽，供納管時選定路徑。獨立整頁 view，
     從工具列「納管」開啟。元素的 data-testid 與可見文字依 UI-ELEMENTS.md 的 W7。 -->
<section id="browse" data-testid="browse" hidden>
  <div class="browse-bar">
    <button type="button" class="browse-back">返回</button>
    <nav data-testid="breadcrumb" class="breadcrumb"></nav>
    <span class="grow"></span>
    <input type="text" data-testid="browse-path-input" class="browse-path"
           placeholder="貼上或輸入絕對路徑…" aria-label="絕對路徑">
    <button type="button" class="browse-go">前往</button>
  </div>
  <p class="browse-hint" data-testid="browse-hint"></p>
  <ul data-testid="browse-roots" class="browse-roots"></ul>
  <ul data-testid="browse-list" class="browse-list"></ul>
  <p class="browse-selection" data-testid="browse-selection" hidden></p>
  <button type="button" class="onboard-start" data-testid="onboard-start" hidden>檢視並納管</button>
  <div class="browse-rejected" data-testid="browse-rejected" hidden></div>
</section>

<!-- W9 白名單維護（#15）：開發者專屬的白名單管理面板——檢視誰/何時、新增含候選數預覽、
     移除含受影響確認。從工具列「白名單」開啟（該按鈕僅開發者存在）。data-testid 依
     UI-ELEMENTS.md W9。 -->
<section id="whitelist" data-testid="whitelist" hidden>
  <div class="whitelist-bar">
    <button type="button" class="whitelist-back" data-testid="whitelist-back">返回</button>
    <h2 class="whitelist-title">白名單維護</h2>
  </div>
  <div class="whitelist-add-row">
    <input type="text" data-testid="whitelist-add-input" class="whitelist-input"
           placeholder="要加入白名單的絕對路徑…" aria-label="新增白名單前綴">
    <button type="button" data-testid="whitelist-preview-button">預覽</button>
    <button type="button" data-testid="whitelist-add">加入白名單</button>
  </div>
  <p class="whitelist-preview" data-testid="whitelist-preview" hidden></p>
  <p class="whitelist-error" data-testid="whitelist-error" hidden></p>
  <ul data-testid="whitelist-roots" class="whitelist-roots"></ul>
  <div class="whitelist-remove-confirm" data-testid="whitelist-remove-confirm" hidden></div>
</section>

<!-- W8 納管確認（#14）：偵測結果供確認 → 寫入。從 W7 選檔後進入。
     元素的 data-testid 與可見文字依 UI-ELEMENTS.md 的 W8。 -->
<section id="onboard-confirm" data-testid="onboard-confirm" hidden>
  <div class="onboard-bar">
    <button type="button" class="onboard-cancel">取消</button>
    <span class="onboard-path" data-testid="onboard-path"></span>
    <span class="grow"></span>
    <label class="onboard-fmt-label">格式
      <select data-testid="onboard-format" class="onboard-format">
        <option value="yaml">yaml</option>
        <option value="json">json</option>
        <option value="toml">toml</option>
        <option value="ini">ini</option>
        <option value="raw">raw</option>
      </select>
    </label>
  </div>
  <p class="onboard-meta">
    <span data-testid="onboard-hostname" class="onboard-hostname"></span>
    <span data-testid="onboard-permissions" class="onboard-permissions"></span>
  </p>
  <p class="onboard-summary" data-testid="onboard-summary"></p>
  <div class="onboard-cols">
    <ul data-testid="onboard-types" class="onboard-types"></ul>
    <div data-testid="onboard-ambiguities" class="onboard-ambiguities"></div>
  </div>
  <div class="onboard-error notice error" data-testid="onboard-error" hidden></div>
  <div class="onboard-actions">
    <button type="button" class="onboard-submit" data-testid="onboard-submit" disabled>確認寫入</button>
  </div>
</section>

<script>
// 狀態的中文說法取自 CONTEXT.md，不在這裡另造。「未納管」不會出現在這份清單裡
// ——它的定義是「不在清單檔中」，而這份清單就是清單檔。它屬於納管流程的畫面。
const STATE_TEXT = {
  in_sync: "一致",
  drift: "偏離",
  missing: "未部署",
};

// 前端與 backend 是兩個容器、兩個 port（設計文件 §3.1），所以這裡不能用相對路徑
// ——相對路徑會打到供應這個檔案的靜態伺服器上，得到 404。
//
// 由 location 推導而不是寫死 127.0.0.1：用 IP 或主機名開這個頁面時（機器人在
// 區網上的常態），寫死的位址會指到看頁面的那台電腦自己。backend 那邊要放行
// 對應的來源，見 CM_ALLOWED_ORIGINS。
const API_BASE = window.CM_API_BASE || `${location.protocol}//${location.hostname}:8080`;

const UNGROUPED = "ungrouped";
const tree = document.querySelector("[data-testid='config-tree']");
const search = document.querySelector("[data-testid='search-input']");
let rows = [];
// 非 null 表示上次載入失敗。render() 綁在搜尋輸入上、每次無條件從 rows 重畫；少了這個
// 旗標，在錯誤態打字就會把 load-error 靜默蓋成空清單或過期清單（不變式 2：大聲失敗）。
let loadError = null;
// 每次載入遞增；回應回來時若世代已變（使用者又按了「檢查差異」、或啟動載入與手動重掃交錯），
// 丟棄這個過時回應——否則晚到的舊回應會把新結果覆蓋，或把該顯示的錯誤靜默蓋掉／反之黏住假錯誤（#252）。
let loadGeneration = 0;
// 目前有草稿的 uid（#21）。掛在 app 上的階段是唯一來源：每次載入清單一併重讀，儲存成功時以回應更新。
let draftUids = new Set();

const promoteButton = document.querySelector("[data-testid='promote-all']");
const discardAllButton = document.querySelector("[data-testid='discard-all']");
const promoteErrorEl = document.querySelector("[data-testid='promote-error']");
const promoteDoneEl = document.querySelector("[data-testid='promote-done']");

// draftUids 是唯一來源：每次它變（載入、儲存、進版、捨棄）都從這裡重畫樹與工具列。
function setDrafts(uids) {
  draftUids = new Set(uids);
  render();
  promoteButton.textContent = `進版 (${draftUids.size})`;
  promoteButton.disabled = draftUids.size === 0;
  discardAllButton.disabled = draftUids.size === 0;
}

async function loadDrafts() {
  try {
    const response = await fetch(`${API_BASE}/api/drafts`);
    if (!response.ok) throw new Error(await loadErrorText(response));
    const payload = await response.json();
    setDrafts(payload.drafts.map((draft) => draft.uid));
  } catch (error) {
    // 讀不到草稿清單不該悄悄把標記藏掉（不變式 2）：在工作區說出來，樹照常顯示。
    mountNotice(element("div", {
      class: "notice error", "data-testid": "drafts-error",
    }, [
      element("strong", { text: "讀不到草稿清單，樹上的草稿標記可能不準。" }),
      element("pre", { text: String(error && error.message ? error.message : error) }),
    ]));
  }
}

function groupsOf(row) {
  return row.groups && row.groups.length ? row.groups : [UNGROUPED];
}

// 一份 config 屬多個群組時，在每個群組節點下都出現（T16）。
function byGroup(items) {
  const buckets = new Map();
  for (const row of items) {
    for (const group of groupsOf(row)) {
      if (!buckets.has(group)) buckets.set(group, []);
      buckets.get(group).push(row);
    }
  }
  return [...buckets.entries()].sort(([a], [b]) => {
    if (a === UNGROUPED) return 1;
    if (b === UNGROUPED) return -1;
    return a.localeCompare(b);
  });
}

// ── 參數層級搜尋（#37、§7.4.2）：走 GET /api/search（#32），不在前端自己比對——「哪些 config 有
// max_vel」是索引層級的問題，前端只拿到清單列。命中的 config 留在樹上，命中的參數在展開時標示並定位。
const searchScope = document.querySelector("[data-testid='search-scope']");
let searchHits = null;  // null＝沒有查詢（全部顯示）；否則是命中的 uid 集合
let hitParams = new Map();  // uid → 命中的參數路徑
let searchError = null;
let searchGeneration = 0;
let searchTimer = null;

function scheduleSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 150);  // 打字中不每字打一次端點
}

async function runSearch() {
  const generation = ++searchGeneration;
  const query = search.value.trim();
  if (!query) {
    searchHits = null;
    hitParams = new Map();
    searchError = null;
    render();
    return;
  }
  try {
    const params = new URLSearchParams({ q: query, scope: searchScope.value });
    const response = await fetch(`${API_BASE}/api/search?${params}`);
    if (!response.ok) throw new Error(await loadErrorText(response));
    const payload = await response.json();
    if (generation !== searchGeneration) return;
    searchHits = new Set(payload.hits.map((hit) => hit.uid));
    hitParams = new Map(payload.hits.map((hit) => [hit.uid, hit.params.map((param) => param.path)]));
    searchError = null;
  } catch (error) {
    if (generation !== searchGeneration) return;
    // 搜尋失敗不能靜默顯示成「沒有符合的項目」——那會讓人以為參數不存在（不變式 2、T14）。
    searchError = String(error && error.message ? error.message : error);
  }
  render();
}

function matches(row) {
  return searchHits === null || searchHits.has(row.uid);
}

function element(tag, attributes, children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attributes || {})) {
    if (key === "text") node.textContent = value;
    else node.setAttribute(key, value);
  }
  for (const child of children || []) node.appendChild(child);
  return node;
}

function rowNodeBase(row) {
  if (row.error) {
    // 判不出狀態的那一列（目標是 FIFO／裝置／不可 traverse，#214）：標「錯誤」並把原因放進
    // title，不畫一個偽裝的狀態點——把「比不了」講成某個狀態就是靜默失敗（不變式 2）。
    return element("li", {
      "data-testid": `tree-item-${row.uid}`, "data-uid": row.uid, "data-state": "error",
    }, [
      element("span", {
        class: "dot dot-error",
        "data-testid": "status-dot",
        "data-state": "error",
        title: row.error,
      }),
      element("span", { class: "name", text: row.name }),
      element("span", { class: "target", text: row.target }),
      element("span", {
        class: "state",
        "data-testid": "row-error",
        text: "錯誤",
        title: row.error,
      }),
    ]);
  }
  // 狀態色點在左，與草稿標記（右側，隨 T18 加入）分開——UI-ELEMENTS W2 的左側樹。
  // 說明於樹節點滑鼠停留時顯示（§7.4.4、#286）。
  const attributes = { "data-testid": `tree-item-${row.uid}`, "data-uid": row.uid };
  if (row.description) attributes.title = row.description;
  return element("li", attributes, [
    element("span", {
      class: `dot dot-${row.state}`,
      "data-testid": "status-dot",
      "data-state": row.state,
      title: STATE_TEXT[row.state] || row.state,
    }),
    element("span", { class: "name", text: row.name }),
    element("span", { class: "target", text: row.target }),
    element("span", { class: "state", text: STATE_TEXT[row.state] || row.state }),
  ]);
}

// 草稿標記在節點右側，與左側的狀態色點分開（§7.4.3、UI-ELEMENTS W2）：草稿與四種狀態正交，
// 一份「一致」的 config 可以同時有草稿。有沒有草稿以 GET /api/drafts 為準（#21）。
function rowNode(row) {
  const node = rowNodeBase(row);
  if (draftUids.has(row.uid)) {
    node.appendChild(element("span", {
      class: "dot dot-draft", "data-testid": "draft-dot", title: "有未進版的草稿",
    }));
  }
  return node;
}

function render() {
  if (loadError !== null) {
    // 載入失敗是黏性的：重畫 load-error，不讀 rows。否則搜尋輸入一觸發 render 就把錯誤
    // 蓋成空清單／過期清單，而「讀不到」與「沒有」該做的處置完全不同（不變式 2）。
    tree.replaceChildren(element("div", {
      class: "notice error",
      "data-testid": "load-error",
    }, [
      element("strong", { text: "讀不到 config 清單。" }),
      element("pre", { text: loadError }),
    ]));
    return;
  }

  const visible = rows.filter(matches);
  tree.replaceChildren();
  if (searchError !== null) {
    tree.appendChild(element("div", { class: "notice error", "data-testid": "search-error" }, [
      element("strong", { text: "搜尋失敗。" }),
      element("pre", { text: searchError }),
    ]));
    return;
  }

  if (!rows.length) {
    // 什麼都還沒納管是合法狀態，不是錯誤——說出來，而不是留一片空白讓人以為壞了。
    tree.appendChild(element("p", {
      class: "notice",
      "data-testid": "empty-state",
      text: "還沒有納管任何 config。",
    }));
    return;
  }
  if (!visible.length) {
    tree.appendChild(element("p", {
      class: "notice",
      "data-testid": "no-matches",
      text: "沒有符合的項目。",
    }));
    return;
  }

  if (treeLayout.value === "host") {
    // 依主機：第一層 hostname（依名字排序）、第二層群組。主機節點的色點彙總其下全部 config。
    for (const [hostname, rows_] of byHost(visible)) {
      const worst = worstState(rows_);
      tree.appendChild(element("section", {
        class: "host", "data-testid": `tree-host-${hostname}`,
      }, [
        element("h2", {}, [statusDot(worst), element("span", { text: hostname })]),
        ...byGroup(rows_).map(([group, items]) => groupNode(group, items)),
      ]));
    }
    return;
  }
  for (const [group, items] of byGroup(visible)) tree.appendChild(groupNode(group, items));
}

const treeLayout = document.querySelector("[data-testid='tree-layout']");
treeLayout.addEventListener("change", render);

function byHost(items) {
  const buckets = new Map();
  for (const row of items) {
    if (!buckets.has(row.hostname)) buckets.set(row.hostname, []);
    buckets.get(row.hostname).push(row);
  }
  return [...buckets.entries()].sort(([a], [b]) => a.localeCompare(b));
}

function statusDot(worst) {
  return element("span", {
    class: `dot dot-${worst}`, "data-testid": "group-status-dot", "data-state": worst,
    title: worst === "error" ? "有一筆判不出狀態" : STATE_TEXT[worst] || worst,
  });
}

function groupNode(group, items) {
  return element("section", {
    class: "group",
    "data-testid": `tree-group-${group}`,
  }, [
    element("h2", {}, [statusDot(worstState(items)), element("span", { text: group === UNGROUPED ? "未分群" : group })]),
    element("ul", {}, items.map(rowNode)),
  ]);
}

// 父節點彙總子節點最嚴重的狀態（§7.4.1）：偏離 > 未部署 > 一致；判不出狀態的（#214）排最前——
// 那一筆連比都比不了，比偏離更需要人先看。
const STATE_SEVERITY = ["error", "drift", "missing", "in_sync"];

function worstState(items) {
  const states = items.map((row) => (row.error ? "error" : row.state));
  return STATE_SEVERITY.find((state) => states.includes(state)) || "in_sync";
}

// 後端把清單檔／白名單設定執行期讀不了包成 {detail:{message,file}}，指名壞掉的檔與下一步
// （不變式 2，routes.py 的 _preflight_error）。這幾個 GET 載入器原樣取出該訊息，取不到才退回
// HTTP 狀態——否則使用者只看到籠統的「500 Internal Server Error」，後端特地結構化的可行動訊息
// 被丟掉，與同檔其餘 handler（identity／whitelist／browse／onboard 都呈現 detail）不一致（#252）。
async function loadErrorText(response) {
  const payload = await response.json().catch(() => null);
  const detail = payload && payload.detail;
  if (detail) return detailText(detail);
  return `${response.status} ${response.statusText}`;
}

async function load() {
  const generation = ++loadGeneration;
  try {
    const response = await fetch(`${API_BASE}/api/configs`);
    if (!response.ok) throw new Error(await loadErrorText(response));
    const data = await response.json();
    if (generation !== loadGeneration) return;  // 有更新的載入開始了，這次過時、丟棄
    rows = data;
    loadError = null;
    render();
    loadDrafts();
  } catch (error) {
    // 大聲失敗（不變式 2）：說出是什麼壞了，不是顯示一份空清單假裝沒事——空清單與「讀不到
    // 清單」看起來一樣，而那兩件事該做的處置完全不同。旗標讓錯誤黏住，經 render 重畫（見上）。
    if (generation !== loadGeneration) return;  // 過時的失敗不覆寫新結果
    loadError = String(error && error.message ? error.message : error);
    render();
  }
}

search.addEventListener("input", scheduleSearch);
searchScope.addEventListener("change", scheduleSearch);
// 手動「檢查差異」：重掃並說出結果。與一般的載入分開——開頁面時的自動載入不需要這一行回饋。
const rescanButton = document.querySelector("[data-testid='rescan']");
const scanStatus = document.querySelector("[data-testid='scan-status']");
const SCAN_PARTS = [["error", "份判不出狀態"], ["drift", "份偏離"], ["missing", "份未部署"]];

function setScanStatus(state, text) {
  scanStatus.dataset.state = state;
  scanStatus.textContent = text;
  scanStatus.hidden = false;
}

async function rescan() {
  rescanButton.disabled = true;
  setScanStatus("running", "檢查中…");
  try {
    await load();
    if (loadError !== null) {
      setScanStatus("failed", "檢查失敗：讀不到清單，原因見下方。修正後再按一次「檢查差異」。");
      return;
    }
    const counts = {};
    for (const row of rows) {
      const key = row.error ? "error" : row.state;
      counts[key] = (counts[key] || 0) + 1;
    }
    const found = SCAN_PARTS.filter(([key]) => counts[key]).map(([key, text]) => `${counts[key]} ${text}`);
    const at = new Date().toLocaleTimeString("zh-TW", { hour12: false });
    setScanStatus("done", `${at} 檢查完成，共 ${rows.length} 份：${found.length ? found.join("、") : "全部一致"}。`);
  } finally {
    rescanButton.disabled = false;
  }
}

rescanButton.addEventListener("click", rescan);

// ── W3 參數欄位表（#20）──────────────────────────────────────────────────────
// 這不是線上 YAML 編輯器（ADR-00000013、設計 §7.5）：一列一個參數，依型別給控制項——bool 核取方塊、
// int 整數步進、double 允許小數且顯示一定帶小數點、enum 下拉、string 文字框（引號由系統處理）。
// 型別與值都來自 GET /api/configs/{uid}（來源複本解析＋推斷），前端不猜。單擊左側樹節點開啟、一次
// 一份（#20 的 D1；雙擊與多開是 #35／#36）。型別欄兩種角色都是純文字（人工指定是 v0.7.0）。
// list 只列元素、唯讀（新增／移除／排序是 #46）；巢狀物件是可折疊區塊，內部葉照常可編輯（D3）。
// enum 的選項來自 schema（#40）：渲染器已支援 `options`，後端目前不會送——刻意留空，#40 接上。
const workspace = document.querySelector("[data-testid='workspace']");
// 介面上的型別名稱依設計 §7.5.1（double／object），API 的名稱（float／dict）留在 data-type。
const TYPE_LABEL = {
  bool: "bool", int: "int", float: "double", string: "string", enum: "enum",
  dict: "object", list: "list", null: "null", unknown: "unknown",
};
// 每次開啟遞增；晚到的舊回應不覆蓋新開的那份（同 load／browse 的世代守門，#252）。
let panelGeneration = 0;

// 單擊＝選取（高亮），雙擊＝展開到右側工作區堆疊（§7.4.1、#35）。
tree.addEventListener("click", (event) => {
  const item = event.target.closest("li[data-uid]");
  if (!item) return;
  for (const node of tree.querySelectorAll("li[aria-selected='true']")) node.removeAttribute("aria-selected");
  item.setAttribute("aria-selected", "true");
});
tree.addEventListener("dblclick", (event) => {
  const item = event.target.closest("li[data-uid]");
  if (item) openPanel(item.dataset.uid);
});

// ── 右側工作區的堆疊（#36）：每份 config 一個槽（data-uid），槽裡是欄位表／歷史／差異檢視之一，
// 新開的在最上面；各槽各自儲存／捨棄變更。返回（從歷史／差異回欄位表）只換那一槽，其餘不動。
const workspaceEmpty = document.querySelector("[data-testid='workspace-empty']");

function slotFor(uid) {
  return [...workspace.querySelectorAll("[data-uid]")].find((node) => node.dataset.uid === uid) || null;
}

function mountView(uid, view, kind) {
  view.dataset.uid = uid;
  view.dataset.view = kind;
  const existing = slotFor(uid);
  if (existing) existing.replaceWith(view);
  else workspace.prepend(view);
  refreshWorkspaceEmpty();
}

function closeSlot(uid) {
  const existing = slotFor(uid);
  if (existing) existing.remove();
  refreshWorkspaceEmpty();
}

function openUids() {
  return [...workspace.querySelectorAll("[data-uid][data-view='panel']")].map((node) => node.dataset.uid);
}

function refreshWorkspaceEmpty() {
  workspaceEmpty.hidden = workspace.querySelector("[data-uid]") !== null;
}

function mountNotice(node) {
  const previous = workspace.querySelector(`[data-testid='${node.dataset.testid}']`);
  if (previous) previous.replaceWith(node);
  else workspace.prepend(node);
}

const panelGenerations = new Map();  // 每份 config 自己的世代（晚到的舊回應不覆蓋新開的）

async function openPanel(uid, notice) {
  const generation = (panelGenerations.get(uid) || 0) + 1;
  panelGenerations.set(uid, generation);
  if (!slotFor(uid)) {
    mountView(uid, element("p", {
      class: "notice", "data-testid": "panel-loading", text: "載入中…",
    }), "loading");
  }
  try {
    const response = await fetch(`${API_BASE}/api/configs/${encodeURIComponent(uid)}`);
    if (!response.ok) throw new Error(await loadErrorText(response));
    const detail = await response.json();
    if (generation !== panelGenerations.get(uid)) return;
    const panel = panelNode(detail);
    if (notice) panel.insertBefore(notice, panel.children[1] || null);  // 上一個動作的結果放在標頭下
    mountView(uid, panel, "panel");
  } catch (error) {
    if (generation !== panelGenerations.get(uid)) return;
    // 大聲失敗（不變式 2）：說出讀不到，不留一個空表假裝這份 config 沒有參數。
    mountView(uid, element("div", {
      class: "notice error", "data-testid": `panel-error-${uid}`,
    }, [
      element("strong", { text: "讀不到這份 config 的內容。" }),
      element("pre", { text: String(error && error.message ? error.message : error) }),
    ]));
  }
}

function panelNode(detail) {
  const row = rows.find((item) => item.uid === detail.uid);
  const state = row ? (row.error ? "錯誤" : STATE_TEXT[row.state] || row.state) : "";
  const close = element("button", {
    type: "button", class: "panel-close", "data-testid": "panel-close", title: "關閉這個區塊", text: "×",
  });
  // 解除納管（#287）：放在標頭，沒有欄位表的 raw 也拿得到；唯讀時不出現。
  const unmanageButton = element("button", {
    type: "button", class: "panel-unmanage editing-only", "data-testid": "panel-unmanage",
    title: "不再管理這份檔案（目標檔案保留）", text: "解除納管",
  });
  // 屬性（#286）：僅開發者——按鈕不在 DOM 裡，不是停用（ADR-00000020）。放在標頭，raw 也拿得到。
  const canEditAttributes = currentIdentity && currentIdentity.role === "developer";
  const attributesButton = canEditAttributes ? element("button", {
    type: "button", class: "panel-attributes editing-only", "data-testid": "panel-attributes",
    title: "修改名稱、群組、主機、說明", text: "屬性",
  }) : null;
  let hasUnsavedEdits = () => false;  // 有欄位表時換成真的（見下）
  const head = element("div", { class: "panel-head", "data-testid": "panel-head" }, [
    element("span", { class: "name", text: detail.name }),
    element("span", { class: "target", text: detail.target }),
    element("span", { class: "state", "data-testid": `panel-status-${detail.uid}`, text: state }),
    element("span", {
      class: "panel-draft", "data-testid": `panel-draft-${detail.uid}`, text: "● 草稿",
    }),
    ...(attributesButton ? [attributesButton] : []),
    unmanageButton,
    close,
  ]);
  const panel = element("section", { class: "panel", "data-testid": `panel-${detail.uid}` }, [head]);
  // 標頭單擊折疊／展開這一塊（右側以可折疊區塊堆疊，§7.4.1）；× 關閉這一槽。
  head.addEventListener("click", (event) => {
    if (event.target.closest("button")) return;
    panel.dataset.collapsed = panel.dataset.collapsed === "true" ? "false" : "true";
  });
  close.addEventListener("click", () => closeSlot(detail.uid));
  unmanageButton.addEventListener("click", () => unmanageConfig(detail));
  if (attributesButton) {
    attributesButton.addEventListener("click", () => {
      const open = panel.querySelector(`[data-testid='attributes-${detail.uid}']`);
      if (open) open.remove();
      else head.after(attributesPanel(detail, () => hasUnsavedEdits()));
    });
  }
  const draftMark = panel.querySelector(`[data-testid='panel-draft-${detail.uid}']`);
  draftMark.hidden = !detail.draft_values;
  if (detail.format === "raw") {
    // raw 是唯一不受把關的格式——明確標示「未驗證」，使用者看得到自己放棄了什麼（§3.4）。
    head.insertBefore(element("span", {
      class: "panel-unvalidated", "data-testid": `panel-unvalidated-${detail.uid}`,
      title: "raw：只版控、不解析——內容不經任何檢查", text: "未驗證",
    }), close);
  } else if (detail.schema) {
    head.insertBefore(schemaBadge(detail.uid, detail.schema), close);
  }
  if (row && row.state === "drift") panel.appendChild(driftBanner(detail, true));
  if (detail.schema_error) {
    // schema 讀不出來（#40）：值照樣看得到，但明說這份在修好之前存不了——不讓人改了半天才被擋。
    panel.appendChild(element("div", { class: "notice error", "data-testid": "panel-schema-error" }, [
      element("strong", { text: "這份的 schema 讀不出來，修好之前改動存不了。" }),
      element("pre", { text: detail.schema_error }),
    ]));
  }
  const structured = detail.values && typeof detail.values === "object" && !Array.isArray(detail.values);
  if (detail.format === "raw" || !structured) {
    // §7.5.4：沒有結構就明說「未結構化」——使用者看得到自己失去了型別保護（不變式 2）。
    panel.appendChild(element("p", {
      class: "notice", "data-testid": "panel-unstructured",
      text: detail.format === "raw"
        ? "raw：只版控、不解析——這份 config 沒有欄位表（未結構化）。"
        : "這份 config 的頂層不是物件，無法以欄位表呈現（未結構化）。",
    }));
    return panel;
  }
  // 儲存＝存為草稿：不記錄、不寫出（§7.4.3、T18）。驗證未過時停用；沒有任何改動也停用。
  const saveButton = element("button", {
    type: "button", class: "panel-save editing-only", "data-testid": "panel-save", text: "儲存",
  });
  saveButton.disabled = true;
  const saveError = element("div", {
    class: "notice error panel-save-error", "data-testid": "panel-save-error",
  });
  saveError.hidden = true;
  const entries = [];
  hasUnsavedEdits = () => entries.some((entry) => entry.node.dataset.dirty === "true");
  // 人工指定型別（#285）：僅開發者、且拿得到編輯階段（唯讀分頁沒有身分）。
  const specify = currentIdentity && currentIdentity.role === "developer"
    ? (row, typeName, reset) => specifyType(detail, row, typeName, { entries, error: saveError, reset })
    : null;
  const refreshSave = () => {
    const invalid = entries.some((entry) => entry.node.dataset.valid === "false");
    const dirty = entries.some((entry) => entry.node.dataset.dirty === "true");
    saveButton.disabled = invalid || !dirty;
  };
  const list = element("ul", { class: "param-table", "data-testid": "param-table" }, [
    element("li", { class: "param-row param-head" }, [
      element("span", { class: "param-name", text: "參數" }),
      element("span", { class: "param-type", text: "型別" }),
      element("span", { class: "param-value-wrap", text: "值" }),
      element("span", { class: "param-source", text: "來源值" }),
      element("span", { class: "param-validation", text: "驗證" }),
    ]),
    ...paramRows(detail).map((row) => paramRow(row, entries, refreshSave, specify)),
  ]);
  if (specify) list.dataset.specifiable = "true";
  list.addEventListener("click", (event) => {
    const container = event.target.closest("li[data-container='true']");
    if (container) toggleCollapse(list, container);
  });
  // 捨棄變更（單一 config）：清掉這份的草稿、回到來源內容；只有有草稿時才出現（#22）。
  const discardButton = element("button", {
    type: "button", class: "editing-only", "data-testid": "panel-discard", text: "捨棄變更",
  });
  discardButton.hidden = !detail.draft_values;
  discardButton.addEventListener("click", () => discardDrafts(detail.uid, detail.name));
  saveButton.addEventListener("click", () => {
    saveDraft(detail, entries, {
      save: saveButton, error: saveError, draft: draftMark, discard: discardButton,
    });
  });
  // 歷史（W4，#25）：這份 config 的變更紀錄，右側工作區切成歷史檢視、左側樹不動。
  const historyButton = element("button", {
    type: "button", "data-testid": "panel-history", text: "歷史",
  });
  historyButton.addEventListener("click", () => openHistory(detail));
  // 產生 schema 骨架（#38）：僅開發者、還沒有 schema 的才出現——不在 DOM 裡，不是停用（ADR-00000020）。
  const actions = [historyButton];
  if (!detail.schema && currentIdentity && currentIdentity.role === "developer") {
    const schemaButton = element("button", {
      type: "button", class: "editing-only", "data-testid": "panel-schema-draft", text: "產生 schema",
    });
    schemaButton.addEventListener("click", () => {
      draftSchema(detail, { button: schemaButton, error: saveError, head, close });
    });
    actions.push(schemaButton);
  }
  // 搜尋命中的參數：標示那幾列，並把第一列捲進視野（「展開時定位到該列」，§7.4.2）。
  const hits = hitParams.get(detail.uid) || [];
  let firstHit = null;
  for (const path of hits) {
    const hitRow = [...list.querySelectorAll("li[data-name]")].find((node) => node.dataset.name === path);
    if (!hitRow) continue;
    hitRow.dataset.hit = "true";
    firstHit = firstHit || hitRow;
  }
  if (firstHit) queueMicrotask(() => firstHit.scrollIntoView({ block: "center" }));
  panel.append(list, saveError, element("div", { class: "panel-actions" }, [
    ...actions,
    element("span", { class: "hint", text: "「儲存」只是存為草稿——不記錄、不寫到目標；工具列的「進版」才會。" }),
    discardButton,
    saveButton,
  ]));
  refreshSave();
  return panel;
}

// 屬性面板（§7.4.4、#286）：名稱、群組（可多個）、主機、說明。從區塊標頭展開，僅開發者。
// 儲存後樹依新的群組／主機重建（load），這一塊重畫；重畫會丟掉還沒儲存的參數改動，所以有的話
// 先擋下、說清楚（不變式 2）。後端指名是哪一項不合法時，標在那個輸入框。
const ATTRIBUTE_FIELDS = [
  ["name", "名稱", ""],
  ["groups", "群組", "可多個，以逗號分隔；留空＝未分群"],
  ["hostname", "主機", ""],
  ["description", "說明", "用途說明，滑鼠停在樹節點上時顯示"],
];

function attributesPanel(detail, hasUnsavedEdits) {
  const inputs = {};
  const rows = ATTRIBUTE_FIELDS.map(([key, label, hint]) => {
    const value = key === "groups" ? (detail.groups || []).join(", ") : detail[key] || "";
    inputs[key] = element("input", { type: "text", value, placeholder: hint });
    return element("label", {}, [element("span", { text: label }), inputs[key]]);
  });
  const error = element("div", { class: "notice error", "data-testid": "attributes-error" });
  error.hidden = true;
  const save = element("button", { type: "button", "data-testid": "attributes-save", text: "儲存屬性" });
  const cancel = element("button", { type: "button", "data-testid": "attributes-cancel", text: "取消" });
  const form = element("div", { class: "attributes", "data-testid": `attributes-${detail.uid}` }, [
    ...rows,
    element("span", { class: "hint", text: "屬性的修改會留一筆變更紀錄，與參數內容的修改分開。改名不影響歷史與草稿。" }),
    error,
    element("div", { class: "attributes-actions" }, [cancel, save]),
  ]);
  cancel.addEventListener("click", () => form.remove());
  save.addEventListener("click", () => saveAttributes(detail, { inputs, error, save, hasUnsavedEdits }));
  return form;
}

async function saveAttributes(detail, ui) {
  for (const input of Object.values(ui.inputs)) input.removeAttribute("aria-invalid");
  ui.error.hidden = true;
  if (ui.hasUnsavedEdits()) {
    renderSaveError(ui.error, "這一塊有還沒儲存的參數改動。下一步：先儲存或改回原值，再儲存屬性——儲存屬性會重畫這一塊。");
    return;
  }
  const body = {
    name: ui.inputs.name.value,
    hostname: ui.inputs.hostname.value,
    groups: ui.inputs.groups.value.split(/[,，、]/).map((group) => group.trim()).filter(Boolean),
    description: ui.inputs.description.value,
  };
  ui.save.disabled = true;
  try {
    const response = await fetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/attributes`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const payload = await response.json();
    if (!response.ok) {
      renderSaveError(ui.error, payload.detail);
      const field = payload.detail && payload.detail.field;
      if (field && ui.inputs[field]) ui.inputs[field].setAttribute("aria-invalid", "true");
      return;
    }
    load();  // 樹依新的群組／主機／名稱重建
    openPanel(detail.uid, element("p", {
      class: "notice", "data-testid": "attributes-saved-notice",
      text: "已更新屬性，並記一筆變更紀錄。",
    }));
  } catch (error) {
    renderSaveError(ui.error, `送不出去：${error && error.message ? error.message : error}`);
  } finally {
    ui.save.disabled = false;
  }
}

// 指定或清除一個參數的型別（#285）。型別一變，那一列的輸入控制項也要換，所以成功後重畫這一塊；
// 重畫會丟掉還沒儲存的改動，因此有未儲存的改動時先擋下、說清楚，不悄悄丟（不變式 2）。
async function specifyType(detail, row, typeName, ui) {
  ui.error.hidden = true;
  if (ui.entries.some((entry) => entry.node.dataset.dirty === "true")) {
    renderSaveError(ui.error, "這一塊有還沒儲存的改動。下一步：先儲存或改回原值，再改型別——改型別會重畫這張表。");
    ui.reset();
    return;
  }
  try {
    const response = await fetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/types`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ path: row.path, type: typeName }),
    });
    const payload = await response.json();
    if (!response.ok) {
      renderSaveError(ui.error, payload.detail);
      ui.reset();
      return;
    }
    openPanel(detail.uid, element("p", {
      class: "notice", "data-testid": "type-specified-notice",
      text: typeName === null
        ? `已清除「${row.path}」的型別指定，並記一筆變更紀錄。`
        : `已把「${row.path}」的型別指定為 ${TYPE_LABEL[typeName]}，並記一筆變更紀錄。`,
    }));
  } catch (error) {
    renderSaveError(ui.error, `送不出去：${error && error.message ? error.message : error}`);
    ui.reset();
  }
}

function schemaBadge(uid, path) {
  return element("span", {
    class: "panel-schema", "data-testid": `panel-schema-${uid}`,
    title: `修改會依 ${path} 檢查型別`, text: "有 schema",
  });
}

// 產生 schema 骨架（#38）。不可悄悄開啟一道把關：先說會發生什麼。成功後就地換上標示、拿掉按鈕，
// **不重畫欄位表**——還沒儲存的改動不能因此消失（不變式 2）。
async function draftSchema(detail, ui) {
  const ok = await confirmAction(
    `替「${detail.name}」產生 schema？`,
    "會依目前的值記下每個參數的型別，存進設定庫的 .schemas/ 並留一筆變更紀錄。"
      + "之後這份 config 的修改會依它檢查型別。只記型別，不限制必填、多出來的參數或數值範圍。",
  );
  if (!ok) return;
  ui.error.hidden = true;
  ui.button.disabled = true;
  try {
    const response = await fetch(
      `${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/schema`, { method: "POST" },
    );
    const payload = await response.json();
    if (!response.ok) {
      renderSaveError(ui.error, payload.detail);
      return;
    }
    detail.schema = payload.schema;
    ui.button.remove();
    ui.head.insertBefore(schemaBadge(detail.uid, payload.schema), ui.close);
    ui.head.after(element("p", {
      class: "notice", "data-testid": "schema-drafted-notice",
      text: `已產生 schema（${payload.schema}），並記一筆變更紀錄。`,
    }));
  } catch (error) {
    renderSaveError(ui.error, `送不出去：${error && error.message ? error.message : error}`);
  } finally {
    ui.button.disabled = false;
  }
}

// 後端回的問題若指名了欄位（第 2 層帶 `path`，#39），就標在那一列：標紅、寫出原因與修正建議
// （§7.5.1）。介面沒擋到、後端擋下的（例如 schema 的 pattern）靠這個讓人知道是哪一列。那一列再被
// 改動時由 refreshParamRow 重算，標記自然清掉。
function markServerProblems(entries, problems) {
  for (const problem of problems || []) {
    const entry = problem.path && entries.find((candidate) => candidate.row.path === problem.path);
    if (!entry) continue;
    entry.node.dataset.valid = "false";
    entry.node.querySelector("[data-testid='param-validation']").textContent =
      `${problem.message}。建議：${problem.suggestion}`;
  }
}

function markedInvalid(entries) {
  return entries.some((entry) => entry.node.dataset.valid === "false");
}

// 送出的是相對**來源**的全部改動（後端以來源複本為底重建草稿文字），不是相對上一份草稿的差量。
async function saveDraft(detail, entries, ui) {
  const edits = {};
  for (const { row, control } of entries) {
    const current = currentValue(control, row);
    if (displayValue(current, row.type) !== displayValue(row.value, row.type)) edits[row.path] = current;
  }
  ui.error.hidden = true;
  ui.save.disabled = true;
  try {
    const response = await fetch(`${API_BASE}/api/drafts`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ uid: detail.uid, edits }),
    });
    const payload = await response.json();
    if (!response.ok) {
      renderSaveError(ui.error, payload.detail);
      markServerProblems(entries, payload.detail && payload.detail.problems);
      ui.save.disabled = markedInvalid(entries);
      return;
    }
    setDrafts(payload.drafts.map((draft) => draft.uid));  // 樹上的草稿標記、工具列的計數
    for (const entry of entries) entry.row.baseline = currentValue(entry.control, entry.row);
    for (const entry of entries) entry.refresh();  // 畫面＝已存的草稿：不再 dirty、儲存回到停用
    ui.draft.hidden = !draftUids.has(detail.uid);
    ui.discard.hidden = !draftUids.has(detail.uid);
  } catch (error) {
    renderSaveError(ui.error, `送不出去：${error && error.message ? error.message : error}`);
    ui.save.disabled = false;
  }
}

// 第 1 層沒過的 422 是結構化的 {message, uid, problems:[{line, message, suggestion}]}；逐條列出
// 行號／原因／建議（三要素），不改寫。其他形狀（字串、FastAPI 驗證 list）原樣顯示。
// 一個驗證問題的一行說明。第 2 層（schema）的問題不一定給得出行號——給不出就不印「第 null 行」，
// 訊息本身已經指名欄位（#39）。
function problemText(problem) {
  const where = problem.line === null || problem.line === undefined ? "" : `第 ${problem.line} 行：`;
  return `${where}${problem.message}。建議：${problem.suggestion}`;
}

function renderSaveError(target, detail) {
  target.replaceChildren();
  if (detail && typeof detail === "object" && !Array.isArray(detail) && detail.message) {
    target.appendChild(element("strong", { text: detail.message }));
    target.appendChild(element("ul", {}, (detail.problems || []).map((problem) => element("li", {
      text: problemText(problem),
    }))));
  } else if (Array.isArray(detail)) {
    target.appendChild(element("strong", {
      text: detail.map((item) => item.msg || JSON.stringify(item)).join("；"),
    }));
  } else {
    target.appendChild(element("strong", { text: String(detail) }));
  }
  target.hidden = false;
}

// 前序走訪值樹，配上 types 裡的型別（list 元素的型別鍵是 `path[]`，值的路徑是 `path[i]`）。
// key 裡的字面點跳脫成 \.（#219），路徑文法與 set_value 一致（`a.b\.c[2]`）。
function paramRows(detail) {
  const out = [];
  const escape = (key) => String(key).replace(/\./g, "\\.");
  // value 是來源值（「來源值」欄、改動的比較基準）；draft 是草稿裡對應的值（有草稿時當「目前值」的
  // 起點，#21）。兩棵樹並行走訪，草稿樹缺該路徑就退回來源值。
  const drafts = detail.draft_values;
  const walk = (value, draft, path, typePath, depth, name, readonly) => {
    const type = detail.types[typePath] || "unknown";
    const container = type === "dict" || type === "list";
    const baseline = draft === undefined ? value : draft;
    // schema 對這個欄位的提示（範圍／步進／列舉選項／說明，#40）；沒有 schema 或沒有提示就是 null。
    const hint = (!container && (detail.constraints || {})[typePath]) || null;
    // 這個欄位的型別是不是人工指定的（#285）；清單元素不能個別指定。
    const manual = !readonly && Boolean((detail.manual_types || {})[typePath]);
    out.push({ path, type, value, baseline, depth, name, container, readonly, hint, manual });
    if (type === "dict") {
      for (const [key, child] of Object.entries(value)) {
        const draftChild = draft && typeof draft === "object" ? draft[key] : undefined;
        walk(child, draftChild, `${path}.${escape(key)}`, `${typePath}.${escape(key)}`, depth + 1, key, readonly);
      }
    } else if (type === "list") {
      value.forEach((child, index) => {
        const draftChild = Array.isArray(draft) ? draft[index] : undefined;
        walk(child, draftChild, `${path}[${index}]`, `${typePath}[]`, depth + 1, `[${index}]`, true);
      });
    }
  };
  for (const [key, value] of Object.entries(detail.values)) {
    const draft = drafts && typeof drafts === "object" ? drafts[key] : undefined;
    walk(value, draft, escape(key), escape(key), 0, key, false);
  }
  return out;
}

// double 顯示一定帶小數點（`5` → `5.0`）——擋 ROS 2 的 1 vs 1.0 型別錯誤（§7.5.2）。
function formatDouble(number) {
  return Number.isInteger(number) ? number.toFixed(1) : String(number);
}

function displayValue(value, type) {
  if (type === "float") return formatDouble(value);
  if (value === null || typeof value === "object") return JSON.stringify(value);
  return String(value);
}

// 列舉（#40）：選項來自 schema，結構上不可能選到不存在的值（§7.5.2）。目前的值若不在選項裡
// （schema 是後來才收緊的），另列一個標明「不在允許的值裡」的選項並把這一列標成有問題——不悄悄
// 換成第一個選項（那等於替人改了值）。`choices` 與選項一一對應，取值時拿回原本型別的值。
function enumControl(row) {
  const choices = [...row.hint.enum];
  const labels = choices.map((choice) => displayValue(choice, row.type));
  let selected = choices.findIndex((choice) =>
    displayValue(choice, row.type) === displayValue(row.baseline, row.type));
  if (selected < 0) {
    choices.unshift(row.baseline);
    labels.unshift(`${displayValue(row.baseline, row.type)}（不在允許的值裡）`);
    selected = 0;
  }
  const control = element("select", {}, labels.map((label, index) =>
    element("option", { value: String(index), text: label })));
  if (choices.length > row.hint.enum.length) control.options[0].dataset.outside = "true";
  control.selectedIndex = selected;
  control.choices = choices;
  return control;
}

// 數值範圍（#40）：輸入框套 min／max／step（§7.5.2）。只設上下界與步進的屬性供瀏覽器的增減鈕用；
// 「合不合」由 refreshParamRow 自己算——瀏覽器的步進檢查以 min 為起點，與 schema 的倍數語意不同。
function applyRange(control, hint) {
  if (!hint) return;
  const low = hint.minimum ?? hint.exclusiveMinimum;
  const high = hint.maximum ?? hint.exclusiveMaximum;
  if (low !== undefined) control.min = String(low);
  if (high !== undefined) control.max = String(high);
  if (hint.multipleOf !== undefined) control.step = String(hint.multipleOf);
}

function valueControl(row) {
  let control;
  const hasChoices = row.hint && Array.isArray(row.hint.enum) && row.type !== "bool";
  switch (hasChoices ? "enum" : row.type) {
    case "bool":
      control = element("input", { type: "checkbox" });
      control.checked = row.baseline === true;
      break;
    case "int":
      control = element("input", { type: "number", step: "1", value: String(row.baseline) });
      applyRange(control, row.hint);
      break;
    case "float":
      control = element("input", { type: "number", step: "any", value: formatDouble(row.baseline) });
      applyRange(control, row.hint);
      break;
    case "enum":
      control = enumControl(row);
      break;
    case "string":
      control = element("input", { type: "text", value: row.baseline });  // 引號由系統處理
      break;
    default:
      // 型別未知（null／空陣列元素…）：唯讀顯示原樣，標示未結構化（§7.5.4），不假裝可編輯。
      control = element("input", { type: "text", value: displayValue(row.baseline, row.type), readonly: "" });
  }
  control.setAttribute("data-testid", "param-value");
  if (row.readonly) {
    // list 元素唯讀：新增／移除／排序是 #46，改值也留到那時一起做（D3）。
    if (control.type === "checkbox" || control.tagName === "SELECT") control.disabled = true;
    else control.setAttribute("readonly", "");
    control.title = "陣列元素的編輯留待陣列編輯功能（#46）";
  }
  return control;
}

// 型別欄（§7.5.3、#285）。開發者對單一參數看到的是下拉選單——選了就把那個型別人工指定下去；
// 其餘情況（一般使用者、唯讀、容器、清單元素、型別未知）是純文字，選單根本不在 DOM 裡。
// 人工指定過的列標「已指定」（誰都看得到），開發者另有「清除」（逐欄位，回到指定之前）。
const SPECIFIABLE = ["int", "float", "bool", "string"];

function typeCell(row, specify) {
  const label = row.hint && Array.isArray(row.hint.enum)
    ? TYPE_LABEL.enum : TYPE_LABEL[row.type] || row.type;
  const cell = element("span", { class: "param-type" });
  const choosable = specify && !row.container && !row.readonly && SPECIFIABLE.includes(row.type);
  if (choosable) {
    // 唯讀（沒拿到編輯階段、或階段中途失效）時選單不出現，改顯示純文字——會寫入的控制項一律如此。
    const select = element("select", {
      class: "editing-only", "data-testid": "param-type", title: "指定這個參數的型別",
    }, SPECIFIABLE.map((name) => element("option", { value: name, text: TYPE_LABEL[name] })));
    select.value = row.type;
    select.addEventListener("change", () => specify(row, select.value, () => { select.value = row.type; }));
    cell.append(select, element("span", {
      class: "readonly-only", "data-testid": "param-type-text", text: label,
    }));
  } else {
    cell.appendChild(element("span", { "data-testid": "param-type", text: label }));
  }
  if (row.manual) {
    cell.appendChild(element("span", {
      class: "type-overridden", "data-testid": "type-overridden",
      title: "這個型別是人工指定的，不是系統推斷的", text: "已指定",
    }));
    if (specify) {
      const clearButton = element("button", {
        type: "button", class: "type-clear editing-only", "data-testid": "type-clear",
        title: "清除這一欄的型別指定，回到指定之前", text: "清除",
      });
      clearButton.addEventListener("click", () => specify(row, null, () => {}));
      cell.appendChild(clearButton);
    }
  }
  return cell;
}

function paramRow(row, entries, onChange, specify) {
  const attributes = {
    class: "param-row",
    "data-testid": `param-${row.path}`,
    "data-name": row.path,
    "data-type": row.type,
    "data-depth": String(row.depth),
  };
  if (row.container) attributes["data-container"] = "true";
  const node = element("li", attributes, [
    element("span", {
      class: "param-name",
      text: `${"　".repeat(row.depth)}${row.container ? "▾ " : ""}${row.name}`,
    }),
    typeCell(row, specify),
  ]);
  if (row.container) return node;
  if (row.hint && row.hint.description) {
    // schema 的說明顯示在欄位旁，滑鼠停留看得到全文（§7.5.1）。
    const name = node.querySelector(".param-name");
    name.title = row.hint.description;
    name.appendChild(element("span", {
      class: "param-description", "data-testid": "param-description",
      title: row.hint.description, "aria-label": row.hint.description, text: " ⓘ",
    }));
  }
  const control = valueControl(row);
  const source = element("span", {
    class: "param-source", "data-testid": "param-source-value", text: displayValue(row.value, row.type),
  });
  const validation = element("span", { class: "param-validation", "data-testid": "param-validation" });
  node.append(element("span", { class: "param-value-wrap" }, [control]), source, validation);
  const refresh = () => {
    refreshParamRow(node, control, row, source, validation);
    if (onChange) onChange();
  };
  if (entries) entries.push({ row, control, node, refresh });
  control.addEventListener("input", refresh);
  control.addEventListener("change", () => {
    // double：離開欄位時把整數樣子的輸入正規化成帶小數點（打字中不動，否則沒法打出 52）。
    if (row.type === "float" && control.value !== "" && !control.validity.badInput) {
      control.value = formatDouble(Number(control.value));
    }
    refresh();
  });
  refresh();  // 一開始就標好 data-valid／data-changed，讓「尚未改動」與「改成一樣的值」是同一個狀態
  return node;
}

function currentValue(control, row) {
  if (control.choices) return control.choices[control.selectedIndex];
  if (row.type === "bool") return control.checked;
  if (row.type === "int" || row.type === "float") return Number(control.value);
  return control.value;
}

// 值相對 schema 的範圍／倍數（#40）。回原因與修法；合格回空字串。倍數以容許誤差比（0.3 ÷ 0.1 在
// 浮點數上不是整數）。
function rangeProblem(number, hint) {
  if (!hint) return "";
  if (hint.minimum !== undefined && number < hint.minimum) return `超出範圍：不可小於 ${hint.minimum}`;
  if (hint.maximum !== undefined && number > hint.maximum) return `超出範圍：不可大於 ${hint.maximum}`;
  if (hint.exclusiveMinimum !== undefined && number <= hint.exclusiveMinimum) {
    return `超出範圍：必須大於 ${hint.exclusiveMinimum}`;
  }
  if (hint.exclusiveMaximum !== undefined && number >= hint.exclusiveMaximum) {
    return `超出範圍：必須小於 ${hint.exclusiveMaximum}`;
  }
  if (hint.multipleOf !== undefined) {
    const ratio = number / hint.multipleOf;
    if (Math.abs(ratio - Math.round(ratio)) > 1e-9) return `必須是 ${hint.multipleOf} 的倍數`;
  }
  return "";
}

function localProblem(control, row) {
  if (control.choices) {
    const outside = control.selectedOptions[0] && control.selectedOptions[0].dataset.outside;
    return outside ? "目前的值不在允許的值裡，請改選一個" : "";
  }
  if (row.type !== "int" && row.type !== "float") return "";
  if (control.validity.badInput) return row.type === "int" ? "必須是整數，不接受小數或文字" : "必須是數字";
  if (control.value === "") return "不可為空";
  const number = Number(control.value);
  if (row.type === "int" && !Number.isInteger(number)) return "必須是整數，不接受小數或文字";
  return rangeProblem(number, row.hint);
}

function refreshParamRow(node, control, row, source, validation) {
  const problem = localProblem(control, row);
  validation.textContent = problem;
  node.dataset.valid = problem ? "false" : "true";
  const current = displayValue(currentValue(control, row), row.type);
  const changed = current !== displayValue(row.value, row.type);  // 相對來源（「來源值」欄標色）
  node.dataset.changed = String(changed);
  node.dataset.dirty = String(current !== displayValue(row.baseline, row.type));  // 相對已存的草稿
  if (changed) source.setAttribute("data-changed", "true");
  else source.removeAttribute("data-changed");
}

function toggleCollapse(list, container) {
  // 折疊狀態記在容器身上，再依「任一祖先折疊了嗎」重算每列可見性（與 W8 型別樹同一做法）。
  container.dataset.collapsed = container.dataset.collapsed === "true" ? "false" : "true";
  const collapsed = [...list.querySelectorAll("li[data-container='true']")]
    .filter((node) => node.dataset.collapsed === "true")
    .map((node) => node.dataset.name);
  for (const node of list.querySelectorAll("li[data-name]")) {
    const name = node.dataset.name;
    const hidden = collapsed.some(
      (prefix) => name !== prefix && (name.startsWith(`${prefix}.`) || name.startsWith(`${prefix}[`))
    );
    node.classList.toggle("is-collapsed-child", hidden);
  }
}

// ── W4 歷史（#25／#26）───────────────────────────────────────────────────────
// 使用者看到的是行為，不是代號（§7.6.1）：內部類型只在這張表裡對應成中文，列表上不出現
// cfg／revert／import 這些字。左列表／右差異（圖 13）；差異以參數為單位（§7.6.2）：哪個參數從什麼
// 變成什麼，與 W3 的欄位表語言、顏色一致（改動＝偏離紅）。「當前版本」＝來源複本現況。
const KIND_TEXT = {
  import: "納入管理", cfg: "修改參數", revert: "退回舊版本",
  adopt: "採納現場調整", meta: "調整設定", unmanage: "解除管理",
};
const ALL_KINDS = Object.keys(KIND_TEXT).join(",");
let historyGeneration = 0;

function formatTime(iso) {
  const parsed = new Date(iso);
  return Number.isNaN(parsed.getTime()) ? iso : parsed.toLocaleString("zh-TW", { hour12: false });
}

// 行為描述之外的說明：退回舊版本附「退回到哪一版」（§7.6.1），其餘直接用紀錄的說明。
function describeChange(change) {
  if (change.kind === "revert") {
    const matched = /rollback to ([0-9a-f]+)/.exec(change.summary);
    if (matched) return `退回到版本 ${matched[1]}`;
  }
  return change.summary;
}

function openHistory(detail, notice) {
  const generation = ++historyGeneration;
  const back = element("button", { type: "button", "data-testid": "history-back", text: "返回欄位表" });
  back.addEventListener("click", () => openPanel(detail.uid));
  const filter = element("div", { class: "history-filter", "data-testid": "history-filter", role: "group" }, [
    element("button", { type: "button", "data-filter": "content", "aria-pressed": "true", text: "只看內容變更" }),
    element("button", { type: "button", "data-filter": "all", "aria-pressed": "false", text: "全部" }),
  ]);
  const view = element("section", { class: "panel history", "data-testid": `history-${detail.uid}` }, [
    element("div", { class: "panel-head" }, [
      element("span", { class: "name", text: `歷史　${detail.name}` }),
      element("span", { class: "target", text: detail.target }),
      back,
    ]),
    filter,
    element("p", { class: "notice", "data-testid": "history-notice", text: notice || "" }),
    element("div", { class: "history-body" }, [
      element("ul", { class: "history-list", "data-testid": "history-list" }),
      element("div", { class: "history-diff", "data-testid": "history-diff" }, [
        element("p", { class: "notice", text: "選一筆變更，這裡顯示它與目前版本的差異（以參數為單位）。" }),
      ]),
    ]),
  ]);
  filter.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-filter]");
    if (!button) return;
    for (const option of filter.querySelectorAll("button[data-filter]")) {
      option.setAttribute("aria-pressed", String(option === button));
    }
    loadHistory(view, detail, button.dataset.filter, ++historyGeneration);
  });
  view.querySelector("[data-testid='history-notice']").hidden = !notice;
  mountView(detail.uid, view, "history");
  loadHistory(view, detail, "content", generation);
}

async function loadHistory(view, detail, filter, generation) {
  const list = view.querySelector("[data-testid='history-list']");
  list.replaceChildren(element("li", { class: "notice", text: "載入中…" }));
  const query = filter === "all" ? `?prefix=${ALL_KINDS}` : "";
  try {
    const response = await fetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/history${query}`);
    if (!response.ok) throw new Error(await loadErrorText(response));
    const changes = await response.json();
    if (generation !== historyGeneration) return;
    list.replaceChildren(...changes.map((change) => historyEntry(change, detail, view)));
    if (!changes.length) {
      list.appendChild(element("li", {
        class: "notice", "data-testid": "history-empty",
        text: filter === "all"
          ? "這份 config 還沒有任何變更紀錄。"
          : "沒有內容變更的紀錄；切到「全部」可看到其他類型（納入管理、退回舊版本…）。",
      }));
    }
  } catch (error) {
    if (generation !== historyGeneration) return;
    list.replaceChildren(element("li", { class: "notice error", "data-testid": "history-error" }, [
      element("strong", { text: "讀不到變更歷史。" }),
      element("pre", { text: String(error && error.message ? error.message : error) }),
    ]));
  }
}

function historyEntry(change, detail, view) {
  const author = change.author.replace(/\s*<[^>]*>$/, "");  // 列表只顯示姓名；email 在 title
  const node = element("li", {
    class: "history-entry", "data-testid": `history-entry-${change.sha}`, "aria-selected": "false",
  }, [
    element("span", { class: "history-kind", text: KIND_TEXT[change.kind] || "變更" }),
    element("span", { class: "history-summary", text: describeChange(change) }),
    element("span", { class: "history-meta" }, [
      element("span", { "data-testid": "history-author", text: author, title: change.author }),
      element("time", { "data-testid": "history-time", datetime: change.at, text: formatTime(change.at) }),
    ]),
  ]);
  node.addEventListener("click", () => selectChange(view, detail, change, node));
  return node;
}

async function selectChange(view, detail, change, node) {
  const generation = ++historyGeneration;
  for (const entry of view.querySelectorAll("li[data-testid^='history-entry-']")) {
    entry.setAttribute("aria-selected", String(entry === node));
  }
  const diff = view.querySelector("[data-testid='history-diff']");
  diff.replaceChildren(element("p", { class: "notice", text: "載入中…" }));
  try {
    const url = `${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/history/${change.sha}`;
    const response = await fetch(url);
    if (!response.ok) throw new Error(await loadErrorText(response));
    const version = await response.json();
    if (generation !== historyGeneration) return;
    renderDiff(diff, version, detail, view);
  } catch (error) {
    if (generation !== historyGeneration) return;
    diff.replaceChildren(element("div", { class: "notice error", "data-testid": "history-diff-error" }, [
      element("strong", { text: "讀不到這一版的內容。" }),
      element("pre", { text: String(error && error.message ? error.message : error) }),
    ]));
  }
}

// 那一版 vs 目前版本，以參數為單位（§7.6.2）：same／changed／added（那版沒有、現在有）／removed。
function renderDiff(target, version, detail, view) {
  // 那一版（左）vs 目前版本（右），與 W5 共用同一套比對與列（paramDiff／diffRow）。
  const compared = paramDiff(version, detail);
  const rows = compared.map((row) => diffRow(row, "diff-from", "diff-to", "→"));
  const differing = compared.filter((row) => row.change !== "same").length;
  // 退回此版本（#27、§5.3 圖 7）：看過差異才退；不可逆（會產生一筆新紀錄並寫出目標）→ W6 確認對話框。
  const revertButton = element("button", {
    type: "button", class: "editing-only", "data-testid": "history-revert", text: "退回此版本",
  });
  revertButton.disabled = differing === 0;
  revertButton.title = differing === 0 ? "這一版與目前版本相同，沒有東西可退" : "";
  revertButton.addEventListener("click", () => revertTo(view, detail, version, differing));
  target.replaceChildren(
    element("p", {
      class: "diff-summary", "data-testid": "history-diff-summary",
      text: differing ? `與目前版本相比：${differing} 個參數不同（左邊是那一版，右邊是目前）` : "與目前版本沒有參數不同。",
    }),
    element("ul", {}, rows),
    element("div", { class: "panel-actions" }, [
      element("span", { class: "hint", text: "退版會產生一筆新的變更紀錄並寫出到目標；歷史不會被改寫，之後仍可再退。" }),
      revertButton,
    ]),
  );
}

// 退版時 schema 跟著回到那一版（#39 的定案）。會改到開發者設的限制，所以確認框先說、完成後再說一次，
// 不讓它悄悄發生。沒有影響（null）就不提。
const SCHEMA_EFFECT_TEXT = {
  restore: "這份的 schema 也會回到那一版當時的內容——之後才加上的限制會一併退掉。",
  remove: "那一版當時還沒有 schema：退回後這份不再有 schema，修改不再依它檢查。",
};
const SCHEMA_DONE_TEXT = {
  restore: "schema 也回到了那一版當時的內容。",
  remove: "這份現在沒有 schema。",
};

async function revertTo(view, detail, version, differing) {
  const short = version.sha.slice(0, 7);
  const ok = await confirmAction(
    "退回此版本？",
    `「${detail.name}」會回到版本 ${short} 的內容：${differing} 個參數會改變、並寫出到目標。` +
    "這會產生一筆新的變更紀錄；歷史不會被改寫，之後仍可再退。" + (SCHEMA_EFFECT_TEXT[version.schema_effect] || ""),
  );
  if (!ok) return;
  const diff = view.querySelector("[data-testid='history-diff']");
  try {
    const response = await fetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}/revert`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ version: version.sha }),
    });
    const payload = await response.json();
    if (!response.ok) {
      // 409（有未進版草稿）／422／500：原樣顯示後端的原因與下一步，差異區保留讓人重看。
      diff.prepend(element("div", { class: "notice error", "data-testid": "history-revert-error" }, [
        element("strong", { text: "沒有退版。" }),
        element("pre", { text: detailText(payload.detail) }),
      ]));
      return;
    }
    // 目前版本變了：重抓單筆內容、重開歷史（列表多一筆退回舊版本），左側樹重掃狀態。
    load();
    const fresh = await fetch(`${API_BASE}/api/configs/${encodeURIComponent(detail.uid)}`);
    const freshDetail = fresh.ok ? await fresh.json() : detail;
    openHistory(freshDetail, `已退回到版本 ${short}，並寫出到目標。${SCHEMA_DONE_TEXT[payload.schema_effect] || ""}`);
  } catch (error) {
    diff.prepend(element("div", { class: "notice error", "data-testid": "history-revert-error" }, [
      element("strong", { text: "沒有退版。" }),
      element("pre", { text: `送不出去：${error && error.message ? error.message : error}` }),
    ]));
  }
}

// ── W5 差異檢視（#30）────────────────────────────────────────────────────────
// 只在偏離時出現（§7.7、ADR-00000008）：橫幅說明目標被介面外修改、沒有對應紀錄與作者；主區域是
// 來源（repo，唯一真實來源）與目標（磁碟現況）的並排參數比對——使用者要做的是「判斷哪一邊是對的」，
// 並排比合併差異更貼這個決策。呈現與 W4 歷史差異同一套（參數為單位、同樣的 data-change 與顏色）。
// 處置的三個按鈕是 #31。
function driftBanner(detail, withEntry) {
  const banner = element("div", { class: "notice error drift-banner", "data-testid": "drift-banner" }, [
    element("strong", { text: "偏離：目標檔案內容與 repo 不一致。" }),
    element("p", {
      text: "此修改未經介面進行，因此沒有對應的變更紀錄與作者資訊。請比對兩邊，判斷哪一邊是對的。",
    }),
  ]);
  if (withEntry) {
    const open = element("button", { type: "button", "data-testid": "panel-diff", text: "檢視差異" });
    open.addEventListener("click", () => openDiffView(detail));
    banner.appendChild(element("div", { class: "actions" }, [open]));
  }
  return banner;
}

// 兩棵值樹以參數為單位比：same／changed／added（右邊有、左邊沒有）／removed（左邊有、右邊沒有）。
// W4（那一版 vs 目前）與 W5（來源 vs 目標）共用，顏色語言因此一致。
function paramDiff(left, right) {
  const leaves = (payload) => new Map(
    paramRows({ types: payload.types || {}, values: payload.values || {}, draft_values: null })
      .filter((row) => !row.container)
      .map((row) => [row.path, displayValue(row.value, row.type)]),
  );
  const older = leaves(left);
  const current = leaves(right);
  const paths = [...current.keys(), ...[...older.keys()].filter((path) => !current.has(path))];
  return paths.map((path) => {
    const from = older.get(path);
    const to = current.get(path);
    let change = "same";
    if (from === undefined) change = "added";
    else if (to === undefined) change = "removed";
    else if (from !== to) change = "changed";
    return { path, from, to, change };
  });
}

function diffRow(row, fromTestid, toTestid, separator) {
  return element("li", { class: "diff-row", "data-testid": `diff-row-${row.path}`, "data-change": row.change }, [
    element("span", { class: "diff-name", text: row.path.replace(/\\\./g, ".") }),
    element("span", { class: "diff-from", "data-testid": fromTestid, text: row.from === undefined ? "（無）" : row.from }),
    element("span", { text: separator }),
    element("span", { class: "diff-to", "data-testid": toTestid, text: row.to === undefined ? "（無）" : row.to }),
  ]);
}
