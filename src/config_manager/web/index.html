<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>config_manager</title>
<!--
  單一 HTML ＋ 原生 JS（設計文件 §3.3）：v0.10.0 的畫面是清單、按鈕與差異顯示，
  以 fetch 呼叫 §3.5.3 的端點即可，不需框架也不需打包步驟。

  元素的 data-testid 與可見文字依 doc/UI-ELEMENTS.md 的 W2，不是隨手取的：
  測試以語意屬性選取，不以 CSS class 或 DOM 路徑（ADR-00000019）。改動這裡就要
  同步那份文件，否則「有測試」會變成假象。

  這一版只有清單與狀態（#7）。身分輸入、參數表、歷史、差異檢視隨各自的 issue 加入。
-->
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1b1b;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --panel: #f7f7f7;
    --in-sync: #2e7d32;
    --drift: #c62828;
    --missing: #9e9e9e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --fg: #e8e8e8;
      --muted: #9aa0a6;
      --line: #2c2f33;
      --panel: #1d2023;
      --in-sync: #66bb6a;
      --drift: #ef5350;
      --missing: #8a8f94;
    }
  }
  * { box-sizing: border-box; }
  /* 瀏覽器預設的 [hidden]{display:none} 會被下面任何一條 display 宣告蓋過
     ——header 的 display:flex 就蓋掉了它，於是「隱藏」的頁首照樣顯示。
     這是 hidden 屬性最常見的失效方式，用 !important 釘住。 */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .grow { flex: 1; }
  button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  input[type="search"] {
    font: inherit;
    padding: 6px 10px;
    min-width: 220px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  main { padding: 16px 20px 40px; }
  .group { margin-bottom: 22px; }
  .group > h2 {
    font-size: 13px;
    letter-spacing: .04em;
    color: var(--muted);
    margin: 0 0 6px;
    font-weight: 600;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 6px;
  }
  li + li { border-top: 1px solid var(--line); }
  li:hover { background: var(--panel); }
  .dot {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    align-self: center;
  }
  .dot-in_sync { background: var(--in-sync); }
  .dot-drift   { background: var(--drift); }
  .dot-missing { background: var(--missing); }
  .name { font-weight: 500; }
  .target {
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .state { margin-left: auto; flex: none; font-size: 13px; color: var(--muted); }
  .notice {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
  }
  .notice.error { border-color: var(--drift); color: var(--drift); }
  .notice.error pre {
    margin: 8px 0 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
  }

  /* W1 身分輸入。刻意不叫「登入」——沒有認證機制，說登入會誤導（CONTEXT.md）。 */
  #identity {
    max-width: 420px;
    margin: 60px auto;
    padding: 26px 28px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
  }
  #identity h2 { margin: 0 0 6px; font-size: 17px; }
  #identity .why { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  #identity label { display: block; margin-bottom: 14px; font-size: 13px; }
  #identity label span { display: block; margin-bottom: 4px; color: var(--muted); }
  #identity input[type="text"], #identity input[type="email"] {
    font: inherit;
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  /* 角色是兩個並排的選項按鈕，明顯可見，不藏在選單裡（ADR-00000020、W1）。 */
  .roles { display: flex; gap: 8px; margin: 4px 0 20px; }
  .roles button { flex: 1; }
  .roles button[aria-pressed="true"] {
    border-color: var(--fg);
    background: var(--bg);
    font-weight: 600;
  }
  #identity .enter { width: 100%; padding: 9px; font-weight: 600; }
  #identity .error {
    margin: 0 0 16px;
    color: var(--drift);
    font-size: 13px;
  }
  .who { color: var(--muted); font-size: 13px; }

  /* W7 檔案瀏覽 */
  #browse { padding: 16px 20px 40px; }
  .browse-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .breadcrumb {
    display: flex; flex-wrap: wrap; gap: 2px; align-items: baseline;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
  }
  .breadcrumb button {
    border: none; background: none; padding: 2px 4px; color: var(--fg);
    cursor: pointer; font: inherit;
  }
  .breadcrumb button:hover { text-decoration: underline; }
  .breadcrumb .sep { color: var(--muted); }
  .browse-path {
    flex: none; min-width: 260px; font: inherit; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
  }
  .browse-hint { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .browse-hint:empty { display: none; }
  .browse-roots, .browse-list {
    list-style: none; margin: 0 0 14px; padding: 0;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  .browse-roots:empty, .browse-list:empty { display: none; }
  .browse-roots li, .browse-list li {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer;
  }
  .browse-roots li + li, .browse-list li + li { border-top: 1px solid var(--line); }
  .browse-roots li:hover, .browse-list li:hover { background: var(--panel); }
  .browse-name { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
  .browse-list li[data-kind="dir"] .browse-name { font-weight: 600; }
  .browse-list .kind { color: var(--muted); font-size: 12px; margin-left: auto; }
  .browse-selection { font-size: 13px; color: var(--in-sync); font-weight: 600; }
  .browse-rejected {
    padding: 14px 16px; border: 1px solid var(--drift); border-radius: 8px;
    background: var(--panel); color: var(--drift);
  }
  .browse-rejected .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
  .browse-rejected .add-row { display: flex; gap: 8px; margin-top: 12px; }
  .browse-rejected input {
    flex: 1; font: inherit; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--fg);
  }
  .allowed-range {
    margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
</style>
</head>
<body>

<form id="identity" data-testid="identity-form" hidden>
  <h2>請輸入身分資訊</h2>
  <p class="why">
    這不是登入。沒有密碼，也不會驗證——你填的姓名與 email 會成為變更紀錄的作者，
    讓每一次改動追溯得到人。
  </p>

  <p class="error" data-testid="identity-error" hidden></p>

  <label>
    <span>姓名</span>
    <input type="text" name="name" data-testid="identity-name" autocomplete="name" required>
  </label>
  <label>
    <span>Email</span>
    <input type="email" name="email" data-testid="identity-email" autocomplete="email" required>
  </label>

  <span id="role-label">角色</span>
  <div class="roles" data-testid="role-toggle" role="group" aria-labelledby="role-label">
    <button type="button" data-role="user" aria-pressed="true">一般使用者</button>
    <button type="button" data-role="developer" aria-pressed="false">🔧 開發者</button>
  </div>

  <button type="submit" class="enter">進入</button>
</form>

<header hidden>
  <h1>config_manager</h1>
  <input type="search" data-testid="search-input" placeholder="搜尋" aria-label="搜尋">
  <span class="grow"></span>
  <span class="who" data-testid="current-role"></span>
  <button type="button" data-testid="open-browse">納管</button>
  <button type="button" data-testid="rescan">檢查差異</button>
</header>

<main hidden>
  <div id="tree" data-testid="config-tree"></div>
</main>

<!-- W7 檔案瀏覽（#13）：受白名單限制的瀏覽，供納管時選定路徑。獨立整頁 view，
     從工具列「納管」開啟。元素的 data-testid 與可見文字依 UI-ELEMENTS.md 的 W7。 -->
<section id="browse" data-testid="browse" hidden>
  <div class="browse-bar">
    <button type="button" class="browse-back">返回</button>
    <nav data-testid="breadcrumb" class="breadcrumb"></nav>
    <span class="grow"></span>
    <input type="text" data-testid="browse-path-input" class="browse-path"
           placeholder="貼上或輸入絕對路徑…" aria-label="絕對路徑">
    <button type="button" class="browse-go">前往</button>
  </div>
  <p class="browse-hint" data-testid="browse-hint"></p>
  <ul data-testid="browse-roots" class="browse-roots"></ul>
  <ul data-testid="browse-list" class="browse-list"></ul>
  <p class="browse-selection" data-testid="browse-selection" hidden></p>
  <div class="browse-rejected" data-testid="browse-rejected" hidden></div>
</section>

<script>
// 狀態的中文說法取自 CONTEXT.md，不在這裡另造。「未納管」不會出現在這份清單裡
// ——它的定義是「不在清單檔中」，而這份清單就是清單檔。它屬於納管流程的畫面。
const STATE_TEXT = {
  in_sync: "一致",
  drift: "偏離",
  missing: "未部署",
};

// 前端與 backend 是兩個容器、兩個 port（設計文件 §3.1），所以這裡不能用相對路徑
// ——相對路徑會打到供應這個檔案的靜態伺服器上，得到 404。
//
// 由 location 推導而不是寫死 127.0.0.1：用 IP 或主機名開這個頁面時（機器人在
// 區網上的常態），寫死的位址會指到看頁面的那台電腦自己。backend 那邊要放行
// 對應的來源，見 CM_ALLOWED_ORIGINS。
const API_BASE = window.CM_API_BASE || `${location.protocol}//${location.hostname}:8080`;

const UNGROUPED = "ungrouped";
const tree = document.querySelector("[data-testid='config-tree']");
const search = document.querySelector("[data-testid='search-input']");
let rows = [];

function groupsOf(row) {
  return row.groups && row.groups.length ? row.groups : [UNGROUPED];
}

// 一份 config 屬多個群組時，在每個群組節點下都出現（T16）。
function byGroup(items) {
  const buckets = new Map();
  for (const row of items) {
    for (const group of groupsOf(row)) {
      if (!buckets.has(group)) buckets.set(group, []);
      buckets.get(group).push(row);
    }
  }
  return [...buckets.entries()].sort(([a], [b]) => {
    if (a === UNGROUPED) return 1;
    if (b === UNGROUPED) return -1;
    return a.localeCompare(b);
  });
}

function matches(row, query) {
  if (!query) return true;
  const needle = query.toLowerCase();
  return [row.name, row.hostname, row.target, row.ref]
    .some((field) => String(field).toLowerCase().includes(needle));
}

function element(tag, attributes, children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attributes || {})) {
    if (key === "text") node.textContent = value;
    else node.setAttribute(key, value);
  }
  for (const child of children || []) node.appendChild(child);
  return node;
}

function rowNode(row) {
  // 狀態色點在左，與草稿標記（右側，隨 T18 加入）分開——UI-ELEMENTS W2 的左側樹。
  return element("li", { "data-testid": `tree-item-${row.uid}` }, [
    element("span", {
      class: `dot dot-${row.state}`,
      "data-testid": "status-dot",
      "data-state": row.state,
      title: STATE_TEXT[row.state] || row.state,
    }),
    element("span", { class: "name", text: row.name }),
    element("span", { class: "target", text: row.target }),
    element("span", { class: "state", text: STATE_TEXT[row.state] || row.state }),
  ]);
}

function render() {
  const visible = rows.filter((row) => matches(row, search.value.trim()));
  tree.replaceChildren();

  if (!rows.length) {
    // 什麼都還沒納管是合法狀態，不是錯誤——說出來，而不是留一片空白讓人以為壞了。
    tree.appendChild(element("p", {
      class: "notice",
      "data-testid": "empty-state",
      text: "還沒有納管任何 config。",
    }));
    return;
  }
  if (!visible.length) {
    tree.appendChild(element("p", {
      class: "notice",
      "data-testid": "no-matches",
      text: "沒有符合的項目。",
    }));
    return;
  }

  for (const [group, items] of byGroup(visible)) {
    tree.appendChild(element("section", {
      class: "group",
      "data-testid": `tree-group-${group}`,
    }, [
      element("h2", { text: group === UNGROUPED ? "未分群" : group }),
      element("ul", {}, items.map(rowNode)),
    ]));
  }
}

async function load() {
  try {
    const response = await fetch(`${API_BASE}/api/configs`);
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    rows = await response.json();
    render();
  } catch (error) {
    // 大聲失敗（不變式 2）：說出是什麼壞了，不是顯示一份空清單假裝沒事——
    // 空清單與「讀不到清單」看起來一樣，而那兩件事該做的處置完全不同。
    tree.replaceChildren(element("div", {
      class: "notice error",
      "data-testid": "load-error",
    }, [
      element("strong", { text: "讀不到 config 清單。" }),
      element("pre", { text: String(error && error.message ? error.message : error) }),
    ]));
  }
}

search.addEventListener("input", render);
document.querySelector("[data-testid='rescan']").addEventListener("click", load);

// ── W1 身分輸入 ──────────────────────────────────────────────────────────────
// 不是登入：沒有密碼、不驗證、角色是自我宣告（ADR-00000020）。唯一的用途是成為
// 變更紀錄的作者。文案一律用「身分輸入」，因為說「登入」會讓人以為有存取控制
// （CONTEXT.md「避免使用的說法」）。
const ROLE_TEXT = { user: "一般使用者", developer: "開發者" };

const identityForm = document.querySelector("[data-testid='identity-form']");
const identityError = document.querySelector("[data-testid='identity-error']");
const roleToggle = document.querySelector("[data-testid='role-toggle']");
const currentRole = document.querySelector("[data-testid='current-role']");
const header = document.querySelector("header");
const listView = document.querySelector("main");

function selectedRole() {
  const pressed = roleToggle.querySelector("[aria-pressed='true']");
  return pressed ? pressed.dataset.role : "user";
}

roleToggle.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-role]");
  if (!button) return;
  for (const option of roleToggle.querySelectorAll("button[data-role]")) {
    option.setAttribute("aria-pressed", String(option === button));
  }
});

function showIdentityForm() {
  identityForm.hidden = false;
  header.hidden = true;
  listView.hidden = true;
}

// 目前身分。browse 的拒絕 UX 依角色分流（開發者才有加入白名單入口），返回也靠它。
let currentIdentity = null;

function showList(identity) {
  currentIdentity = identity;
  identityForm.hidden = true;
  header.hidden = false;
  listView.hidden = false;
  browseView.hidden = true;
  currentRole.textContent = `${identity.name}・${ROLE_TEXT[identity.role] || identity.role}`;
  load();
}

identityForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  identityError.hidden = true;

  const body = {
    name: identityForm.elements.name.value,
    email: identityForm.elements.email.value,
    role: selectedRole(),
  };

  try {
    const response = await fetch(`${API_BASE}/api/session`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const payload = await response.json();
    if (!response.ok) {
      // 端點的訊息已經寫成可行動的樣子（欄位＋原因＋下一步），原樣顯示，
      // 不在這裡改寫成一句籠統的「輸入無效」（不變式 2）。
      identityError.textContent = payload.detail || `${response.status} ${response.statusText}`;
      identityError.hidden = false;
      return;
    }
    showList(payload);
  } catch (error) {
    identityError.textContent = `送不出去：${error && error.message ? error.message : error}`;
    identityError.hidden = false;
  }
});

// ── W7 檔案瀏覽（#13）─────────────────────────────────────────────────────────
// 受白名單限制的瀏覽，供納管時選定路徑。獨立整頁 view，從工具列「納管」開啟。
// 白名單根為起點（GET /api/allowed-roots）；下鑽用後端回應的每個 entry.path，不在前端
// 拼路徑；麵包屑與目前位置用回應的 path（realpath）。拒絕依 kind＋角色分流（只有
// outside_roots 給開發者「加入白名單」入口，一般使用者看唯讀允許範圍）。
const browseView = document.querySelector("[data-testid='browse']");
const browseRootsEl = document.querySelector("[data-testid='browse-roots']");
const browseListEl = document.querySelector("[data-testid='browse-list']");
const breadcrumbEl = document.querySelector("[data-testid='breadcrumb']");
const browsePathInput = document.querySelector("[data-testid='browse-path-input']");
const browseSelectionEl = document.querySelector("[data-testid='browse-selection']");
const browseRejectedEl = document.querySelector("[data-testid='browse-rejected']");
const browseHintEl = document.querySelector("[data-testid='browse-hint']");

let whitelistRoots = [];

function showBrowse() {
  identityForm.hidden = true;
  header.hidden = true;
  listView.hidden = true;
  browseView.hidden = false;
  loadBrowseRoots();
}

async function loadBrowseRoots() {
  breadcrumbEl.replaceChildren();
  browseListEl.replaceChildren();
  browseSelectionEl.hidden = true;
  browseRejectedEl.hidden = true;
  try {
    const response = await fetch(`${API_BASE}/api/allowed-roots`);
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    whitelistRoots = (await response.json()).prefixes;
    browseRootsEl.replaceChildren(...whitelistRoots.map((prefix) =>
      element("li", { "data-testid": `browse-root-${prefix}`, "data-path": prefix }, [
        element("span", { class: "browse-name", text: prefix }),
      ])
    ));
    browseHintEl.textContent = whitelistRoots.length
      ? "挑一個允許瀏覽的根開始，或在上方貼一個絕對路徑。"
      : "白名單目前是空的。";
  } catch (error) {
    browseHintEl.textContent = `讀不到白名單：${error && error.message ? error.message : error}`;
  }
}

async function browseTo(path) {
  browseRejectedEl.hidden = true;
  try {
    const response = await fetch(`${API_BASE}/api/browse?path=${encodeURIComponent(path)}`);
    const payload = await response.json();
    if (!response.ok) {
      renderBrowseRejection(payload.detail, path);
      return;
    }
    // 進入某目錄後，起點根清單讓位給內容。
    browseRootsEl.replaceChildren();
    browseHintEl.textContent = "";
    renderBreadcrumb(payload.path);
    renderBrowseEntries(payload.entries);
  } catch (error) {
    browseHintEl.textContent = `瀏覽失敗：${error && error.message ? error.message : error}`;
  }
}

function renderBrowseEntries(entries) {
  browseListEl.replaceChildren(...entries.map((entry) =>
    element("li", {
      "data-testid": `browse-entry-${entry.name}`,
      "data-kind": entry.kind,
      "data-name": entry.name,
      "data-path": entry.path,
    }, [
      element("span", { class: "browse-name", text: entry.name }),
      element("span", { class: "kind", text: entry.kind === "dir" ? "目錄" : "檔案" }),
    ])
  ));
}

function renderBreadcrumb(path) {
  // 夾在白名單根為界：找出含這條路徑的根，只從根往下顯示（上溯不越過根）。
  const root = whitelistRoots.find((r) => path === r || path.startsWith(`${r}/`));
  const nodes = [];
  const pushSegment = (label, target) => {
    if (nodes.length) nodes.push(element("span", { class: "sep", text: "›" }));
    const seg = element("button", { type: "button", "data-path": target, text: label });
    seg.addEventListener("click", () => browseTo(target));
    nodes.push(seg);
  };
  if (root) {
    pushSegment(root, root);
    let acc = root;
    for (const part of path.slice(root.length).split("/").filter(Boolean)) {
      acc += `/${part}`;
      pushSegment(part, acc);
    }
  } else {
    // 手動路徑落在任何已知根之外（少見；通常會先被拒）——退回顯示完整路徑各段。
    let acc = "";
    for (const part of path.split("/").filter(Boolean)) {
      acc += `/${part}`;
      pushSegment(part, acc);
    }
  }
  breadcrumbEl.replaceChildren(...nodes);
}

function selectBrowseFile(path) {
  browseSelectionEl.textContent = `已選：${path}`;
  browseSelectionEl.hidden = false;
}

function renderBrowseRejection(detail, attempted) {
  // detail 是 {kind, message}（#13）。原樣顯示 message（含下一步，不改寫）；依 kind＋角色
  // 決定：只有 outside_roots 給加入白名單入口，開發者可加、一般使用者看唯讀允許範圍。
  const kind = detail && detail.kind;
  const message = (detail && detail.message) || String(detail);
  browseListEl.replaceChildren();
  const children = [
    element("strong", { text: "無法瀏覽這個路徑。" }),
    element("p", { class: "msg", text: message }),
  ];
  if (kind === "outside_roots") {
    if (currentIdentity && currentIdentity.role === "developer") {
      const prefixInput = element("input", {
        type: "text",
        "data-testid": "whitelist-prefix-input",
      });
      prefixInput.value = attempted;  // 預填被拒的路徑，可編輯
      const addButton = element("button", { type: "button", text: "加入白名單" });
      addButton.addEventListener("click", () => addToWhitelist(prefixInput.value));
      children.push(element("div", { class: "add-row" }, [prefixInput, addButton]));
    } else {
      children.push(element("p", {
        text: "請開發者代為加入白名單。目前允許瀏覽的範圍：",
      }));
      children.push(element("ul", {
        class: "allowed-range", "data-testid": "allowed-range",
      }, whitelistRoots.map((prefix) => element("li", { text: prefix }))));
    }
  }
  browseRejectedEl.replaceChildren(...children);
  browseRejectedEl.setAttribute("data-kind", kind || "browse_error");
  browseRejectedEl.hidden = false;
}

async function addToWhitelist(prefix) {
  const showAddError = (text) => {
    const slot = browseRejectedEl.querySelector(".msg");
    if (slot) slot.textContent = text;
  };
  try {
    const response = await fetch(`${API_BASE}/api/allowed-roots`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ prefix }),
    });
    const payload = await response.json();
    if (!response.ok) {
      // 端點的訊息已可行動（含下一步），原樣顯示，不改寫（不變式 2）。
      const text = typeof payload.detail === "string"
        ? payload.detail
        : (payload.detail && payload.detail.message) || `${response.status}`;
      showAddError(text);
      return;
    }
    whitelistRoots = payload.prefixes;
    browseRejectedEl.hidden = true;
    browseTo(prefix);  // 重跑被拒的瀏覽——該路徑現在在白名單內了
  } catch (error) {
    showAddError(`送不出去：${error && error.message ? error.message : error}`);
  }
}

browseRootsEl.addEventListener("click", (event) => {
  const li = event.target.closest("li[data-path]");
  if (li) browseTo(li.dataset.path);
});

browseListEl.addEventListener("click", (event) => {
  const li = event.target.closest("li[data-testid^='browse-entry-']");
  if (!li) return;
  if (li.dataset.kind === "dir") browseTo(li.dataset.path);
  else selectBrowseFile(li.dataset.path);
});

document.querySelector("[data-testid='open-browse']").addEventListener("click", showBrowse);
browseView.querySelector(".browse-back").addEventListener("click", () => showList(currentIdentity));
browseView.querySelector(".browse-go").addEventListener("click", () => {
  const path = browsePathInput.value.trim();
  if (path) browseTo(path);
});

// 已經輸入過身分就直接進清單（重新整理不必再填一次）。
(async function start() {
  try {
    const response = await fetch(`${API_BASE}/api/session`);
    const identity = response.ok ? await response.json() : null;
    if (identity) {
      showList(identity);
      return;
    }
  } catch (error) {
    // backend 連不上時仍顯示身分輸入頁：那是使用者唯一能操作的東西，
    // 而送出時的錯誤會說明真正的問題。
  }
  showIdentityForm();
})();
</script>
