[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test/pytest"]

# ── Lint 門檻 ───────────────────────────────────────────────────────────────
# 這些數字是設計 §0.6 以暫定文字記下的那一組。現在它們住在這裡，於是變成檢查得了的
# ；文件只留下每個值當初為何這樣選。沒有工具檢查得了的規範等於不存在。

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "PL", "B", "BLE", "RET", "SIM", "UP"]
# C901 循環複雜度 <= 10、PLR0915 函式長度 <= 50 個 statement、
# PLR0913 參數數量 <= 5、E722 與 BLE001 不得使用 bare／blind except。

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 5

[tool.mypy]
# 只對 core/ 做完整覆蓋：那是型別錯誤代價最高的一層，而且沒有 I/O 可以躲在後面。
files = ["src/config_manager/core"]
strict = true

[tool.pylint.format]
max-module-lines = 1000

[tool.pylint."messages control"]
# ruff 已經會回報這些；同一個發現由兩支工具各報一次，只會訓練出「兩邊都略讀」。
disable = ["missing-docstring", "line-too-long"]

[tool.pylint.design]
max-nested-blocks = 3

[tool.coverage.run]
source = ["src/config_manager/core"]

[tool.coverage.report]
# 只算 core/。io/ 與 api/ 在整合與系統層級被覆蓋，那才是它們的行為真正所在之處；
# 對一個 I/O wrapper 算行覆蓋率，量到的是那個 mock，不是程式碼。
fail_under = 85
show_missing = true
