# 驗收檢查點 → 規格 的對照表。
#
# 設計文件 §8.2 為每一版列了一組驗收檢查點。「那一版通過了沒有」在此之前只存在於
# 一段散文裡，而**無法複驗，就等於無法證明**：一份手寫的「已通過」表格，與這個 repo
# 已經抓到八次的「宣稱有檢查其實沒檢查」是同一種東西（#148）。
#
# 這份檔案是那些檢查點與**實際會被執行的規格**之間的對照。判定由
# `script/acceptance.sh <milestone>` 跑出來，不由這裡寫下來——這裡只說「PDF 的哪一句
# 該由誰驗」，說不了「它過了沒有」。
#
# ## 為什麼是資料不是程式碼
#
# 新增一條檢查點不該需要改腳本。腳本裡的一張 case 表，每加一條就要動一次控制流，
# 而動控制流的地方就是會壞的地方；資料的改動在 diff 上是一段可以逐字對回 PDF 的文字。
# 同一個理由讓覆蓋率閾值住在 pyproject.toml 而不是 coverage_gate.sh 裡（§0.4：
# 「調整需修改設定檔並在 PR 中說明理由——使放寬本身成為可見的決策」）。
#
# ## 為什麼與 doc/TEST-PLAN.md 分開
#
# 兩者的讀者與更新時機不同。TEST-PLAN 講的是**測試介面**——從哪個位置觀察行為——它
# 隨著程式碼的形狀改變；這份講的是**驗收檢查點 → 規格**，它隨著設計文件 §8.2 改變，
# 而 §8.2 幾乎不動。混在一起，維護的人每次都要先分辨自己在改哪一種東西
# （ADR-00000024：兩份寫著同一件事，只有一份會被讀）。
#
# ## 一條檢查點怎麼切
#
# **以 §8.2 該版塊的句號斷句，一句一條。** 這不是自訂的顆粒度，是 PDF 自己的：
# v0.1.0 依此切出來的五條，與 #148 手工列出的五條逐條相同。唯一的例外是 v0.9.0
# 第 2 條，它的後半句「全程無需詢問操作方式」是前一句的補述，獨立成條會得到一個
# 沒有主詞的片段——併入前句，並記在這裡，免得日後被讀成漏了一條。
#
# 文字逐字抄自 §8.2（去掉句尾的句號）。**它與 PDF 的一致性目前沒有工具在檢查**：
# 檢查映像裡沒有 pdftotext，而為了一份幾乎不動的文件把 PDF 解析拖進映像不划算。
# 這是一個已知的洞，寫在這裡是為了它不要被當成已經驗過的東西。
#
# ## 規格參照怎麼寫
#
#   test/pytest/<層級>/<檔>.py                 整個 pytest 規格檔
#   test/pytest/<層級>/<檔>.py::<測試名>       單一 pytest 規格
#   test/bats/<層級>/<檔>.bats                 整個 bats 規格檔
#   test/bats/<層級>/<檔>.bats::<測試名>       單一 bats 規格
#
# **指到不存在的東西是失敗，不是安靜跳過。** acceptance.sh 在跑任何東西之前先逐條
# 解析：檔案要在、測試名要收得到、至少要收到一條。解析不過就整份報表非零結束，
# 一條判定都不印——一份對照表已經對不上的報表，它印出來的「通過」沒有意義。
#
# ## specs = [] 是什麼意思
#
# **未涵蓋，而不是通過。** 那正是這份報表要防的東西：沒有人在驗的檢查點，在散文裡
# 與驗過的檢查點長得一模一樣。`uncovered` 欄位讓那個洞帶著理由，**但理由不改變判定**
# ——寫理由是為了讓讀者知道那個洞是已知的，不是為了把它關掉。
#
# 未落地的版本（v0.2.0 以後）因此整版都是未涵蓋。那是正確的答案：那些功能還沒做，
# 對照表沒有東西可以指。它們現在就列在這裡，是因為 `acceptance.sh v0.5.0` 應該回答
# 「五條全部未涵蓋」，而不是「沒這個 milestone」——後者會讓一個打錯的版號看起來像通過。

