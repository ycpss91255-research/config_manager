[[milestone]]
id = 'v0.9.0'
title = '部署模式與 UX'

[[milestone.checkpoint]]
number = 1
text = '部署模式下不顯示「記住此裝置」，閒置 10 分鐘自動退出並釋放編輯階段，剩餘 1 分鐘時提示可延長；模式由 backend 判定，前端改動無法繞過'
# 「前端改動無法繞過」的邊界（維護者 11/14 在 #355 的定案，選 A）：指後端管得到的**模式判定**
# 與**閒置退出**——模式由後端回報、HTTP 改不了，閒置由後端計時並釋放編輯階段。瀏覽器端的
# localStorage（「記住此裝置」存的名字與 email）後端技術上管不到，不在這一句的保證內；
# 部署模式要不要開放「記住此裝置」另在 #372。
specs = [
  'test/pytest/system/test_web.py::test_remember_device_is_offered_in_development_mode_only',
  'test/pytest/system/test_api.py::test_ten_idle_minutes_end_the_identity_and_release_the_session',
  'test/pytest/system/test_web.py::test_ten_idle_minutes_on_the_real_backend_end_the_page_session',
  'test/pytest/system/test_api.py::test_the_idle_status_says_how_long_is_left_and_when_the_warning_starts',
  'test/pytest/system/test_api.py::test_activity_extends_the_identity_and_the_session',
  'test/pytest/system/test_web.py::test_a_minute_before_the_timeout_a_warning_says_what_will_happen',
  'test/pytest/system/test_web.py::test_continuing_reports_activity_and_dismisses_the_warning',
  'test/pytest/system/test_api.py::test_the_backend_reports_the_mode_and_defaults_to_deployment',
  'test/pytest/system/test_api.py::test_the_mode_cannot_be_changed_over_http',
]

[[milestone.checkpoint]]
number = 2
# §8.2 這裡有兩個句號。後半句「全程無需詢問操作方式」是前一句的補述，
# 獨立成條會得到一個沒有主詞的片段，所以併入前句——這是句號斷句規則的唯一例外。
text = '由未參與開發的同事在無人指導下完成：納管一份新 config、修改並儲存、故意輸入錯誤值並依錯誤訊息自行修正、查看歷史並退版、處理一次偏離。全程無需詢問操作方式'
# A5 是人工驗收旅程（TEST-PLAN：「只能由真的沒摸索過的人來測」），沒有任何自動化規格
# 驗得了它，所以是人工檢查點（#355）：U42 做完、簽核寫進這裡之前，它是人工待驗，
# 而人工待驗不是通過。一條需要人的檢查點，不該因為機器跑完了就變成綠的。
manual = true

# ── v0.10.0 功能完整 ──────────────────────────────────────────────────────

[[milestone]]
id = 'v0.10.0'
title = '功能完整（發布檢查點）'

[[milestone.checkpoint]]
number = 1
text = '以實際專案的至少 10 份 config 完成納管，連續使用兩週無資料遺失；期間所有修改皆可從變更紀錄追溯至具體人員與時間；至少完成一次真實的退版；至少偵測到一次真實的偏離並正確處置；容器重啟後狀態完整保留；備份與復原程序實際演練過一次'
# 發布檢查點的驗收方式是連續兩週的真實使用，不是一次執行。與 v0.9.0 第 2 條同一種：
# 需要人與時間的檢查點，是人工檢查點（#355）。
manual = true
